function restoreOrderStock(order){
  for(const item of (order.items||[])){
    const p=getProduct(item.productId);
    if(!p) continue;
    if(p.type==='simple'){
      p.stock = Number(p.stock||0) + Number(item.qty||0);
    }else{
      for(const c of (p.components||[])){
        const comp=getProduct(c.productId);
        if(productTracksStock(comp)) comp.stock = Number(comp.stock||0) + Number(c.qty||0)*Number(item.qty||0);
      }
    }
  }
}
function openReturnConfirm(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order) return;
  if(order.returnedAt){ flash('Этот чек уже возвращён'); return; }
  const shift=currentShift();
  if(!shift){ flash('Для возврата откройте кассовую смену'); return; }
  const total=Number(order.total||0);
  showModal(`
    <div class="modal-title">Возврат товара</div>
    <div class="settings-note" style="margin-bottom:14px;">Будет выполнен полный возврат чека. Все товары вернутся на склад, а покупателю будет возвращена сумма <b>${fullMoney(total)}</b>.</div>
    <div class="field"><label>Чек</label><div style="font-size:16px;font-weight:800;">${fmtDate(order.timestamp)} · ${order.method==='cash'?'Наличные':order.method==='card'?'Карта':'Наличные + карта'}</div></div>
    <div class="field"><label>К возврату</label><div style="font-size:26px;font-weight:800;">${fullMoney(total)}</div></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="viewReceiptModal('${escapeAttr(order.id)}')">Отмена</button>
      <button class="btn btn-danger" onclick="window.processFullReturn('${escapeAttr(order.id)}')">Вернуть ${fullMoney(total)}</button>
    </div>`);
}
function processFullReturn(orderId){
  try{
    const order=state.orders.find(o=>String(o.id)===String(orderId));
    const shift=currentShift();
    if(!order){flash('Чек не найден');return;}
    if(order.returnedAt){flash('Этот чек уже возвращён');return;}
    if(!shift){flash('Для возврата откройте кассовую смену');return;}
    const total=Math.round(Number(order.total||0)*100)/100;
    if(!(total>=0)){flash('Некорректная сумма возврата');return;}
    const refundCash=Array.isArray(order.payments)?order.payments.filter(p=>p.method==='cash').reduce((s,p)=>s+Number(p.amount||0),0):(order.method==='cash'?total:0);
    if(refundCash>0){
      const t=shiftTotals(shift.id);
      const available=Number(shift.openingCash||0)+Number(t.cash||0)+Number(t.netMovements||0);
      if(refundCash>available+0.0001){flash('Недостаточно наличных в кассе для возврата');return;}
    }
    restoreOrderStock(order);
    const now=Date.now();
    order.returnedAt=now;
    order.returnedShiftId=shift.id;
    order.returnAmount=total;
    if(!Array.isArray(shift.cashMovements)) shift.cashMovements=[];
    if(refundCash>0){
      shift.cashMovements.push({id:uid(),type:'withdrawal',subtype:'refund',amount:refundCash,timestamp:now,note:'Возврат чека'});
    }
    saveKey('products',state.products);
    saveKey('orders',state.orders);
    saveKey('shifts',state.shifts);
    closeModal();
    render();
    setTimeout(()=>showModal(`
      <div class="modal-title">Возврат выполнен</div>
      <div class="settings-note">Товары возвращены на остатки. ${refundCash>0?'Наличная часть списана из текущей кассовой смены как «Возврат чека».':''}${(order.method==='card'||order.method==='split')?' Карточная часть возвращается через банковский терминал.':''}</div>
      <div class="field"><label>Сумма возврата</label><div style="font-size:26px;font-weight:800;">${fullMoney(total)}</div></div>
      <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="viewReceiptModal('${escapeAttr(order.id)}')">Открыть чек</button><button type="button" class="btn btn-primary" onclick="closeModal()">Готово</button></div>`),50);
  }catch(e){
    console.error('processFullReturn error',e);
    flash('Не удалось выполнить возврат. Попробуйте ещё раз.');
  }
}
window.processFullReturn = processFullReturn;
window.openReturnConfirm = openReturnConfirm;

function printReceipt(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  if(window.webkit?.messageHandlers?.printer){
    window.webkit.messageHandlers.printer.postMessage({action:'print',order:order});
    flash('Чек отправлен на печать');
    return;
  }
  const body = document.getElementById('receipt-body');
  document.getElementById('print-area').innerHTML = body ? body.innerHTML : '';
  window.print();
}

function filterProductsScreen(){
  const input=document.getElementById('products-search');
  state.productsSearch=input?.value||'';
  const card=document.querySelector('.content-screen.active');
  if(!card) return render();
  const query=state.productsSearch.trim().toLowerCase();
  const rows=[...card.querySelectorAll('.list-row')];
  let visible=0;
  rows.forEach(row=>{
    const text=row.textContent.toLowerCase();
    const show=!query || text.includes(query);
    row.style.display=show?'flex':'none';
    if(show) visible++;
  });
  const badge=card.querySelector('.section-mini-head .badge');
  if(badge) badge.textContent=query?`${visible} / ${state.products.length}`:String(state.products.length);
  const clear=card.querySelector('[aria-label="Очистить поиск"]');
  if(clear) clear.style.display=query?'flex':'none';
}
function clearProductsSearch(){
  state.productsSearch='';
  const input=document.getElementById('products-search');
  if(input){ input.value=''; input.focus(); }
  filterProductsScreen();
}

  const input=document.getElementById('cf-color');
  if(input) input.value=color;
  document.querySelectorAll('.category-color-option').forEach(b=>b.classList.toggle('selected',b.dataset.color===color));

function saveCategory(oldName){
  const input=document.getElementById('cf-name');
  const name=(input?.value||'').trim();
  if(!name){ flash('Введите название категории'); return; }
  const duplicate=state.categoryOrder.some(c=>c.toLowerCase()===name.toLowerCase() && c!==oldName);
  if(duplicate){ flash('Такая категория уже существует'); return; }
  const color=document.getElementById('cf-color')?.value || '#EEF1F5';
  const symbol=(document.getElementById('cf-symbol')?.value||'').trim().slice(0,3);
  if(oldName===null || oldName===undefined){
    state.categoryOrder.push(name);
    state.categoryColors[name]=color;
    state.categoryOnline[name]=window._cmOnline !== false;
    if(symbol) state.categorySymbols[name]=symbol; else delete state.categorySymbols[name];
  } else {
    const idx=state.categoryOrder.indexOf(oldName);
    if(idx>=0) state.categoryOrder[idx]=name;
    state.products.forEach(p=>{ if(productCategoryKey(p)===oldName) p.category=name; });
    state.layoutTiles.forEach(t=>{ if(t.type==='category' && t.id===oldName) t.id=name; });
    if(oldName!==name) { delete state.categoryColors[oldName]; delete state.categorySymbols[oldName]; state.categoryOnline[name]=state.categoryOnline[oldName] !== false; delete state.categoryOnline[oldName]; }
    state.categoryColors[name]=color;
    state.categoryOnline[name]=window._cmOnline !== false;
    if(symbol) state.categorySymbols[name]=symbol; else delete state.categorySymbols[name];
    saveKey('products',state.products);
  }
  saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});
  closeModal(); render(); flash(oldName===null||oldName===undefined?'Категория добавлена':'Категория изменена');
}
function toggleCategoryOnline(name){
  state.categoryOnline[name]=state.categoryOnline[name]===false;
  saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});

}

function deleteCategory(name){
  const used=state.products.some(p=>productCategoryKey(p)===name);
  if(used){ flash('Нельзя удалить категорию: в ней есть товары'); return; }

function requestDelete(type, id){
  const title = type==='category' ? 'Удаление категории' : 'Удаление товара';

}
function confirmDelete(type,id){
  const pass=document.getElementById('delete-password')?.value||'';
  if(pass!=='Rom23061998'){ flash('Неверный пароль'); return; }
  if(type==='category'){
    if(state.products.some(p=>productCategoryKey(p)===id)){ flash('Нельзя удалить категорию: в ней есть товары'); return; }
    state.categoryOrder=state.categoryOrder.filter(c=>c!==id);
    delete state.categoryColors[id];
    delete state.categorySymbols[id];
    delete state.categoryOnline[id];
    state.layoutTiles=state.layoutTiles.filter(t=>!(t.type==='category' && t.id===id));
    saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});
    closeModal(); render(); flash('Категория удалена');
  } else {
    const usedIn=state.products.filter(p=>p.type==='composite' && (p.components||[]).some(c=>c.productId===id));
    if(usedIn.length){ flash('Товар используется в составном товаре «'+usedIn[0].name+'»'); return; }
    state.products=state.products.filter(p=>p.id!==id);

    state.layoutTiles=state.layoutTiles.filter(t=>!(t.type==='product' && t.id===id));
    saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});

function addComponent(productId, qty){
  const search=(document.getElementById('comp-search')?.value||'');
  const id=productId || document.getElementById('comp-select')?.value;
  if(!id) return;
  const value=qty===undefined ? parseFloat(document.getElementById('comp-qty')?.value) : parseFloat(qty);
  const finalQty=Number.isFinite(value)&&value>0?value:1;
  const existing=window._pmComponents.find(c=>c.productId===id);
  if(existing) existing.qty=Number(existing.qty||0)+finalQty;
  else window._pmComponents.push({productId:id,qty:finalQty});
  renderTypeFields();
  setTimeout(()=>{const i=document.getElementById('comp-search'); if(i){i.value=search; renderComponentOptions(); i.focus();}},0);
}
function changeComponentQty(idx,delta){
  const c=window._pmComponents[idx];
  if(!c) return;
  c.qty=Math.max(0.001, Number(c.qty||0)+delta);
  renderTypeFields();
}
function setComponentQty(idx,value){
  const qty=parseFloat(value);
  if(!Number.isFinite(qty)||qty<=0){ flash('Количество должно быть больше нуля'); renderTypeFields(); return; }
  if(window._pmComponents[idx]) window._pmComponents[idx].qty=qty;
  renderTypeFields();
}
function removeComponent(idx){
  window._pmComponents.splice(idx,1);
  renderTypeFields();
}
function setComponentCategory(category){
  window._pmComponentCategory=category;

}
function clearComponentSearch(){

function renderComponentOptions(){
  const box=document.getElementById('component-options');

  const query=(document.getElementById('comp-search')?.value||'').trim().toLowerCase();

  const editingId=window._pmEditingId;
  const selected=new Set((window._pmComponents||[]).map(c=>c.productId));
  const products=state.products.filter(p=>p.id!==editingId &&
    (!query || p.name.toLowerCase().includes(query) || (p.category||'Без категории').toLowerCase().includes(query)) &&
    (category==='Все' || (p.category||'Без категории')===category)
  ).slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));

  </button>`).join('');
}

function productDependsOn(productId, targetId, seen=new Set()){
  if(productId===targetId) return true;
  if(seen.has(productId)) return false;
  seen.add(productId);
  const p=getProduct(productId);
  if(!p || p.type!=='composite') return false;
  return (p.components||[]).some(c=>productDependsOn(c.productId,targetId,seen));
}

async function saveProduct(editingId){
  const name = document.getElementById('pf-name').value.trim();
  const category = document.getElementById('pf-category').value.trim();
  const price = parseFloat(document.getElementById('pf-price').value) || 0;
  const tileSymbol = (document.getElementById('pf-symbol')?.value||'').trim().slice(0,3);
  const noStockTracking = !!document.getElementById('pf-no-stock')?.checked;
  if(!name){ flash('Введите название'); return; }
  const type = window._pmType;
  if(type === 'composite' && window._pmComponents.length === 0){ flash('Добавьте хотя бы один товар в состав'); return; }
  const btn = document.querySelector('#modal-root .modal-actions .btn-primary');
  if(btn){ btn.disabled=true; btn.textContent='Сохраняем…'; }
  try{
    let p;
    if(editingId){
      p = getProduct(editingId);
      p.name = name; p.category = category; p.price = price; p.type = type;
      p.tileSymbol = tileSymbol;
      p.noStockTracking = noStockTracking;
      p.availableOnline = window._pmOnline !== false;
      if(window._pmRemoveImage) p.imageUrl = '';
      if(type==='simple'){
        p.cost = parseFloat(document.getElementById('pf-cost').value) || 0;
        p.stock = parseFloat(document.getElementById('pf-stock').value) || 0;
        delete p.components;
      } else {
        p.components = window._pmComponents;
        delete p.cost; delete p.stock;
      }
    } else {
      const catKey = category.trim() || 'Без категории';
      const siblingOrders = state.products.filter(x=>productCategoryKey(x)===catKey).map(x=>x.sortOrder||0);
      const nextOrder = siblingOrders.length ? Math.max(...siblingOrders)+1 : 0;
      p = {id: uid(), name, category, price, type, tileSymbol, noStockTracking, sortOrder: nextOrder, availableOnline: window._pmOnline !== false, imageUrl:''};
      if(type==='simple'){
        p.cost = parseFloat(document.getElementById('pf-cost')?.value) || 0;
        p.stock = parseFloat(document.getElementById('pf-stock')?.value) || 0;
      } else {
        p.components = window._pmComponents;
      }
      state.products.push(p);
    }
    if(window._pmImageData){
      const n=networkConfigFromState();
      if(!n.backendUrl || !n.deviceKey) throw new Error('Нет подключения к backend');
      const r=await fetch(n.backendUrl.replace(/\/+$/,'')+'/api/media/upload',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},body:JSON.stringify({productId:p.id,dataUrl:window._pmImageData}),cache:'no-store'});
      const d=await r.json().catch(()=>null);
      if(!r.ok) throw new Error(d?.error||('HTTP '+r.status));
      p.imageUrl=d.url||'';
    }
    saveKey('products', state.products);
    syncCategoryOrder();
    closeModal(); render(); flash('Товар сохранён');
  }catch(e){
    if(!editingId) state.products=state.products.filter(x=>x!==p);
    if(btn){ btn.disabled=false; btn.textContent='Сохранить'; }
    flash('Не удалось сохранить товар: '+(e?.message||'ошибка'));
  }
}

function handleNativeProductImage(dataUrl){
  if(!dataUrl) return;
  window._pmImageData=dataUrl;

function handleProductImage(input){
  const file=input?.files?.[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
      window._pmImageData=c.toDataURL('image/jpeg',.82);
      window._pmRemoveImage=false;
      const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML=`<img src="${window._pmImageData}" alt="">`;
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function removeProductImage(){
  window._pmImageData=null; window._pmRemoveImage=true;
  const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML='<div class="product-image-empty">📷 Фото будет удалено после сохранения</div>';
}

function finalizePurchaseOrderReceiving(orderId){
  const order=state.purchaseOrders.find(o=>o.id===orderId);
  if(!order || order.status==='received') return;
  const inputs=[...document.querySelectorAll('.po-received-qty')];
  if(!inputs.length){ flash('В заказе нет товаров'); return; }
  const now=Date.now();
  const items=[];
  let shortage=false;
  let totalCost=0;
  const draft={};
  let incomplete=false;
  for(const input of inputs){
    const productId=input.dataset.productId;
    const ordered=Math.max(0,parseFloat(input.dataset.ordered)||0);
    const receivedRaw=parseFloat(input.value);
    const received=Number.isFinite(receivedRaw) ? Math.max(0,receivedRaw) : 0;
    const costInput=document.querySelector(`.po-received-cost[data-product-id="${CSS.escape(productId)}"]`);
    const costRaw=parseFloat(costInput?.value);
    const totalLineCost=Number.isFinite(costRaw) ? Math.max(0,costRaw) : 0;
    draft[productId]={qty:received,totalCost:costInput?.value||''};
    if(received<=0 || totalLineCost<=0){ incomplete=true; continue; }
    const unitCost=totalLineCost/received;
    const p=getProduct(productId);
    if(!p || p.type!=='simple'){ incomplete=true; continue; }
    if(received < ordered) shortage=true;
    const lineTotal=totalLineCost;
    items.push({productId:p.id,productName:p.name,orderedQty:ordered,qty:received,unitCost,totalCost:lineTotal});
    totalCost+=lineTotal;
  }
  if(incomplete || items.length!==inputs.length){
    order.receivingDraft=draft;
    order.receivingIncomplete=true;
    saveKey('purchaseOrders',state.purchaseOrders);
    closeModal();
    render();
    flash('Приёмка не завершена: у каждого товара укажите количество и стоимость всего');
    return;
  }
  order.status='received';
  order.receivingIncomplete=false;
  delete order.receivingDraft;
  order.shortage=shortage;
  order.receivedAt=now;
  order.receivedItems=items;
  order.receivedTotalQty=items.reduce((s,i)=>s+i.qty,0);
  for(const item of items){
    const p=getProduct(item.productId);
    if(p.noStockTracking) continue;
    const oldStock=Number(p.stock)||0;
    const oldCost=Number(p.cost)||0;
    const newStock=oldStock+item.qty;
    p.stock=newStock;
    p.cost=newStock>0 ? Math.round((((oldStock*oldCost)+(item.unitCost*item.qty))/newStock)*100)/100 : item.unitCost;
  }
  state.receivings.push({
    id:uid(),
    type:'purchaseOrder',
    purchaseOrderId:order.id,
    supplierId:order.supplierId,
    supplierName:order.supplierName,
    items,
    totalCost:Math.round(totalCost*100)/100,
    shortage,
    timestamp:now
  });
  saveKey('products',state.products);
  saveKey('purchaseOrders',state.purchaseOrders);
  saveKey('receivings',state.receivings);
  closeModal();
  render();
  flash(shortage ? 'Приход принят с недовозом' : 'Приход подтверждён, товары зачислены');
}

function addReceivingLine(){

function finalizeReceiving(){
  if(!state.receivingCart.length){ flash('Приёмка пуста'); return; }
  const now=Date.now();
  const items=[];

  for(const r of state.receivingCart){
    const p=getProduct(r.productId);
    if(!p || p.type!=='simple') continue;
    if(!p.noStockTracking){
      const oldStock=p.stock||0;
      const oldCost=p.cost||0;
      const newStock=oldStock+r.qty;
      const newCost=newStock>0 ? ((oldStock*oldCost)+r.totalCost)/newStock : r.unitCost;
      p.stock=newStock;
      p.cost=Math.round(newCost*100)/100;
    }
    items.push({
      productId:r.productId,
      productName:r.productName,
      qty:r.qty,
      unitCost:r.unitCost,
      totalCost:r.totalCost
    });
  }

  if(!items.length){ flash('Не удалось добавить товары в приёмку'); return; }

  const totalCost=items.reduce((sum,r)=>sum+r.totalCost,0);
  // Одна запись истории = одна целая приёмка, независимо от количества товаров.
  state.receivings.push({
    id:uid(),
    type:'purchase',
    supplierId:'',
    supplierName:'',
    items,
    totalCost:Math.round(totalCost*100)/100,
    timestamp:now
  });

  saveKey('products',state.products);
  saveKey('receivings',state.receivings);
  state.receivingCart=[];
  render();
  flash('Закупка завершена, товары зачислены на остаток');
}

function getPurchaseOrderSupplier(){
  return state.suppliers.find(s=>s.id===state.purchaseOrderSupplierId) || null;
}
function productConsumptionSince(productId, supplierId){
  const supplierOrders = state.purchaseOrders
    .filter(o=>o.supplierId===supplierId)
    .flatMap(o=>Array.isArray(o.items)?o.items:[])
    .filter(i=>i.productId===productId)
    .sort((a,b)=>b.timestamp-a.timestamp);
  const lastOrderTs = supplierOrders.length ? supplierOrders[0].timestamp : 0;
  let qty = 0;
  for(const order of state.orders){
    if(Number(order.timestamp||0) <= lastOrderTs) continue;
    for(const item of (order.items||[])){
      qty += consumedSimpleProductQty(item.productId, Number(item.qty)||0, productId);
    }
  }
  return {qty, lastOrderTs};
}
function consumedSimpleProductQty(productId, soldQty, targetId, trail=new Set()){
  if(!soldQty || !productId) return 0;
  if(productId===targetId) return soldQty;
  if(trail.has(productId)) return 0;
  const p=getProduct(productId);
  if(!p || p.type!=='composite') return 0;
  const nextTrail=new Set(trail); nextTrail.add(productId);
  return (p.components||[]).reduce((sum,c)=>sum+consumedSimpleProductQty(c.productId, soldQty*(Number(c.qty)||0), targetId, nextTrail),0);
}
function purchaseOrderText(order){
  const lines=[];
  lines.push(`Заказ поставщику: ${order.supplierName}`);
  lines.push(`Дата: ${fmtDate(order.timestamp)}`);
  lines.push('');
  lines.push(...order.items.map((i,idx)=>`${idx+1}. ${i.productName} — ${i.qty} шт.`));
  lines.push('');
  lines.push('Просьба подтвердить наличие и сроки поставки.');
  return lines.join('\n');
}

  const supplier=getPurchaseOrderSupplier();

  const history=state.purchaseOrders.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,30);

          <button class="btn btn-primary" style="margin-top:14px;" onclick="finalizePurchaseOrder()" ${state.purchaseOrderCart.length?'':'disabled'}>Сформировать заказ</button>

        </div>`).join('') : `<div class="center-note">Заказов ещё не создавали.</div>`}
      </div>

function selectPurchaseOrderSupplier(id){
  if(state.purchaseOrderCart.length && id!==state.purchaseOrderSupplierId){
    flash('Сначала завершите текущий заказ');
    render(); return;
  }
  state.purchaseOrderSupplierId=id||'';
  state.purchaseOrderCart=[];
  render();
}
function updatePurchaseQty(productId,value){
  const qty=Math.max(0,parseFloat(value)||0);
  const idx=state.purchaseOrderCart.findIndex(x=>x.productId===productId);
  if(qty>0){
    if(idx>=0) state.purchaseOrderCart[idx].qty=qty;
    else state.purchaseOrderCart.push({productId,qty});
  } else if(idx>=0){ state.purchaseOrderCart.splice(idx,1); }
  const btn=document.querySelector('.content-screen.active .btn-primary');
  if(btn && btn.textContent.includes('Сформировать')) btn.disabled=!state.purchaseOrderCart.length;
}
function finalizePurchaseOrder(){
  const supplier=getPurchaseOrderSupplier();
  if(!supplier){ flash('Выберите поставщика'); return; }
  if(!state.purchaseOrderCart.length){ flash('Добавьте хотя бы один товар'); return; }
  const items=state.purchaseOrderCart.map(x=>{
    const p=getProduct(x.productId); if(!p) return null;
    return {productId:p.id,productName:p.name,qty:Number(x.qty)||0,timestamp:Date.now()};
  }).filter(Boolean);
  if(!items.length) return;
  const order={id:uid(),supplierId:supplier.id,supplierName:supplier.name,items,timestamp:Date.now()};
  state.purchaseOrders.push(order);
  saveKey('purchaseOrders',state.purchaseOrders);
  state.purchaseOrderCart=[];
  state.purchaseOrderSupplierId=supplier.id;
  render();
  viewPurchaseOrder(order.id);
}
function viewPurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const deletedLabel=order.status==='deleted' ? `<div class=\"badge deleted-admin\" style=\"display:inline-block;margin-bottom:12px;\">Удалено администратором</div>` : '';
  const text=purchaseOrderText(order);
  showModal(`
    <div class="modal-title">Заказ поставщику</div>${deletedLabel}
    <div style="font-size:14px;color:var(--muted);margin-bottom:14px;"><strong style="color:var(--text);">${escapeHtml(order.supplierName)}</strong><br>${fmtDate(order.timestamp)}</div>
    <pre id="purchase-order-text" style="white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0;">${escapeHtml(text)}</pre>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="copyPurchaseOrder('${order.id}')">Скопировать текст</button>
      <button class="btn btn-secondary" onclick="sharePurchaseOrder('${order.id}')">Поделиться</button>
      <button class="btn btn-primary" onclick="closeModal()">Готово</button>
    </div>` , true);
}
async function copyPurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const text=purchaseOrderText(order);
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  flash('Текст заказа скопирован');
}
function sharePurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const payload={
    id: order.id,
    supplierName: order.supplierName || 'Поставщик',
    timestamp: order.timestamp || Date.now(),
    items: (order.items||[]).map(i=>({productName:i.productName||'', qty:Number(i.qty)||0})),
    company: {
      legalName: state.company?.legalName || '',
      address: state.company?.address || '',
      deliveryAddress: state.company?.deliveryAddress || ''
    }
  };
  if(window.webkit?.messageHandlers?.printer){
    window.webkit.messageHandlers.printer.postMessage({action:'sharePurchaseOrder',order:payload});
    return;
  }
  // Резервный вариант для запуска вне нативного приложения.
  const text=purchaseOrderText(order);
  if(navigator.share){
    navigator.share({title:`Заказ поставщику — ${order.supplierName}`,text}).catch(()=>{});
  }else{
    copyPurchaseOrder(id);
  }
}

function toggleShiftAdminPassword(){
  const select=document.getElementById('sf-employee');

  wrap.style.display=isAdmin?'block':'none';

}
function submitOpenShift(){
  const employeeId=document.getElementById('sf-employee')?.value||'';
  const employee=state.employees.find(e=>e.id===employeeId);
  if(!employee){ flash('Выберите сотрудника'); return; }
  if(employee.role==='admin'){
    const password=document.getElementById('sf-admin-password')?.value||'';
    if(password!=='Rom23061998'){ flash('Для открытия смены администратором введите верный пароль'); return; }
  }
  const previousClosed = state.shifts.filter(s=>s.status==='closed').slice().sort((a,b)=>(b.closedAt||0)-(a.closedAt||0))[0] || null;
  const openingCash = previousClosed ? Number(previousClosed.countedCash||0) : 0;

  const shift=currentShift();
  if(!shift){flash('Смена не открыта');return;}
  const isDeposit=type==='deposit';
  showModal(`
    <div class="modal-title">${isDeposit?'Внести наличные':'Изъять наличные'}</div>

  `);
  setTimeout(()=>document.getElementById('cash-movement-amount')?.focus(),50);
}
function submitCashMovement(type){
  const shift=currentShift();
  if(!shift){flash('Смена не открыта');closeModal();return;}
  const amount=parseFloat((document.getElementById('cash-movement-amount')?.value||'').replace(',','.'))||0;
  if(amount<=0){flash('Введите сумму');return;}
  if(type==='withdrawal'){
    const t=shiftTotals(shift.id);
    const available=Number(shift.openingCash||0)+t.cash+t.netMovements;
    if(amount>available+0.0001){flash('Недостаточно наличных в кассе');return;}
  }
  if(!Array.isArray(shift.cashMovements)) shift.cashMovements=[];
  shift.cashMovements.push({id:uid(),type,amount,timestamp:Date.now(),note:(document.getElementById('cash-movement-note')?.value||'').trim()});
  saveKey('shifts',state.shifts);
  closeModal();render();
  flash(type==='deposit'?'Наличные внесены в кассу':'Наличные изъяты из кассы');
}

function saveEmployee(id=''){
  const name=(document.getElementById('ef-name')?.value||'').trim();
  const phone=(document.getElementById('ef-phone')?.value||'').trim();
  const wantsAdmin=!!document.getElementById('ef-admin')?.checked;
  const adminPassword=(document.getElementById('ef-admin-password')?.value||'');
  if(!name){flash('Введите ФИО сотрудника');return;}
  const employee=id ? state.employees.find(x=>x.id===id) : null;
  if(id && !employee){flash('Сотрудник не найден');return;}
  const wasAdmin=employee?.role==='admin';
  if(wantsAdmin!==wasAdmin && adminPassword!=='Rom23061998'){
    flash(wantsAdmin?'Для выдачи прав администратора введите верный пароль':'Для снятия прав администратора введите верный пароль');return;
  }
  if(id){ employee.name=name; employee.phone=phone; employee.role=wantsAdmin?'admin':'employee'; }
  else { state.employees.push({id:uid(),name,phone,role:wantsAdmin?'admin':'employee'}); }
  saveKey('employees',state.employees);closeModal();render();flash(id?'Сотрудник сохранён':'Сотрудник добавлен');
}
function deleteEmployee(id){
  const e=state.employees.find(x=>x.id===id);
  if(!e) return;
  if(!confirm(`Удалить сотрудника «${e.name}»?`)) return;
  state.employees=state.employees.filter(x=>x.id!==id);
  saveKey('employees',state.employees);render();flash('Сотрудник удалён');
}
function viewShiftModal(shiftId){
  const shift=state.shifts.find(s=>s.id===shiftId); if(!shift) return;
  const orders=shiftOrders(shift.id).slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const t=shiftTotals(shift.id);
  const expected=(Number(shift.openingCash)||0)+t.cash+t.netMovements;
  const counted=Number(shift.countedCash)||0;
  const diff=counted-expected;
  const report=buildShiftReportPayload(shift);
  showModal(`
    <div class="modal-title">Отчёт по смене</div>
    <div class="list-row-sub" style="margin-bottom:14px;">${fmtDate(shift.openedAt)} — ${fmtDate(shift.closedAt)} · ${escapeHtml(shift.employeeName||'Сотрудник не указан')}</div>
    <div class="grid-3">
      <div class="stat-box"><div class="label">Заказов</div><div class="value">${t.count}</div></div>
      <div class="stat-box"><div class="label">Выручка</div><div class="value">${money(t.total)}</div></div>
      <div class="stat-box"><div class="label">Наличные</div><div class="value">${money(t.cash)}</div></div>
    </div>
    <div class="grid-2" style="margin-top:12px;">
      <div class="stat-box"><div class="label">Карта</div><div class="value">${money(t.card)}</div></div>
      <div class="stat-box"><div class="label">Расхождение</div><div class="value" style="color:${Math.abs(diff)<0.01?'var(--text)':'var(--danger)'};">${money(diff)}</div></div>
    </div>
    <div class="grid-2" style="margin-top:12px;">
      <div class="stat-box"><div class="label">Внесено наличных</div><div class="value">${money(t.deposits)}</div></div>
      <div class="stat-box"><div class="label">Изъято наличных</div><div class="value">${money(t.withdrawals)}</div></div>
    </div>
    <div style="margin-top:16px;font-weight:800;">Движение наличных</div>
    <div style="max-height:180px;overflow:auto;border-top:1px solid var(--border);margin-top:8px;">
      ${t.movements.length ? t.movements.slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).map(m=>`<div class="list-row"><div style="flex:1;"><div class="list-row-name">${m.type==='deposit'?'Внесение наличных':(m.subtype==='delivery'||m.note==='🚗 Доставка'?'🚗 Доставка':(m.subtype==='refund'||m.note==='↩️ Возврат чека'?'↩️ Возврат чека':'Изъятие наличных'))}</div><div class="list-row-sub">${fmtDate(m.timestamp)}${m.note?' · '+escapeHtml(m.note):''}</div></div><div class="badge">${m.type==='deposit'?'+':'−'}${money(m.amount)}</div></div>`).join('') : '<div class="center-note">Движения наличных не было</div>'}
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button><button class="btn btn-primary" onclick="printShiftReport('${escapeAttr(shift.id)}')">Распечатать отчёт</button></div>
  `, true);
}
function printShiftReport(shiftId){
  const shift=state.shifts.find(s=>s.id===shiftId); if(!shift) return;
  const payload=buildShiftReportPayload(shift);
  if(window.webkit?.messageHandlers?.printer){window.webkit.messageHandlers.printer.postMessage({action:'printShiftReport',report:payload});return;}
  window.print();
}

/* ============================= SUPPLIERS ============================= */
function openSupplierModal(id=''){
  const supplier = state.suppliers.find(s=>s.id===id);
  const editing = !!supplier;
  const selected = new Set(Array.isArray(supplier?.productIds) ? supplier.productIds : []);
  const products = state.products.filter(p=>p.type==='simple').slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  showModal(`
    <div class="modal-title">${editing?'Товары поставщика':'Новый поставщик'}</div>
    <div class="field">
      <label>Название поставщика</label>
      <input id="sf-name" type="text" value="${escapeAttr(supplier?.name||'')}" placeholder="Например, ООО Поставщик">
    </div>
    <div style="font-weight:800;margin:14px 0 8px;">Товары на поставщике</div>
    <div class="settings-note" style="margin-bottom:10px;">Выберите товары, которые обычно закупаются у этого поставщика. В приёмке они будут показываться первыми.</div>
    <div style="max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;">
      ${products.length ? products.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;">
        <input class="supplier-product-check" type="checkbox" value="${escapeAttr(p.id)}" ${selected.has(p.id)?'checked':''} style="width:20px;height:20px;">
        <span style="flex:1;min-width:0;">${escapeHtml(p.name)}</span>
        <span class="list-row-sub">${escapeHtml(p.category||'Без категории')}</span>
      </label>`).join('') : `<div class="center-note">Сначала создайте простые товары.</div>`}
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveSupplier('${escapeAttr(id)}')">${editing?'Сохранить':'Создать'}</button>
    </div>`, true);
}

function deleteSupplier(id){
  if(!canEditCompanySettings()){
    flash('Удалять поставщиков может только администратор при открытой им смене');
    return;
  }
  const supplier=state.suppliers.find(s=>s.id===id);
  if(!supplier) return;
  showModal(`
    <div class="modal-title">Удаление поставщика</div>
    <div class="center-note" style="padding:8px 0 14px;">Удалить поставщика «${escapeHtml(supplier.name)}» из списка?</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDeleteSupplier('${escapeAttr(id)}')">Удалить</button>
    </div>`, true);
}
function confirmDeleteSupplier(id){
  if(!canEditCompanySettings()){ closeModal(); flash('Удалять поставщиков может только администратор при открытой им смене'); return; }
  state.suppliers=state.suppliers.filter(s=>s.id!==id);
  saveKey('suppliers',state.suppliers);
  closeModal();
  render();
  flash('Поставщик удалён');
}

function saveSupplier(id=''){
  const name=(document.getElementById('sf-name')?.value||'').trim();
  if(!name){ flash('Введите название поставщика'); return; }
  const productIds=[...document.querySelectorAll('.supplier-product-check:checked')].map(x=>x.value);
  if(id){
    const s=state.suppliers.find(x=>x.id===id);
    if(!s){ flash('Поставщик не найден'); return; }
    s.name=name;
    s.productIds=productIds;
  }else{
    state.suppliers.push({id:uid(),name,productIds});
  }
  saveKey('suppliers',state.suppliers);
  closeModal();
  render();
  flash(id?'Поставщик сохранён':'Поставщик создан');
}

/* ============================= MODAL HELPERS ============================= */
function showModal(html, wide){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal ${wide?'wide':''}">${html}</div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

/* ============================= BACKUP ============================= */
function exportBackup(){
  const data={version:9,exportedAt:Date.now(),company:state.company,deliveryRates:state.deliveryRates,products:state.products,employees:state.employees,shifts:state.shifts,orders:state.orders,parked:state.parked,receivings:state.receivings,suppliers:state.suppliers,purchaseOrders:state.purchaseOrders,discounts:state.discounts,layout:{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='prilavok-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  flash('Резервная копия сохранена');
}
function importBackup(){
  const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json';
  input.onchange=()=>{ const file=input.files?.[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.products)) throw new Error(); state.products=d.products; state.employees=Array.isArray(d.employees)?d.employees:[]; state.shifts=d.shifts||[]; state.orders=d.orders||[]; state.parked=d.parked||[]; state.receivings=d.receivings||[]; state.suppliers=d.suppliers||[]; state.purchaseOrders=Array.isArray(d.purchaseOrders)?d.purchaseOrders:[]; state.company=Object.assign({establishmentName:'',legalName:'',address:'',deliveryAddress:''},d.company||{}); state.deliveryRates=Array.isArray(d.deliveryRates)?d.deliveryRates:[]; saveKey('deliveryRates',state.deliveryRates); state.discounts=Array.isArray(d.discounts)?d.discounts:[]; state.categoryOrder=d.layout?.categoryOrder||[]; state.categoryColors=d.layout?.categoryColors||{}; state.categorySymbols=d.layout?.categorySymbols||{}; state.categoryOnline=d.layout?.categoryOnline||{}; state.categoryOrder.forEach(c=>{if(typeof state.categoryOnline[c]!=='boolean')state.categoryOnline[c]=true;}); state.layoutTiles=Array.isArray(d.layout?.tiles)?d.layout.tiles:state.products.map(p=>({type:'product',id:p.id})); saveKey('products',state.products); saveKey('employees',state.employees); saveKey('shifts',state.shifts); saveKey('orders',state.orders); saveKey('parked',state.parked); saveKey('receivings',state.receivings); saveKey('suppliers',state.suppliers); saveKey('purchaseOrders',state.purchaseOrders); saveKey('company',state.company); saveKey('discounts',state.discounts); saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles}); render(); flash('Данные восстановлены'); }catch(e){ flash('Не удалось прочитать резервную копию'); } }; r.readAsText(file); }; input.click();
}

/* ============================= UTIL ============================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

loadAll();
