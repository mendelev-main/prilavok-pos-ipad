<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>M POS — касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F0;
    --surface:#FFFFFF;
    --ink:#1B1F2A;
    --muted:#767C8C;
    --accent:#0E8F6F;
    --accent-ink:#ffffff;
    --accent-soft:#E4F3EE;
    --navy:#22273A;
    --danger:#E0483E;
    --danger-soft:#FBE7E5;
    --border:#E7E4DD;
    --radius-l:22px;
    --radius-m:16px;
    --radius-s:10px;
    --shadow:0 1px 2px rgba(27,31,42,.04), 0 8px 24px rgba(27,31,42,.05);
  }
  :root[data-theme='dark']{
    --bg:#171A21; --surface:#222631; --ink:#F4F6FA; --muted:#A9B0BF;
    --accent:#31B98D; --accent-ink:#07140F; --accent-soft:#173B31;
    --navy:#10131A; --danger:#FF6B61; --danger-soft:#432522;
    --border:#353B49; --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ---- Top bar ---- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:var(--navy);color:#fff;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:100px;font-weight:700;font-size:14px;color:rgba(255,255,255,.62);transition:background .15s,color .15s;flex-shrink:0;}
  .brand.active{background:rgba(255,255,255,.14);color:#fff;}
  .brand:not(.active):hover{color:#fff;}
  .tabs{display:flex;gap:4px;flex:1;}
  .tab{
    padding:8px 14px;border-radius:100px;font-weight:600;font-size:14px;
    color:rgba(255,255,255,.62);transition:background .15s,color .15s;
  }
  .tab.active{background:rgba(255,255,255,.14);color:#fff;}
  .tab:not(.active):hover{color:#fff;}
  .shift-pill{
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;
    background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600;white-space:nowrap;
  }
  .settings-topbar-btn{
    width:34px;height:34px;min-width:34px;padding:0;border-radius:100px;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.62);background:transparent;
    transition:background .15s,color .15s;flex-shrink:0;
  }
  .settings-topbar-btn:hover{color:#fff;}
  .settings-topbar-btn.active{background:rgba(255,255,255,.14);color:#fff;}
  .settings-topbar-btn svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.on{background:#3ED28E;box-shadow:0 0 0 3px rgba(62,210,142,.25);}
  .dot.off{background:#FF7A70;box-shadow:0 0 0 3px rgba(255,122,112,.25);}

  .main{flex:1;min-height:0;min-width:0;overflow:hidden;}
  .screen{display:none;height:100%;width:100%;min-width:0;max-width:100%;}
  .screen.active{display:flex;}

  /* ---- POS screen ---- */
  #screen-pos{gap:16px;padding:16px;min-width:0;overflow:hidden;}
  .pos-left{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:12px;}
  .pos-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px;}
  .search-box{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:12px 16px;font-size:15px;color:var(--ink);
  }
  .search-box:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .park-btn{
    background:#E8F0FF;border:1px solid #C7D7F2;color:#31558F;border-radius:var(--radius-m);
    padding:11px 15px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:0 1px 2px rgba(49,85,143,.08);
  }
  :root[data-theme='dark'] .park-btn{background:#26334A;border-color:#3C506F;color:#BFD5FF;}
  .demand-btn{
    border-color:rgba(52,199,89,.55);
    box-shadow:0 0 0 1px rgba(52,199,89,.12),0 0 10px rgba(52,199,89,.22);
  }
  .demand-btn.active{
    background:rgba(255,59,48,.10);
    border-color:#FF453A;
    color:#B42318;
    box-shadow:0 0 0 1px rgba(255,69,58,.30),0 0 12px rgba(255,59,48,.36);
  }
  :root[data-theme='dark'] .demand-btn{
    border-color:rgba(48,209,88,.50);
    box-shadow:0 0 0 1px rgba(48,209,88,.10),0 0 11px rgba(48,209,88,.20);
  }
  :root[data-theme='dark'] .demand-btn.active{
    background:rgba(255,69,58,.12);
    border-color:#FF453A;
    color:#FF9B95;
    box-shadow:0 0 0 1px rgba(255,69,58,.28),0 0 12px rgba(255,59,48,.34);
  }
  .zone-title-btn{
    background:#F0E9FF;border:1px solid #D7C8F5;color:#5E4691;border-radius:var(--radius-m);
    padding:11px 16px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;
    width:auto;max-width:none;flex:0 0 auto;white-space:nowrap;overflow:visible;text-overflow:clip;
  }
  :root[data-theme='dark'] .zone-title-btn{background:#332B45;border-color:#51436C;color:#DCCBFF;}
  .park-badge{background:var(--accent);color:#fff;border-radius:100px;padding:1px 8px;font-size:12.5px;}
  .pos-actions-left{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-shrink:0;margin-left:auto;}
  .pos-toolbar-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .category-color-picker{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
  .category-color-option{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.10);}
  .category-color-option.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .chip{
    padding:8px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .sections-wrap{flex:1;overflow-y:auto;padding-bottom:8px;display:flex;flex-direction:column;gap:22px;}
  .cat-section{display:flex;flex-direction:column;gap:10px;}
  .cat-header{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink);}
  .cat-handle{cursor:grab;color:var(--muted);font-size:18px;touch-action:none;padding:2px 4px;}
  .product-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;
    min-height:56px;overflow:auto;padding:4px;border-radius:18px;
  }
  .product-grid.layout-edit-grid{
    position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;overflow:hidden;
    padding:14px;background-image:radial-gradient(circle, rgba(118,124,140,.20) 1px, transparent 1px);
    background-size:18px 18px;border:1px solid var(--border);
  }
  .layout-cell-highlight{position:absolute;pointer-events:none;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:18px;z-index:0;transition:all .08s ease;}
  .category-edit-grid{position:relative;}.category-edit-grid .layout-tile{touch-action:none;}.navigation-action{position:relative;z-index:2;min-height:40px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font-size:12px;align-self:flex-end;}
  .layout-tile{position:relative;min-width:0;z-index:1;}
  .layout-tile.drag-placeholder{visibility:hidden;}
  .layout-drag-clone{
    position:fixed;z-index:9999;pointer-events:none;width:var(--drag-w);height:var(--drag-h);
    transition:transform .06s ease;filter:drop-shadow(0 14px 24px rgba(27,31,42,.18));
  }
  .layout-drag-clone .pcard{height:100%;transform:none!important;cursor:grabbing!important;}
  .layout-edit-grid .pcard.edit-tile{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
  @media (min-width:900px){
    .product-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
    .product-grid.layout-edit-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
  }
  /* iPad portrait: give the POS tiles more breathing room instead of squeezing them. */
  @media (orientation:portrait) and (min-width:700px){
    #screen-pos .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
    #screen-pos .product-grid.layout-edit-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
  }
  .pcard{
    background:var(--surface);border-radius:var(--radius-m);padding:14px;text-align:left;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;box-sizing:border-box;
    border:1px solid transparent;transition:transform .08s;
  }
  .pcard:active{transform:scale(.97);}
  .pcard.disabled{opacity:.42;}
  .pcard.edit-tile{cursor:grab;border:1.5px dashed var(--border);touch-action:none;}
  .layout-dragging{opacity:.55;transform:scale(.98);}
  .layout-drop-before{outline:3px solid var(--accent);outline-offset:2px;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen{box-shadow:0 0 0 2px var(--accent);}
  .search-box:disabled,.park-btn:disabled{opacity:.45;}
  .tile-symbol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;line-height:1;font-weight:850;letter-spacing:1px;opacity:.6;pointer-events:none;z-index:0;white-space:nowrap;text-align:center;}
  .pcard > *:not(.tile-symbol){position:relative;z-index:1;}
  .pcard .tile-symbol + .pcard-name{position:relative;z-index:1;}
  .pcard-name{font-weight:700;font-size:14.5px;line-height:1.25;flex:1;}
  .pcard-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .pcard-price{font-weight:800;font-size:15.5px;}
  .pcard-stock{font-size:11.5px;color:var(--muted);font-weight:600;}
  .pcard-stock.low{color:var(--danger);}
  .pcard-type{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:100px;align-self:flex-start;}
  .layout-tile .tile-remove{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:800;z-index:2;}
  .category-tile .pcard-name:after{content:'›';float:right;color:var(--muted);font-size:20px;line-height:14px;}
  .folder-tile .pcard-name{font-size:19px;font-weight:800;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;}
  .folder-tile .pcard-name:after{content:none;}
  :root[data-theme='dark'] .category-tile .pcard{background:var(--surface)!important;border:2px solid var(--category-color);box-shadow:0 0 8px color-mix(in srgb,var(--category-color) 70%, transparent),0 0 18px color-mix(in srgb,var(--category-color) 28%, transparent);}
  .layout-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;}
  .layout-add-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .layout-add-row:last-child{border-bottom:none;}
  .layout-add-row .name{flex:1;font-weight:700;font-size:14px;}
  .layout-add-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .layout-add-btn{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:700;}
  .pos-back{display:flex;align-items:center;justify-content:center;gap:8px;background:#E8F0FF;border:1px solid #C7D7F2;color:#31558F;border-radius:var(--radius-m);padding:11px 15px;min-height:44px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(49,85,143,.08);}
  :root[data-theme='dark'] .pos-back{background:#26334A;border-color:#3C506F;color:#BFD5FF;}
  .empty-hint{margin:auto;text-align:center;color:var(--muted);font-size:14.5px;max-width:260px;}

  /* ---- Analytics ---- */
  .analytics-period-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.analytics-period-modal-grid{grid-template-columns:1fr;}}

  .analytics-filters{width:100%;min-width:0;}
  .analytics-period-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px;}
  .analytics-period-title{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2;}
  .analytics-period-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .analytics-period-layout{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;width:100%;min-width:0;}
  .analytics-date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;min-width:0;flex:0 1 430px;box-sizing:border-box;width:100%;}
  .analytics-date-fields > .analytics-filter{min-width:0;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;}
  .analytics-date-fields > .analytics-filter input,.analytics-date-fields > .analytics-filter select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;}
  .analytics-filter{min-width:0;display:flex;flex-direction:column;}
  .analytics-filter label{display:block;height:auto;font-size:11.5px;color:var(--muted);font-weight:800;margin:0 0 6px 2px;}
  .analytics-filter input,.analytics-filter select{box-sizing:border-box;width:100%;max-width:100%;height:46px;background:var(--surface);border:1.5px solid var(--border);border-radius:13px;padding:0 12px;color:var(--ink);font:inherit;font-weight:700;min-width:0;display:block;outline:none;transition:border-color .12s,box-shadow .12s,background .12s;}
  .analytics-filter input[type='date']{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;flex:1 1 auto;overflow:hidden;min-inline-size:0;-webkit-appearance:none;line-height:43px;}
  .analytics-filter input[type='date']::-webkit-date-and-time-value{min-width:0;text-align:left;height:43px;line-height:43px;padding:0;margin:0;}
  .analytics-filter input[type='date']::-webkit-calendar-picker-indicator{margin:auto 0 auto auto;padding:2px;max-width:18px;}
  .analytics-filter input:focus,.analytics-filter select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);}
  .analytics-presets-wrap{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .analytics-presets-label{font-size:11.5px;color:var(--muted);font-weight:800;margin-left:2px;}
  .analytics-presets{display:flex;align-items:center;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--border);border-radius:14px;}
  .analytics-presets .btn{box-sizing:border-box;width:auto!important;min-width:88px;height:38px;padding:0 13px;white-space:nowrap;border-radius:10px!important;border:1px solid transparent;font-size:12.5px;font-weight:800;background:transparent;color:var(--muted);box-shadow:none;transition:background .12s,color .12s,border-color .12s,transform .12s;}
  .analytics-presets .btn:hover{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .analytics-presets .btn:active{transform:scale(.97);}
  :root[data-theme='dark'] .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.22);}

  @media(max-width:900px){
    .analytics-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-grid-2{grid-template-columns:1fr;}
    .analytics-period-layout{align-items:stretch;flex-direction:column;gap:12px;}
    .analytics-date-fields{flex:1 1 auto;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-presets-wrap{width:100%;}
    .analytics-presets{width:100%;}
    .analytics-presets .btn{flex:1 1 0;min-width:0;}
  }
  @media(max-width:620px){
    .analytics-kpis{grid-template-columns:1fr 1fr;}
    .hbar-row{grid-template-columns:100px 1fr 68px;}
    .analytics-period-head{margin-bottom:12px;}
    .analytics-date-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
    .analytics-filter input{height:44px;padding:0 10px;}
    .analytics-presets{gap:4px;padding:3px;border-radius:12px;}
    .analytics-presets .btn{height:36px;padding:0 5px;font-size:12px;border-radius:9px!important;}
  }
  @media(max-width:420px){
    .analytics-date-fields{grid-template-columns:1fr;}
    .analytics-presets .btn{font-size:11.5px;}
  }
  .analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .analytics-kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .analytics-kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .analytics-kpi .k-value{font-size:24px;font-weight:800;margin-top:7px;}
  .analytics-sensitive{filter:blur(8px);user-select:none;cursor:pointer;}
  .analytics-sensitive-wrap{position:relative;min-height:31px;}
  .analytics-lock-btn{margin-top:7px;width:auto!important;height:34px;padding:0 11px!important;font-size:12px!important;}
  .analytics-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .analytics-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0;}
  .analytics-title{font-size:16px;font-weight:800;margin-bottom:4px;}
  .analytics-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .hbar-list{display:flex;flex-direction:column;gap:13px;}
  .hbar-row{display:grid;grid-template-columns:minmax(100px,1fr) 3fr 72px;gap:10px;align-items:center;}
  .hbar-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{height:18px;background:var(--bg);border-radius:100px;overflow:hidden;border:1px solid var(--border);}
  .hbar-fill{height:100%;border-radius:100px;background:var(--accent);min-width:3px;}
  .hbar-value{text-align:right;font-size:12.5px;font-weight:800;white-space:nowrap;min-width:0;}
  .hbar-list.payment-method-bars .hbar-row{grid-template-columns:minmax(90px,1fr) minmax(70px,2fr) minmax(132px,auto);}
  .hbar-list.payment-method-bars .hbar-value{max-width:100%;font-size:12px;}
  .analytics-table{width:100%;border-collapse:collapse;font-size:13px;}
  .analytics-table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:0 8px 9px;border-bottom:1px solid var(--border);}
  .analytics-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
  .analytics-table tr:last-child td{border-bottom:none;}
  /* ---- Cart panel ---- */
  .cart-panel{
    width:380px;max-width:100%;flex-shrink:0;min-width:0;background:var(--surface);border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .cart-head{padding:18px 20px 10px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;}
  .cart-head span{font-weight:600;font-size:13px;color:var(--muted);}
  .cart-items{flex:1;overflow-y:auto;padding:0 14px;}
  .cart-empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .cart-row{position:relative;padding:0;border-bottom:1px solid var(--border);touch-action:pan-y;background:var(--surface);overflow:hidden;}
  .cart-row-swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;background:linear-gradient(90deg,#E45858,#D62F3D);color:#fff;pointer-events:none;z-index:0;overflow:hidden;opacity:0;transition:opacity .08s linear;}
  .cart-row.swiping .cart-row-swipe-bg,.cart-row.swipe-ready .cart-row-swipe-bg,.cart-row.swipe-delete .cart-row-swipe-bg{opacity:1;}
  .cart-add-feedback{display:inline-flex;align-items:center;gap:5px;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;color:var(--accent);font-size:12px;font-weight:800;transform:translateX(6px);transition:max-width .22s ease,opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1);}
  .cart-add-feedback.show{max-width:110px;opacity:1;transform:translateX(0);}
  .cart-add-feedback::before{content:'✓';display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;flex:none;}
  .cart-row-content.cart-item-added,.cart-row-content.cart-item-updated{animation:cartItemHighlight .62s cubic-bezier(.2,.8,.2,1);}
  @keyframes cartItemHighlight{0%{background:#CFF3D8;box-shadow:inset 3px 0 0 #36A657;}55%{background:#E8F8EC;box-shadow:inset 3px 0 0 #36A657;}100%{background:var(--surface);box-shadow:inset 0 0 0 transparent;}}
  :root[data-theme='dark'] .cart-row-content.cart-item-added,:root[data-theme='dark'] .cart-row-content.cart-item-updated{animation-name:cartItemHighlightDark;}
  @keyframes cartItemHighlightDark{0%{background:#244B32;box-shadow:inset 3px 0 0 #59C979;}55%{background:#203C2A;box-shadow:inset 3px 0 0 #59C979;}100%{background:var(--surface);box-shadow:inset 0 0 0 transparent;}}
  @media (prefers-reduced-motion:reduce){.cart-add-feedback,.cart-row-content.cart-item-added,.cart-row-content.cart-item-updated{transition:none!important;animation:none!important;}}
  .cart-swipe-delete-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:86px;height:100%;transform:scale(.78);opacity:.18;transition:transform .16s ease,opacity .16s ease;}
  .cart-swipe-delete-action svg{width:26px;height:26px;display:block;}
  .cart-swipe-delete-action span{font-size:11px;font-weight:800;line-height:1;}
  .cart-row-content{position:relative;z-index:1;padding:9px 6px;background:var(--surface);will-change:transform;transition:transform .28s cubic-bezier(.22,.8,.24,1);}
  .cart-row.swiping .cart-row-content{transition:none;}
  .cart-row.swipe-ready .cart-swipe-delete-action{transform:scale(1);opacity:1;}
  .cart-row.swipe-delete .cart-row-content{transform:translateX(-100%);transition:transform .22s cubic-bezier(.55,0,1,.45);}
  @media (hover:none) and (pointer:coarse){.cart-row-swipe-bg{display:flex;}}
  .cart-row-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .cart-row-name{font-weight:700;font-size:14px;line-height:1.3;min-width:0;}
  .cart-row-title-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .cart-row-title-line .cart-row-linetotal{flex:none;font-weight:850;white-space:nowrap;}
  .cart-row-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .cart-row-remove{color:var(--muted);font-size:18px;padding:2px 4px;flex-shrink:0;}
  .cart-row-bottom{display:flex;justify-content:space-between;align-items:center;}
  .cart-row-bottom-compact{justify-content:flex-end;margin-top:2px;}
  .cart-item-qty-editor{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 2px;}
  .cart-item-qty-editor button{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:24px;font-weight:850;}
  .cart-item-qty-editor span{min-width:52px;text-align:center;font-size:22px;font-weight:850;}
  .qty-stepper{display:flex;align-items:center;gap:3px;background:var(--bg);border-radius:100px;padding:2px;}
  .qty-stepper button{width:30px;height:30px;font-size:16px;font-weight:800;border-radius:100px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;line-height:1;}
  .qty-stepper button:focus{outline:none;box-shadow:none;}
  .qty-stepper button:active{background:var(--bg);border-color:var(--border);transform:scale(.94);}
  @media (hover:hover) and (pointer:fine){
    .qty-stepper button:hover{border-color:var(--accent);background:var(--bg);}
  }
  .qty-stepper .qty-minus{color:#B23A3A;}
  .qty-stepper .qty-plus{color:#2E7D32;}
  .qty-stepper span{min-width:28px;text-align:center;font-weight:800;font-size:14px;color:var(--text);user-select:none;}
  :root[data-theme='dark'] .qty-stepper{background:#202938;}
  :root[data-theme='dark'] .qty-stepper button{background:#303B4E;border-color:#4A5870;color:#F5F7FB;}
  :root[data-theme='dark'] .qty-stepper .qty-minus{color:#FF8F8F;}
  :root[data-theme='dark'] .qty-stepper .qty-plus{color:#8FE39A;}
  :root[data-theme='dark'] .qty-stepper button:active{background:#263247;border-color:#4A5870;}
  @media (hover:hover) and (pointer:fine){
    :root[data-theme='dark'] .qty-stepper button:hover{background:#3A475C;border-color:#7183A2;}
  }
  .cart-row-linetotal{font-weight:800;font-size:14.5px;}
  .cart-foot{padding:16px 20px 20px;border-top:1px solid var(--border);}
  .total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .total-row .label{font-size:14.5px;color:var(--muted);font-weight:600;}
  .total-row .value{font-size:26px;font-weight:800;}
  .cart-actions{display:flex;gap:8px;}
  .btn{
    padding:14px 12px;border-radius:var(--radius-m);font-weight:700;font-size:14.5px;text-align:center;flex:1;
    transition:opacity .15s,transform .08s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn-secondary{background:var(--bg);color:var(--ink);}
  .btn-cash{background:var(--accent);color:#fff;}
  .btn-card{background:var(--navy);color:#fff;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-danger{background:var(--danger);color:#fff;border:0;}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
  .btn-danger-outline{background:transparent;border:1.5px solid var(--danger-soft);color:var(--danger);}
  .no-shift-banner{
    margin:0 0 4px;padding:12px 16px;background:#FFF4E9;border:1px solid #F5DCB8;border-radius:var(--radius-m);
    font-size:13.5px;font-weight:600;color:#8A5A17;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .no-shift-banner button{background:#8A5A17;color:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;}


  .web-switch{display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--bg);padding:5px 7px 5px 5px;border-radius:100px;font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;}
  .web-switch span{width:22px;height:14px;border-radius:10px;background:#B9BEC8;position:relative;display:block;transition:.15s;}
  .web-switch span:after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.18);}
  .web-switch.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .web-switch.on span{background:var(--accent);}.web-switch.on span:after{left:10px;}
  .toggle-switch{width:48px;height:28px;border-radius:100px;background:#B9BEC8;padding:3px;flex-shrink:0;}
  .toggle-switch span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s;}
  .toggle-switch.on{background:var(--accent);}.toggle-switch.on span{transform:translateX(20px);}

  .products-web-cell{display:flex;align-items:center;justify-content:center;}
  .products-table-head,.products-table-row{grid-template-columns:minmax(220px,2fr) 1.1fr .8fr .8fr .9fr .72fr .8fr !important;}
  @media(max-width:760px){.products-table-head{display:none}.products-table-row{display:grid;grid-template-columns:1fr auto !important;gap:8px}.products-table-row .products-table-cell{display:none}.products-table-row .products-table-main{grid-column:1}.products-table-row .products-web-cell{display:flex;grid-column:2;grid-row:1}.products-table-row .products-stock{display:block;grid-column:1 / -1;grid-row:2;text-align:left}.products-table-row .products-table-muted{display:none}}
  .web-setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0;}
  .product-image-preview{width:100%;height:170px;border:1px dashed var(--border);border-radius:var(--radius-m);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .product-image-preview img{width:100%;height:100%;object-fit:cover;display:block;}.product-image-empty{color:var(--muted);font-size:13px;font-weight:600;}

  /* ---- Generic content screens (Products/Receiving/Shift) ---- */
  .content-screen{flex-direction:column;width:100%;min-width:0;max-width:100%;overflow-y:auto;padding:22px 26px 40px;}
  .content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .content-title{font-size:21px;font-weight:800;}
  .content-actions{display:flex;gap:10px;}
  .card{min-width:0;max-width:100%;background:var(--surface);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:20px;}
  .list-row{
    min-width:0;
    display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row-name{font-weight:700;font-size:14.5px;}
  .list-row-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--bg);color:var(--muted);}
  .badge.type-composite{background:var(--accent-soft);color:var(--accent);}
  .badge.shortage{background:#FFE1E1;color:#C62828;border:1px solid #FFC7C7;}
  .badge.received{background:#E3F6E8;color:#26733A;border:1px solid #C9EBCF;}
  .badge.deleted-admin{background:#E8D8FF;color:#6B35A8;border:1px solid #C9A9F2;}
  .po-qty{width:118px !important;min-width:118px;height:52px !important;padding:10px 12px !important;font-size:20px !important;font-weight:800 !important;text-align:center;border-radius:14px !important;}
  .category-count{font-size:11.5px;color:var(--muted);font-weight:600;}
  .category-row{min-width:0;display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);}
  .category-row:last-child{border-bottom:none;}
  .category-row .category-main{flex:1;min-width:0;}
  .category-row .category-name{font-weight:800;font-size:14.5px;}
  .category-row .category-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .section-mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .icon-btn.danger{color:var(--danger);}
  .po-delete-btn{width:44px;height:44px;min-width:44px;border-radius:12px;background:#FFE3E3;border:1px solid #F2A8A8;color:#C62828;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 1px 2px rgba(198,40,40,.10);}
  .po-delete-btn:hover{background:#FFD1D1;}
  :root[data-theme='dark'] .po-delete-btn{background:#4A2024;border-color:#8D3C45;color:#FF8F98;box-shadow:0 1px 3px rgba(0,0,0,.25);}

  /* Products table */
  .products-table{width:100%;}
  .products-table-head,.products-table-row{display:grid;grid-template-columns:minmax(220px,2.2fr) minmax(120px,1.2fr) 105px 110px 125px 120px;align-items:center;gap:12px;}
  .products-table-head{padding:0 10px 10px;color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
  .products-sort-header{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:44px;min-width:0;padding:6px 0;background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;}.products-sort-header.selected{color:var(--ink);}.product-sort-mark{display:flex;flex-direction:column;gap:3px;width:8px;flex:0 0 8px;}.product-sort-mark::before,.product-sort-mark::after{content:"";width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;opacity:.25;}.product-sort-mark::before{border-bottom:4px solid currentColor;}.product-sort-mark::after{border-top:4px solid currentColor;}.product-sort-mark.asc::before,.product-sort-mark.desc::after{opacity:1;}
  .products-table-row{position:relative;padding:13px 10px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s,transform .12s;}
  .products-table-row:hover{background:var(--bg);}
  .products-table-main{min-width:0;}
  .products-table-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .products-table-sub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .products-table-cell{min-width:0;font-size:13px;font-weight:700;}
  .products-table-muted{color:var(--muted);font-weight:600;}
  .products-stock{font-variant-numeric:tabular-nums;}
  .product-modal-delete{margin-right:auto;border:1.5px solid #E6B0B0;background:transparent;color:#C62828;}
  .product-modal-delete:hover{background:#FFF0F0;border-color:#D98C8C;}
  :root[data-theme='dark'] .products-table-row:hover{background:#202A39;}
  :root[data-theme='dark'] .product-modal-delete{border-color:#7A3C43;color:#FF8F98;}
  :root[data-theme='dark'] .product-modal-delete:hover{background:#3A2024;border-color:#A84D57;}
  @media(max-width:1050px){
    .products-table-head,.products-table-row{grid-template-columns:minmax(190px,2fr) minmax(100px,1fr) 95px 100px 110px 105px;gap:8px;}
  }
  @media(max-width:820px){
    .products-table-head{display:none;}
    .products-table-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px 8px;}
    .products-table-cell{display:none;}
    .products-table-row .products-table-main{display:block;}
    .products-mobile-meta{display:flex!important;}
  }
  .products-mobile-meta{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px;}

  .grid-2{display:grid;min-width:0;max-width:100%;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;min-width:0;max-width:100%;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
  .stat-box{background:var(--bg);border-radius:var(--radius-m);padding:16px;}
  .stat-box .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .stat-box .value{font-size:20px;font-weight:800;}

  /* ---- Forms / modal ---- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-s);
    font-size:15px;background:var(--surface);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,31,42,.06);}
  .discount-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .discount-choice{min-height:48px;padding:9px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);font-weight:700;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.12s;}
  .discount-choice span{font-size:12px;font-weight:800;opacity:.8;white-space:nowrap;}
  .discount-choice.selected{background:#DFF5E8;border-color:#38A979;color:#126B4E;box-shadow:0 0 0 2px rgba(56,169,121,.12);}
  :root[data-theme='dark'] .discount-choice.selected{background:#1D4638;border-color:#43C38D;color:#8FE0BE;}
  .modifier-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .modifier-choice{min-height:40px;padding:8px 10px;border:1.5px solid var(--border);border-radius:11px;background:var(--bg);font-weight:750;font-size:12px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:7px;cursor:pointer;transition:.12s;min-width:0;}
  .modifier-choice-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modifier-choice-price{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;}
  .modifier-choice.selected{background:#DFF5E8;border-color:#38A979;color:#126B4E;box-shadow:0 0 0 2px rgba(56,169,121,.12);}
  .modifier-choice.selected .modifier-choice-price{color:inherit;}
  :root[data-theme='dark'] .modifier-choice.selected{background:#1D4638;border-color:#43C38D;color:#8FE0BE;}
  @media(max-width:700px){.modifier-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

  .delivery-address-field input{min-height:48px;}
  .delivery-address-field label{color:var(--ink);}
  .delivery-address-field input::placeholder,.field input::placeholder{color:#A2A6AE;}
  .field input[type=tel]{font-variant-numeric:tabular-nums;}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{
    flex:1;padding:12px;border-radius:var(--radius-s);border:1.5px solid var(--border);text-align:center;
    font-weight:700;font-size:14px;color:var(--muted);
  }
  .radio-opt.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,31,42,.45);display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .modal{
    background:var(--surface);border-radius:var(--radius-l);max-width:460px;width:100%;max-height:92vh;
    overflow-y:auto;padding:28px;
  }
  .modal.product-modal{max-width:1080px;width:min(1080px,calc(100vw - 32px));padding:32px;}
  .product-modal .modal-title{font-size:22px;margin-bottom:22px;}
  .product-modal .field{margin-bottom:18px;}
  .product-modal .field label{font-size:13px;margin-bottom:7px;color:var(--ink);}
  .product-modal .field input,.product-modal .field select{min-height:48px;font-size:16px;}
  .product-modal .radio-opt{min-height:48px;font-size:15px;}
  .product-form-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,.7fr);gap:14px;}
  .component-builder{border:1px solid var(--border);border-radius:18px;padding:18px;background:var(--bg);}
  .component-builder-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .component-builder-title{font-size:16px;font-weight:800;}
  .component-builder-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:3px;}
  .component-total{font-size:14px;font-weight:800;white-space:nowrap;}
  .component-selected{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .component-card{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:11px 12px;}

/* ============================= STORAGE ============================= */
// Внутри Claude используется window.storage (облачное хранилище артефакта).
// При запуске как самостоятельного сайта (после хостинга/Safari) такого API нет —
// тогда данные хранятся в localStorage самого браузера на устройстве.
const hasCloudStorage = (typeof window.storage !== 'undefined');
const LS_PREFIX = 'prilavok_';
let storageBroken = false;
let storageCheckedOnce = false;
const CRITICAL_STORAGE_JOURNAL_KEY = 'criticalStorageJournal';
const CRITICAL_STORAGE_KEYS = new Set(['products','orders','shifts','employees','parked','purchaseOrders','receivings','receivingDraft','suppliers','discounts','layout','posNavigation','company','deliveryRates','hallTables','bookings','inventoryConfig','inventoryHistory','inventoryDraft','currentOrderSession']);
let criticalStorageRecoveryPending = false;
let criticalOperationBusy = false;

function markStorageBroken(reason){
  storageBroken = true;
  console.error('Хранилище недоступно:', reason);
}

// Проверяем прямо при загрузке, реально ли доступен localStorage
// (в некоторых хостингах/встроенных предпросмотрах он заблокирован —
// тогда любая запись тихо проваливается, и данные "исчезают" после обновления).
function testLocalStorage(){
  try{
    const testKey = LS_PREFIX + '__test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    return ok;
  }catch(e){ return false; }
}

// Compatibility facade: keep callers, fallbacks and the storage warning unchanged.
async function loadKey(key, fallback){
  try{
    return await window.PrilavokCore.Storage.get(key, fallback, markStorageBroken);
  }catch(e){ markStorageBroken(e); return fallback; }
}
async function saveKey(key, value){
  try{
    await window.PrilavokCore.Storage.set(key, value);
  }
  catch(e){ markStorageBroken(e); }
}
function storageRecordArray(value,key){
  if(!Array.isArray(value)){markStorageBroken('Некорректный формат '+key);return []}
  const records=value.filter(item=>item&&typeof item==='object'&&!Array.isArray(item));
  if(records.length!==value.length)markStorageBroken('Некорректные записи '+key);
  return records;
}
function storageRecord(value,key,fallback={}){
  if(value&&typeof value==='object'&&!Array.isArray(value))return value;
  if(value!==null&&value!==undefined)markStorageBroken('Некорректный формат '+key);
  return storageSnapshot(fallback);
}
function storageSnapshot(value){
  return JSON.parse(JSON.stringify(value));
}
function criticalStorageWrites(writes){
  if(!writes || typeof writes!=='object' || Array.isArray(writes)) throw new Error('Некорректная локальная транзакция');
  const entries=Object.entries(writes);
  if(!entries.length || entries.some(([key])=>!CRITICAL_STORAGE_KEYS.has(key))) throw new Error('Некорректные ключи локальной транзакции');
  return entries.map(([key,value])=>({key,value:storageSnapshot(value)}));
}
async function recoverCriticalStorageJournal(){
  let journal;
  try{journal=await window.PrilavokCore.Storage.get(CRITICAL_STORAGE_JOURNAL_KEY,null,markStorageBroken)}
  catch(e){markStorageBroken(e);criticalStorageRecoveryPending=true;return false}
  if(!journal)return true;
  criticalStorageRecoveryPending=true;
  try{
    if(journal.version!==1 || !Array.isArray(journal.writes) || !journal.writes.length)throw new Error('Повреждён журнал критической операции');
    for(const entry of journal.writes){
      if(!entry || !CRITICAL_STORAGE_KEYS.has(entry.key))throw new Error('Недопустимый ключ в журнале критической операции');
      await window.PrilavokCore.Storage.set(entry.key,entry.value);
    }
    await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,null);
    criticalStorageRecoveryPending=false;
    return true;
  }catch(e){markStorageBroken(e);return false}
}
async function commitCriticalStorage(type,writes){
  if(criticalStorageRecoveryPending)throw new Error('Незавершённая операция хранения. Перезапустите M POS для восстановления данных');
  const journal={version:1,id:uid(),type:String(type||'critical'),createdAt:Date.now(),writes:criticalStorageWrites(writes)};
  try{await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,journal)}
  catch(e){markStorageBroken(e);throw new Error('Не удалось начать безопасное сохранение: '+(e?.message||e))}
  criticalStorageRecoveryPending=true;
  try{
    for(const entry of journal.writes)await window.PrilavokCore.Storage.set(entry.key,entry.value);
    await window.PrilavokCore.Storage.set(CRITICAL_STORAGE_JOURNAL_KEY,null);
    criticalStorageRecoveryPending=false;
  }catch(e){markStorageBroken(e);throw new Error('Операция сохранена для восстановления. Перезапустите M POS: '+(e?.message||e))}
}
async function loadAll(){
  if(!hasCloudStorage && !testLocalStorage()){
    markStorageBroken('localStorage test write failed');
  }
  storageCheckedOnce = true;
  await recoverCriticalStorageJournal();
  const [products, shifts, employees, orders, parked, demandOverload, operationalOutbox, operationalRevision, receivings, suppliers, purchaseOrders, discounts, layout, printer, theme, company, deliveryRates, telegram, network, currentOrderSession, hallTables, bookings, webEvents, posNavigation, inventoryConfig, inventoryHistory, inventoryDraft] = await Promise.all([
    loadKey('products', null),
    loadKey('shifts', []),
    loadKey('employees', []),
    loadKey('orders', []),
    loadKey('parked', []),
    loadKey('demandOverload', false),
    loadKey('operationalOutbox', []),
    loadKey('operationalRevision', 0),
    loadKey('receivings', []),
    loadKey('suppliers', []),
    loadKey('purchaseOrders', []),
    loadKey('discounts', []),
    loadKey('layout', {categoryOrder:[], categoryColors:{}, categorySymbols:{}, categoryOnline:{}}),
    loadKey('printer', {enabled:false, autoPrint:false, ip:'', port:9100 }),
    loadKey('theme', 'light'),
    loadKey('company', {establishmentName:'', legalName:'', address:'', deliveryAddress:''}),
    loadKey('deliveryRates', []),
    loadKey('telegram', {enabled:false, botToken:'', chatId:'', threadId:'', notifyShiftOpened:true, notifyShiftClosed:true, notifyMonthlyWarehouse:false, lastMonthlyWarehouseSent:''}),
    loadKey('network', {backendUrl:'https://project-dubrovno.up.railway.app', deviceKey:'', deviceName:'M POS iPad', lastSyncAt:null, lastSyncStatus:''}),
    loadKey('currentOrderSession', null),
    loadKey('hallTables', []),
    loadKey('bookings', []),
    loadKey('webEvents', []),
    loadKey('posNavigation', {version:1,categories:[]}),
    loadKey('inventoryConfig', {enabled:false,frequency:'monthly',productIds:[],lastCompletedAt:null}),
    loadKey('inventoryHistory', []),
    loadKey('inventoryDraft', null)
  ]);
  const productRowsValid=products===null||(Array.isArray(products)&&products.every(item=>item&&typeof item==='object'&&!Array.isArray(item)));
  if(!productRowsValid)markStorageBroken('Некорректный формат products');
  state.products = products===null ? seedProducts() : (Array.isArray(products)?products.filter(item=>item&&typeof item==='object'&&!Array.isArray(item)):[]);
  state.shifts = storageRecordArray(shifts,'shifts');
  state.employees = storageRecordArray(employees,'employees');
  state.employees.forEach(e=>{ e.role = e.role==='admin' ? 'admin' : 'employee'; });
  state.orders = storageRecordArray(orders,'orders');
  state.parked = storageRecordArray(parked,'parked');
  state.demandOverload = demandOverload === true;
  state.operationalOutbox = Array.isArray(operationalOutbox) ? operationalOutbox.slice(-2) : [];
  state.operationalRevision = Math.max(0,Number(operationalRevision)||0);
  state.receivings = storageRecordArray(receivings,'receivings');
  state.suppliers = storageRecordArray(suppliers,'suppliers');
  state.purchaseOrders = storageRecordArray(purchaseOrders,'purchaseOrders');
  state.purchaseOrderSupplierId = '';
  state.purchaseOrderCart = [];
  state.discounts = storageRecordArray(discounts,'discounts');
  state.receivingCart = [];
  const layoutShapeValid=!!layout&&typeof layout==='object'&&!Array.isArray(layout);
  const safeLayout=storageRecord(layout,'layout',{categoryOrder:[],categoryColors:{},categorySymbols:{},categoryOnline:{}});
  state.categoryOrder = Array.isArray(safeLayout.categoryOrder)?safeLayout.categoryOrder:[];
  state.categoryColors = storageRecord(safeLayout.categoryColors,'layout.categoryColors',{});
  state.categorySymbols = storageRecord(safeLayout.categorySymbols,'layout.categorySymbols',{});
  state.categoryOnline = storageRecord(safeLayout.categoryOnline,'layout.categoryOnline',{});
  state.categoryOrder.forEach(c=>{ if(typeof state.categoryOnline[c] !== 'boolean') state.categoryOnline[c]=true; });
  state.layoutTiles = Array.isArray(safeLayout.tiles) ? safeLayout.tiles.filter(item=>item&&typeof item==='object'&&!Array.isArray(item)) : [];
  state.posNavigation=normalizePosNavigation(posNavigation);
  state.posFolder='';
  state.posPath = null;
  state.printer = Object.assign({enabled:false, autoPrint:false, ip:'', port:9100 }, storageRecord(printer,'printer',{}));
  state.company = Object.assign({establishmentName:'', legalName:'', address:'', deliveryAddress:''}, storageRecord(company,'company',{}));
  state.deliveryRates = storageRecordArray(deliveryRates,'deliveryRates');
  state.telegram = Object.assign({enabled:false, botToken:'', chatId:'', threadId:'', notifyShiftOpened:true, notifyShiftClosed:true, notifyMonthlyWarehouse:false, lastMonthlyWarehouseSent:''}, storageRecord(telegram,'telegram',{}));
  const networkShapeValid=!!network&&typeof network==='object'&&!Array.isArray(network);
  state.network = Object.assign({backendUrl:'https://project-dubrovno.up.railway.app', deviceKey:'', deviceName:'M POS iPad', lastSyncAt:null, lastSyncStatus:''}, storageRecord(network,'network',{}));
  if(!state.network.deviceKey){
    state.network.deviceKey = (crypto?.randomUUID ? crypto.randomUUID() : ('dev_'+uid()+'_'+uid()));
    if(networkShapeValid)saveKey('network', state.network);
  }
  state.hallTables = storageRecordArray(hallTables,'hallTables');
  state.bookings = storageRecordArray(bookings,'bookings');
  state.webEvents = storageRecordArray(webEvents,'webEvents');
  state.inventoryConfig = Object.assign({enabled:false,frequency:'monthly',productIds:[],lastCompletedAt:null}, storageRecord(inventoryConfig,'inventoryConfig',{}));
  state.inventoryConfig.productIds = Array.isArray(state.inventoryConfig.productIds) ? state.inventoryConfig.productIds : [];
  state.inventoryConfig.customDates = Array.isArray(state.inventoryConfig.customDates) ? state.inventoryConfig.customDates : [];
  state.inventoryHistory = storageRecordArray(inventoryHistory,'inventoryHistory');
  state.inventoryDraft = inventoryDraft===null ? null : storageRecord(inventoryDraft,'inventoryDraft',null);
  if(!state.bookingDate) state.bookingDate = localDateString(new Date());

  // Восстанавливаем незавершённый текущий заказ после перезапуска приложения.
  // Сохраняются позиции, количество, комментарии/скидки и параметры заказа.
  const safeCurrentOrder=currentOrderSession===null?null:storageRecord(currentOrderSession,'currentOrderSession',null);
  if(safeCurrentOrder && Array.isArray(safeCurrentOrder.items)){
    state.cart = safeCurrentOrder.items.filter(item=>item&&typeof item==='object'&&!Array.isArray(item));
    state.orderLabel = safeCurrentOrder.orderLabel || '';
    state.orderType = safeCurrentOrder.orderType || 'На месте';
    state.customer = Object.assign({name:'',phone:'',address:''}, storageRecord(safeCurrentOrder.customer,'currentOrderSession.customer',{}));
    state.deliveryFee = Number(safeCurrentOrder.deliveryFee || 0);
    state.deliveryTariffSelected = safeCurrentOrder.deliveryTariffSelected===true;
    state.orderComment = safeCurrentOrder.orderComment || '';
    state.currentOrderSource = safeCurrentOrder.source || '';
    state.currentWebOrderId = safeCurrentOrder.webOrderId || '';
    state.currentWebOrderStatus = safeCurrentOrder.webOrderStatus || '';
    window.__currentOrderKitchenPrinted = !!safeCurrentOrder.kitchenPrinted;
    window.__currentOrderPrintedItems = Array.isArray(safeCurrentOrder.printedItems) ? JSON.parse(JSON.stringify(safeCurrentOrder.printedItems)) : [];
    const previousLoyaltyPrograms=state.loyaltyPrograms,previousLoyaltyRedemptions=state.loyaltyRedemptions;
    if(safeCurrentOrder.paymentDraft!=null){
      state.loyaltyPrograms=Array.isArray(safeCurrentOrder.loyaltyPrograms)?storageSnapshot(safeCurrentOrder.loyaltyPrograms):[];
      state.loyaltyRedemptions=safeCurrentOrder.loyaltyRedemptions&&typeof safeCurrentOrder.loyaltyRedemptions==='object'&&!Array.isArray(safeCurrentOrder.loyaltyRedemptions)?storageSnapshot(safeCurrentOrder.loyaltyRedemptions):{};
    }
    const restoredPaymentDraft=validateSplitPaymentDraft(safeCurrentOrder.paymentDraft,cartTotal());
    if(restoredPaymentDraft){
      state._splitPayments=restoredPaymentDraft.parts;
      state._splitCount=restoredPaymentDraft.parts.length;
      state._splitPaymentTotalCents=restoredPaymentDraft.totalCents;
    }else if(safeCurrentOrder.paymentDraft!=null){
      state.loyaltyPrograms=previousLoyaltyPrograms;state.loyaltyRedemptions=previousLoyaltyRedemptions;
      markStorageBroken('Некорректный черновик раздельной оплаты');
    }
  }
  state.deliveryFee = Number(state.deliveryFee || 0);
  state.theme = theme === 'dark' ? 'dark' : 'light';
  applyTheme();

  // Валюта приложения: белорусский рубль. Старые данные сохраняются без пересчёта сумм.
  state.currency = 'Br';

  // нормализация: у старых/новых товаров должен быть sortOrder для ручной сортировки
  let needSave = (products === null);
  let maxOrder = Math.max(0, ...state.products.map(p=>p.sortOrder||0));
  for(const p of state.products){
    if(typeof p.sortOrder !== 'number'){ maxOrder += 1; p.sortOrder = maxOrder; if(productRowsValid)needSave = true; }
    if(typeof p.availableOnline !== 'boolean'){ p.availableOnline = true; if(productRowsValid)needSave = true; }
    if(typeof p.imageUrl !== 'string'){ p.imageUrl = ''; if(productRowsValid)needSave = true; }
  }
  if(needSave) saveKey('products', state.products);
  syncCategoryOrder();
  if(!state.layoutTiles.length){
    state.layoutTiles = state.products.map(p=>({type:'product', id:p.id}));
    if(layoutShapeValid)saveKey('layout', {categoryOrder: state.categoryOrder, categoryColors: state.categoryColors, categorySymbols: state.categorySymbols, categoryOnline: state.categoryOnline, tiles: state.layoutTiles});
  } else {
    // Удаляем из раскладки ссылки на уже удалённые товары/категории.
    const validProducts = new Set(state.products.map(p=>p.id));
    const validCategories = new Set(state.categoryOrder);
    state.layoutTiles = state.layoutTiles.filter(t =>
      t && ((t.type==='product' && validProducts.has(t.id)) || (t.type==='category' && validCategories.has(t.id)))
    );
  }

  state.loaded = true;
  render();
  if(hasPaidSplitPayment())setTimeout(()=>openPaymentModal(),0);
  startWebOrderEvents();
  startAvailabilitySchedule();
  queueOperationalSnapshot();
  void flushOperationalOutbox();
  startOperationalSchedule();
  void recoverWebAcceptanceJournal().catch(e=>console.warn('WEB acceptance recovery:',e));
}
// поддерживаем список категорий в актуальном виде: новые — в конец, пустые — не теряем сразу
function syncCategoryOrder(){
  const present = new Set(state.products.map(p=>(p.category||'').trim() || 'Без категории'));
  let changed = false;
  for(const c of present){
    if(!state.categoryOrder.includes(c)){ state.categoryOrder.push(c); changed = true; }
  }
  if(changed) saveKey('layout', {categoryOrder: state.categoryOrder, categoryColors: state.categoryColors, categorySymbols: state.categorySymbols, categoryOnline: state.categoryOnline, tiles: state.layoutTiles});
  return changed;
}
function seedProducts(){
  const espresso = {id:uid(),name:'Эспрессо',category:'Напитки',type:'simple',price:150,cost:35,stock:9999};
  const milk = {id:uid(),name:'Молоко (порция)',category:'Ингредиенты',type:'simple',price:0,cost:15,stock:50};
  const cup = {id:uid(),name:'Стакан',category:'Ингредиенты',type:'simple',price:0,cost:5,stock:100};
  const latte = {id:uid(),name:'Латте',category:'Напитки',type:'composite',price:220,
    components:[{productId:espresso.id,qty:1},{productId:milk.id,qty:1},{productId:cup.id,qty:1}]};
  const croissant = {id:uid(),name:'Круассан',category:'Выпечка',type:'simple',price:180,cost:70,stock:12};
  return [espresso, milk, cup, latte, croissant];
}

function getProduct(id){ return state.products.find(p=>p.id===id); }
// Expand a recipe into simple products; shared ingredients are summed across branches.
// Quantities stay in the existing stock units. No conversion or data migration here.
function productIngredients(p, qty=1, trail=new Set(), totals=new Map(), resolve=getProduct){
  if(!p) throw new Error('Товар или ингредиент не найден');
  qty=Number(qty);
  if(!Number.isFinite(qty) || qty<=0) throw new Error('Количество ингредиента должно быть больше нуля');
  if(trail.has(p.id)) throw new Error('Циклический состав: '+p.name);
  if(p.type==='simple'){
    const total=(totals.get(p.id)||0)+qty;
    if(!Number.isFinite(total)) throw new Error('Слишком большое количество: '+p.name);
    totals.set(p.id,total);
    return totals;
  }
  if(p.type!=='composite' || !Array.isArray(p.components) || !p.components.length){
    throw new Error('Проверьте состав товара: '+p.name);
  }
  trail.add(p.id);
  for(const c of p.components){
    if(!c) throw new Error('Некорректный ингредиент: '+p.name);
    productIngredients(resolve(c.productId),qty*Number(c.qty),trail,totals,resolve);
  }
  trail.delete(p.id);
  return totals;
}
function stockConsumptionFor(items){
  const totals=new Map();
  for(const item of items){
    productIngredients(getProduct(item.productId),item.qty,new Set(),totals);
    for(const m of (item.selectedModifiers||[])){
      const mp=getProduct(m.productId);
      if(!mp) throw new Error('Товар-модификатор не найден');
      productIngredients(mp,Number(item.qty||0)*Number(m.qty||0),new Set(),totals);
    }
  }
  return {version:1,items:[...totals].filter(([id])=>productTracksStock(getProduct(id))).map(([productId,qty])=>({productId,qty}))};
}
function checkedStockConsumption(items){
  const consumption=stockConsumptionFor(items);
  for(const item of consumption.items){
    const p=getProduct(item.productId);
    const stock=Number(p.stock)||0;
    const tolerance=Number.EPSILON*8*Math.max(Math.abs(stock),item.qty);
    if(!Number.isFinite(stock) || stock+tolerance<item.qty) throw new Error('Недостаточно остатка: '+p.name);
  }
  return consumption;
}
function canFulfillCart(items=state.cart){
  try{ checkedStockConsumption(items); return true; }
  catch(e){ flash(e.message); return false; }
}
function hasUnreturnedStockConsumption(productId){
  return state.orders.some(o=>!o.returnedAt && o.stockConsumption?.items?.some(i=>i.productId===productId));
}
function availableStock(p, resolve=getProduct){
  if(!p) return 0;
  if(p.type==='simple') return p.noStockTracking ? Infinity : (Number(p.stock)||0);
  try{
    const ingredients=productIngredients(p,1,new Set(),new Map(),resolve);
    let min=Infinity;
    for(const [id,qty] of ingredients){
      const ingredient=resolve(id);
      if(!productTracksStock(ingredient)) continue;
      const ratio=(Number(ingredient.stock)||0)/qty;
      if(!Number.isFinite(ratio)) return 0;
      const tolerance=Number.EPSILON*8*Math.max(1,Math.abs(ratio));
      min=Math.min(min,Math.max(0,Math.floor(ratio+tolerance)));
    }
    return min;
  }catch(e){ return 0; }
}
let compositeCostCache=new Map();
function clearCompositeCostCache(){compositeCostCache.clear();}
function compositeCost(p){
  if(!p) return 0;
  if(p.type==='simple') return p.cost || 0;
  if(compositeCostCache.has(p.id))return compositeCostCache.get(p.id);
  try{const value=[...productIngredients(p)].reduce((sum,[id,qty])=>sum+(Number(getProduct(id).cost)||0)*qty,0);compositeCostCache.set(p.id,value);return value;}
  catch(e){return 0;}
}
function compositeCostForQuantity(p,qty,unit){
  if(!p)return 0;
  if(p.type==='simple')return compositeCost(p)*componentBaseQty(p,qty,unit);
  return compositeCost(p)*componentBaseQty(p,qty,unit);
}

function roundStockQty(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return n;
  const rounded=Math.round((n+Number.EPSILON)*1000)/1000;
  return Object.is(rounded,-0)?0:rounded;
}
function stockQtyText(value){
  const rounded=roundStockQty(value);
  return Number.isFinite(rounded)?String(rounded):'0';
}

const OPERATIONAL_SCHEMA_VERSION=1,OPERATIONAL_TIMEOUT=2500,OPERATIONAL_MAX_BACKOFF=60000;
let operationalTimer=null,operationalBusy=false,operationalFailures=0,operationalListening=false,operationalController=null;
function buildOperationalSnapshot(now=Date.now()){
  return {schemaVersion:OPERATIONAL_SCHEMA_VERSION,sampledAt:new Date(now).toISOString(),device:{key:state.network?.deviceKey||'',name:state.network?.deviceName||'M POS iPad'},demand:{overload:state.demandOverload===true}};
}
function setDemandOverload(value){
  state.demandOverload=value===true;
  saveKey('demandOverload',state.demandOverload);
  operationalStateChanged();
  render();
  flash(state.demandOverload?'Повышенный спрос включён':'Обычная загрузка');
}

function operationalCoalesce(type,payload,now=Date.now()){
  const item={id:uid(),type,schemaVersion:OPERATIONAL_SCHEMA_VERSION,createdAt:now,attempts:0,nextAttemptAt:now,payload};
  state.operationalOutbox=(state.operationalOutbox||[]).filter(x=>x.type!==type);
  state.operationalOutbox.push(item);
  state.operationalOutbox=state.operationalOutbox.slice(-2);
  saveKey('operationalOutbox',state.operationalOutbox);return item;
}
function queueOperationalSnapshot(now=Date.now()){state.operationalRevision=Math.max(0,Number(state.operationalRevision)||0)+1;saveKey('operationalRevision',state.operationalRevision);const payload=buildOperationalSnapshot(now);payload.revision=state.operationalRevision;return operationalCoalesce('snapshot',payload,now);}
function operationalBackoffMs(attempts){return Math.min(OPERATIONAL_MAX_BACKOFF,Math.max(1000,1000*Math.pow(2,Math.min(6,Math.max(0,Number(attempts)||0)))));}
async function sendOperationalItem(item){
  const n=networkConfigFromState();if(!n.backendUrl||!n.deviceKey)return false;
  operationalController=new AbortController();const timeout=setTimeout(()=>operationalController?.abort(),OPERATIONAL_TIMEOUT);
  try{
    const endpoint='/api/operational/snapshot';
    const r=await fetch(n.backendUrl.replace(/\/+$/,'')+endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},body:JSON.stringify(item.payload),cache:'no-store',signal:operationalController.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);return true;
  }finally{clearTimeout(timeout);operationalController=null;}
}
async function flushOperationalOutbox(){
  if(operationalBusy||document.hidden||window._availabilityAppActive===false||!state.loaded||storageBroken)return false;
  operationalBusy=true;
  try{
    let sentAny=false;
    while(!document.hidden&&window._availabilityAppActive!==false){
      const now=Date.now(),item=(state.operationalOutbox||[]).filter(x=>(Number(x.nextAttemptAt)||0)<=now).sort((a,b)=>a.createdAt-b.createdAt)[0];
      if(!item)return sentAny||true;
      try{
        if(await sendOperationalItem(item)){
          state.operationalOutbox=state.operationalOutbox.filter(x=>x.id!==item.id);operationalFailures=0;sentAny=true;
          state.network.lastOperationalSyncAt=Date.now();state.network.lastOperationalStatus='ok';saveKey('network',state.network);saveKey('operationalOutbox',state.operationalOutbox);continue;
        }
      }catch(e){
        item.attempts=(Number(item.attempts)||0)+1;operationalFailures=item.attempts;item.nextAttemptAt=Date.now()+operationalBackoffMs(item.attempts);state.network.lastOperationalStatus='offline';saveKey('network',state.network);saveKey('operationalOutbox',state.operationalOutbox);
      }
      return false;
    }
    return sentAny;
  }finally{operationalBusy=false;}
}
function operationalReconnect(){
  if(!state.loaded||document.hidden||window._availabilityAppActive===false)return;
  operationalFailures=0;void recoverWebAcceptanceJournal();void retryPendingLoyalty();
  if((state.operationalOutbox||[]).some(x=>x.type==='snapshot'))void flushOperationalOutbox();
}
function startOperationalSchedule(){
  clearTimeout(operationalTimer);operationalTimer=null;
  if(!operationalListening){document.addEventListener('visibilitychange',()=>{if(document.hidden){operationalController?.abort();}else operationalReconnect();});window.addEventListener('online',operationalReconnect);operationalListening=true;}
}
function operationalStateChanged(){
  if(!state.loaded)return;
  queueOperationalSnapshot();
  if(!operationalBusy&&!document.hidden)void flushOperationalOutbox();
}
function runOperationalChannelTests(){
  const originalOutbox=state.operationalOutbox,originalRevision=state.operationalRevision,checks=[];state.operationalOutbox=[];
  operationalCoalesce('snapshot',{n:1},1000);operationalCoalesce('snapshot',{n:2},1001);
  checks.push({name:'outbox keeps only latest snapshot',ok:state.operationalOutbox.length===1&&state.operationalOutbox[0]?.type==='snapshot',details:JSON.stringify(state.operationalOutbox.map(x=>x.type))});
  checks.push({name:'latest snapshot wins',ok:state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.n===2});
  const revisionBefore=state.operationalRevision;queueOperationalSnapshot(1004);const rev1=state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.revision;queueOperationalSnapshot(1005);const rev2=state.operationalOutbox.find(x=>x.type==='snapshot')?.payload?.revision;checks.push({name:'snapshot revision is monotonic',ok:Number(rev2)===Number(rev1)+1&&Number(rev1)>revisionBefore});
  checks.push({name:'backoff is bounded',ok:operationalBackoffMs(100)<=OPERATIONAL_MAX_BACKOFF});
  state.operationalOutbox=originalOutbox;state.operationalRevision=originalRevision;saveKey('operationalOutbox',state.operationalOutbox);saveKey('operationalRevision',state.operationalRevision);
  return checks;
}
window.__runOperationalChannelTests=runOperationalChannelTests;

const AVAILABILITY_INTERVAL=10*60*1000;
let availabilityTimer=null,availabilityBusy=false,availabilityController=null,availabilityListening=false;
function buildAvailabilityItems(products){
  const byId=new Map(products.map(p=>[p.id,p]));
  return products.map(p=>{
    const qty=availableStock(p,id=>byId.get(id));
    return {externalId:String(p.id),quantity:qty===Infinity?null:(Number.isFinite(qty)?Math.max(0,qty):0)};
  }).sort((a,b)=>a.externalId.localeCompare(b.externalId));
}
async function publishAvailability(){
  if(availabilityBusy||document.hidden||window._availabilityAppActive===false||!state.loaded||storageBroken)return false;
  availabilityBusy=true;
  let timeout;
  try{
    let failed=false;const onError=()=>{failed=true;};const storage=window.PrilavokCore.Storage;
    // Derive from completed storage writes, never from an unsaved editor or state.
    const [products,network,previous]=await Promise.all([storage.get('products',null,onError),storage.get('network',null,onError),storage.get('webAvailabilityRevision',0,onError)]);
    if(failed||!Array.isArray(products)||!network?.backendUrl||!network.deviceKey)return false;
    if(!Number.isSafeInteger(previous)||previous<0)return false;
    const items=buildAvailabilityItems(products);
    const revision=Math.max(Date.now(),previous+1);
    if(!Number.isSafeInteger(revision))return false;
    await storage.set('webAvailabilityRevision',revision);
    if(document.hidden||window._availabilityAppActive===false)return false;
    availabilityController=new AbortController();timeout=setTimeout(()=>availabilityController?.abort(),30000);
    const r=await fetch(network.backendUrl.replace(/\/+$/,'')+'/api/availability/snapshot',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':network.deviceKey},body:JSON.stringify({version:1,revision,sampledAt:new Date().toISOString(),items}),cache:'no-store',signal:availabilityController.signal});
    return r.ok;
  }catch(e){return false;}
  finally{clearTimeout(timeout);availabilityController=null;availabilityBusy=false;}
}
function onAvailabilityAppState(active){
  window._availabilityAppActive=active;
  if(!active){clearTimeout(availabilityTimer);availabilityTimer=null;availabilityController?.abort();}
  else if(state.loaded)startAvailabilitySchedule();
}

function saveDeliveryRate(id){
  const name=(document.getElementById('delivery-rate-name')?.value||'').trim();
  const amount=parseFloat(document.getElementById('delivery-rate-amount')?.value);
  if(!name){flash('Введите название');return;}
  if(!Number.isFinite(amount)||amount<0){flash('Введите корректную стоимость');return;}
  if(id){ const r=state.deliveryRates.find(x=>x.id===id); if(r){r.name=name;r.amount=amount;} }
  else state.deliveryRates.push({id:uid(),name,amount});
  saveKey('deliveryRates',state.deliveryRates); closeModal(); render();
}
function deleteDeliveryRate(id){
  state.deliveryRates=state.deliveryRates.filter(r=>r.id!==id);
  if(state.orderType==='Доставка' && !state.deliveryRates.some(r=>Number(r.amount)===Number(state.deliveryFee))) state.deliveryFee=0;
  saveKey('deliveryRates',state.deliveryRates); render();

function saveDiscount(){

  const type=document.getElementById('df-type')?.value==='fixed'?'fixed':'percent';
  const value=parseFloat(document.getElementById('df-value')?.value);

function startAvailabilitySchedule(){
  clearTimeout(availabilityTimer);availabilityTimer=null;
  if(!availabilityListening){
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearTimeout(availabilityTimer);availabilityTimer=null;availabilityController?.abort();}
      else startAvailabilitySchedule();
    });availabilityListening=true;
  }
  if(document.hidden||window._availabilityAppActive===false)return;
  availabilityTimer=setTimeout(async()=>{await publishAvailability();startAvailabilitySchedule();},AVAILABILITY_INTERVAL);
}

function buildMenuSyncPayload(){
  const categoryNames=[];
  const addCat=(name)=>{ const n=String(name||'').trim(); if(n && !categoryNames.includes(n)) categoryNames.push(n); };
  (state.categoryOrder||[]).forEach(addCat);
  (state.products||[]).forEach(p=>addCat(p.category||'Без категории'));
  const categories=categoryNames.map((name,index)=>({
    externalId:'category:'+name,
    name,
    color:(state.categoryColors||{})[name]||'',
    sortOrder:index,
    isActive:(state.categoryOnline||{})[name]!==false
  }));
  const products=(state.products||[]).map((p,index)=>({
    externalId:String(p.id),
    name:String(p.name||''),
    description:String(p.description||''),
    price:Number(p.price||0),
    category:String(p.category||'Без категории'),
    sortOrder:Number.isFinite(Number(p.sortOrder)) ? Number(p.sortOrder) : index,
    isActive:true,
    availableOnline:(p.availableOnline!==false) && (state.categoryOnline[String(p.category||'Без категории').trim() || 'Без категории']!==false),
    imageUrl:String(p.imageUrl||'')
  })).filter(p=>p.name);
  return {deviceKey:networkConfigFromState().deviceKey,deviceName:networkConfigFromState().deviceName,categories,products};
}
async function syncMenuToBackend(){
  if(!saveNetworkSettings()) return;
  const n=networkConfigFromState();
  const payload=buildMenuSyncPayload();
  const status=document.getElementById('network-sync-status');
  if(status) status.textContent='Синхронизация…';
  try{
    const r=await fetch(n.backendUrl+'/api/menu/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},
      body:JSON.stringify(payload),
      cache:'no-store'
    });
    const data=await r.json().catch(()=>null);
    if(!r.ok) throw new Error(data?.error||('HTTP '+r.status));
    state.network.lastSyncAt=Date.now();
    state.network.lastSyncStatus=`Синхронизировано: ${Number(data?.categories||0)} категорий, ${Number(data?.products||0)} товаров.`;
    saveKey('network',state.network);
    render();
    flash('Меню успешно синхронизировано');
    void publishAvailability();
  }catch(e){
    state.network.lastSyncStatus='Ошибка синхронизации: '+(e?.message||'неизвестная ошибка');
    saveKey('network',state.network);
    render();
    flash('Ошибка синхронизации меню');
  }
}

function previousCalendarMonthRange(now=new Date()){
  const firstCurrent=new Date(now.getFullYear(),now.getMonth(),1);
  const lastPrevious=new Date(firstCurrent); lastPrevious.setDate(0);
  const firstPrevious=new Date(lastPrevious.getFullYear(),lastPrevious.getMonth(),1);
  const key=firstPrevious.getFullYear()+'-'+String(firstPrevious.getMonth()+1).padStart(2,'0');
  return {key,from:localDateString(firstPrevious),to:localDateString(lastPrevious)};
}
function maybeSendMonthlyWarehouseReport(){
  const t=telegramConfigFromState();
  if(!t.enabled || !t.notifyMonthlyWarehouse || !t.botToken || !t.chatId) return;
  if(!currentShiftEmployeeIsAdmin()) return;
  if(!window.webkit?.messageHandlers?.telegram) return;
  try{
    const period=previousCalendarMonthRange();
    if(t.lastMonthlyWarehouseSent===period.key) return;
    const payload=warehouseExportPayload(warehouseReport(period.from,period.to));
    window.webkit.messageHandlers.telegram.postMessage({...t,action:'sendMonthlyWarehouseReport',periodKey:period.key,report:payload});
  }catch(e){ console.error('Не удалось подготовить ежемесячный складской отчёт:',e); }
}

function productDependsOn(productId, targetId, seen=new Set()){
  if(productId===targetId) return true;
  if(seen.has(productId)) return false;
  seen.add(productId);
  const p=getProduct(productId);
  if(!p || p.type!=='composite') return false;
  return (p.components||[]).some(c=>productDependsOn(c.productId,targetId,seen));
}

async function saveProduct(editingId){
  const name = document.getElementById('pf-name').value.trim();
  const category = document.getElementById('pf-category').value.trim();

  }
  const existing=getProduct(editingId);
  if(existing && existing.type!==type && (existing.stockUnit || state.products.some(p=>p.id!==existing.id && productDependsOn(p.id,existing.id)))){flash('Тип товара с единицами или связями нельзя менять: создайте отдельный товар');return;}
  const btn = document.querySelector('#modal-root .modal-actions .btn-primary');
  if(btn){ btn.disabled=true; btn.textContent='Сохраняем…'; }
  try{
    let p;
    const originalProduct=editingId?JSON.stringify(getProduct(editingId)):null;
    if(editingId){
      p = JSON.parse(originalProduct);
      p.name = name; p.category = category; p.price = price; p.type = type;
      p.tileSymbol = tileSymbol;
      p.noStockTracking = noStockTracking;
      p.availableOnline = canEditProductWebSetting() ? window._pmOnline !== false : getProduct(editingId)?.availableOnline !== false;

      p = {id: uid(), name, category, price, type, tileSymbol, noStockTracking, sortOrder: nextOrder, availableOnline: canEditProductWebSetting() ? window._pmOnline !== false : false, imageUrl:''};
      if(type==='simple'){

      } else {

  window._pmLocalImageId=localImageId||null;

  const el=document.getElementById('pf-image-preview');
  if(el) el.innerHTML=`<img src="${escapeAttr(dataUrl)}" alt="">`;
  updateProductEditorSummary();
}
const nativeProductImageReads=new Map();
function readNativeProductImage(id){if(!id||!window.webkit?.messageHandlers?.photoPicker)return Promise.resolve(null);return new Promise(resolve=>{const requestId=uid();const timeout=setTimeout(()=>{nativeProductImageReads.delete(requestId);resolve(null)},3000);nativeProductImageReads.set(requestId,data=>{clearTimeout(timeout);resolve(data)});window.webkit.messageHandlers.photoPicker.postMessage({action:'read',id,requestId})})}
function handleNativeProductImageRead(requestId,dataUrl){const done=nativeProductImageReads.get(requestId);if(done){nativeProductImageReads.delete(requestId);done(dataUrl)}}

function handleProductImage(input){
  const file=input?.files?.[0]; if(!file) return;
  const session=window._pmSession;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      if(session!==window._pmSession || !document.getElementById('pe-save'))return;
      let dataUrl='';
      const c=document.createElement('canvas');
      const ctx=c.getContext('2d');
      if(!ctx){flash('Не удалось подготовить фото');return;}
      for(let attempt=0;attempt<8 && !dataUrl;attempt++){
        const scale=Math.min(1,(1200*Math.pow(.75,attempt))/Math.max(img.width,img.height));
        c.width=Math.max(1,Math.floor(img.width*scale));c.height=Math.max(1,Math.floor(img.height*scale));
        ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        for(const quality of [.82,.7,.55]){
          const candidate=c.toDataURL('image/jpeg',quality);
          if(candidate.startsWith('data:image/jpeg;base64,') && candidate.length<=800023){dataUrl=candidate;break;}
        }
      }
      if(!dataUrl){flash('Не удалось уменьшить фото. Выберите другое изображение.');return;}
      window._pmImageData=dataUrl;
      window._pmRemoveImage=false;
      const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML=`<img src="${window._pmImageData}" alt="">`;
      updateProductEditorSummary();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function removeProductImage(){
  if(window._pmLocalImageId)window.webkit?.messageHandlers?.photoPicker?.postMessage({action:'remove',id:window._pmLocalImageId});
  window._pmImageData=null;window._pmLocalImageId=null;window._pmRemoveImage=true;
  const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML='<div class="product-image-empty">📷 Фото будет удалено после сохранения</div>';
}
