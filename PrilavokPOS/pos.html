<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>M POS — касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F0;
    --surface:#FFFFFF;
    --ink:#1B1F2A;
    --muted:#767C8C;
    --accent:#0E8F6F;
    --accent-ink:#ffffff;
    --accent-soft:#E4F3EE;
    --navy:#22273A;
    --danger:#E0483E;
    --danger-soft:#FBE7E5;
    --border:#E7E4DD;
    --radius-l:22px;
    --radius-m:16px;
    --radius-s:10px;
    --shadow:0 1px 2px rgba(27,31,42,.04), 0 8px 24px rgba(27,31,42,.05);
  }
  :root[data-theme='dark']{
    --bg:#171A21; --surface:#222631; --ink:#F4F6FA; --muted:#A9B0BF;
    --accent:#31B98D; --accent-ink:#07140F; --accent-soft:#173B31;
    --navy:#10131A; --danger:#FF6B61; --danger-soft:#432522;
    --border:#353B49; --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ---- Top bar ---- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:var(--navy);color:#fff;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:100px;font-weight:700;font-size:14px;color:rgba(255,255,255,.62);transition:background .15s,color .15s;flex-shrink:0;}
  .brand.active{background:rgba(255,255,255,.14);color:#fff;}
  .brand:not(.active):hover{color:#fff;}
  .tabs{display:flex;gap:4px;flex:1;}
  .tab{
    padding:8px 14px;border-radius:100px;font-weight:600;font-size:14px;
    color:rgba(255,255,255,.62);transition:background .15s,color .15s;
  }
  .tab.active{background:rgba(255,255,255,.14);color:#fff;}
  .tab:not(.active):hover{color:#fff;}
  .shift-pill{
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;
    background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.on{background:#3ED28E;box-shadow:0 0 0 3px rgba(62,210,142,.25);}
  .dot.off{background:#FF7A70;box-shadow:0 0 0 3px rgba(255,122,112,.25);}

  .main{flex:1;min-height:0;min-width:0;overflow:hidden;}
  .screen{display:none;height:100%;width:100%;min-width:0;max-width:100%;}
  .screen.active{display:flex;}

  /* ---- POS screen ---- */
  #screen-pos{gap:16px;padding:16px;min-width:0;overflow:hidden;}
  .pos-left{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:12px;}
  .pos-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px;}
  .search-box{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:12px 16px;font-size:15px;color:var(--ink);
  }
  .search-box:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .park-btn{
    background:#E8F0FF;border:1px solid #C7D7F2;color:#31558F;border-radius:var(--radius-m);
    padding:11px 15px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:0 1px 2px rgba(49,85,143,.08);
  }
  :root[data-theme='dark'] .park-btn{background:#26334A;border-color:#3C506F;color:#BFD5FF;}
  .zone-title-btn{
    background:#F0E9FF;border:1px solid #D7C8F5;color:#5E4691;border-radius:var(--radius-m);
    padding:11px 16px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;
    width:auto;max-width:none;flex:0 0 auto;white-space:nowrap;overflow:visible;text-overflow:clip;
  }
  :root[data-theme='dark'] .zone-title-btn{background:#332B45;border-color:#51436C;color:#DCCBFF;}
  .park-badge{background:var(--accent);color:#fff;border-radius:100px;padding:1px 8px;font-size:12.5px;}
  .pos-actions-left{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-shrink:0;margin-left:auto;}
  .pos-toolbar-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .category-color-picker{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
  .category-color-option{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.10);}
  .category-color-option.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .chip{
    padding:8px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .sections-wrap{flex:1;overflow-y:auto;padding-bottom:8px;display:flex;flex-direction:column;gap:22px;}
  .cat-section{display:flex;flex-direction:column;gap:10px;}
  .cat-header{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink);}
  .cat-handle{cursor:grab;color:var(--muted);font-size:18px;touch-action:none;padding:2px 4px;}
  .product-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;
    min-height:56px;overflow:auto;padding:4px;border-radius:18px;
  }
  .product-grid.layout-edit-grid{
    position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;align-content:stretch;overflow:hidden;
    padding:14px;background-image:radial-gradient(circle, rgba(118,124,140,.20) 1px, transparent 1px);
    background-size:18px 18px;border:1px solid var(--border);
  }
  .layout-cell-highlight{position:absolute;pointer-events:none;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:18px;z-index:0;transition:all .08s ease;}
  .category-edit-grid{position:relative;}.category-edit-grid .layout-tile{touch-action:none;}.navigation-action{position:relative;z-index:2;min-height:40px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font-size:12px;align-self:flex-end;}
  .layout-tile{position:relative;min-width:0;z-index:1;}
  .layout-tile.drag-placeholder{visibility:hidden;}
  .layout-drag-clone{
    position:fixed;z-index:9999;pointer-events:none;width:var(--drag-w);height:var(--drag-h);
    transition:transform .06s ease;filter:drop-shadow(0 14px 24px rgba(27,31,42,.18));
  }
  .layout-drag-clone .pcard{height:100%;transform:none!important;cursor:grabbing!important;}
  .layout-edit-grid .pcard.edit-tile{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
  @media (min-width:900px){
    .product-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
    .product-grid.layout-edit-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
  }
  /* iPad portrait: give the POS tiles more breathing room instead of squeezing them. */
  @media (orientation:portrait) and (min-width:700px){
    #screen-pos .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
    #screen-pos .product-grid.layout-edit-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;}
  }
  .pcard{
    background:var(--surface);border-radius:var(--radius-m);padding:14px;text-align:left;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;box-sizing:border-box;
    border:1px solid transparent;transition:transform .08s;
  }
  .pcard:active{transform:scale(.97);}
  .pcard.disabled{opacity:.42;}
  .pcard.edit-tile{cursor:grab;border:1.5px dashed var(--border);touch-action:none;}
  .layout-dragging{opacity:.55;transform:scale(.98);}
  .layout-drop-before{outline:3px solid var(--accent);outline-offset:2px;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen{box-shadow:0 0 0 2px var(--accent);}
  .search-box:disabled,.park-btn:disabled{opacity:.45;}
  .tile-symbol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;line-height:1;font-weight:850;letter-spacing:1px;opacity:.6;pointer-events:none;z-index:0;white-space:nowrap;text-align:center;}
  .pcard > *:not(.tile-symbol){position:relative;z-index:1;}
  .pcard .tile-symbol + .pcard-name{position:relative;z-index:1;}
  .pcard-name{font-weight:700;font-size:14.5px;line-height:1.25;flex:1;}
  .pcard-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .pcard-price{font-weight:800;font-size:15.5px;}
  .pcard-stock{font-size:11.5px;color:var(--muted);font-weight:600;}
  .pcard-stock.low{color:var(--danger);}
  .pcard-type{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:100px;align-self:flex-start;}
  .layout-tile .tile-remove{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:800;z-index:2;}
  .category-tile .pcard-name:after{content:'›';float:right;color:var(--muted);font-size:20px;line-height:14px;}
  :root[data-theme='dark'] .category-tile .pcard{background:var(--surface)!important;border:2px solid var(--category-color);box-shadow:0 0 8px color-mix(in srgb,var(--category-color) 70%, transparent),0 0 18px color-mix(in srgb,var(--category-color) 28%, transparent);}
  .layout-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;}
  .layout-add-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .layout-add-row:last-child{border-bottom:none;}
  .layout-add-row .name{flex:1;font-weight:700;font-size:14px;}
  .layout-add-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .layout-add-btn{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:700;}
  .pos-back{display:flex;align-items:center;justify-content:center;gap:8px;background:#E8F0FF;border:1px solid #C7D7F2;color:#31558F;border-radius:var(--radius-m);padding:11px 15px;min-height:44px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(49,85,143,.08);}
  :root[data-theme='dark'] .pos-back{background:#26334A;border-color:#3C506F;color:#BFD5FF;}
  .empty-hint{margin:auto;text-align:center;color:var(--muted);font-size:14.5px;max-width:260px;}

  /* ---- Analytics ---- */
  .analytics-period-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.analytics-period-modal-grid{grid-template-columns:1fr;}}

  .analytics-filters{width:100%;min-width:0;}
  .analytics-period-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px;}
  .analytics-period-title{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2;}
  .analytics-period-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .analytics-period-layout{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;width:100%;min-width:0;}
  .analytics-date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;min-width:0;flex:0 1 430px;box-sizing:border-box;width:100%;}
  .analytics-date-fields > .analytics-filter{min-width:0;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;}
  .analytics-date-fields > .analytics-filter input,.analytics-date-fields > .analytics-filter select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;}
  .analytics-filter{min-width:0;display:flex;flex-direction:column;}
  .analytics-filter label{display:block;height:auto;font-size:11.5px;color:var(--muted);font-weight:800;margin:0 0 6px 2px;}
  .analytics-filter input,.analytics-filter select{box-sizing:border-box;width:100%;max-width:100%;height:46px;background:var(--surface);border:1.5px solid var(--border);border-radius:13px;padding:0 12px;color:var(--ink);font:inherit;font-weight:700;min-width:0;display:block;outline:none;transition:border-color .12s,box-shadow .12s,background .12s;}
  .analytics-filter input[type='date']{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;flex:1 1 auto;overflow:hidden;min-inline-size:0;-webkit-appearance:none;}
  .analytics-filter input[type='date']::-webkit-date-and-time-value{min-width:0;text-align:left;}
  .analytics-filter input[type='date']::-webkit-calendar-picker-indicator{margin-left:auto;padding:2px;max-width:18px;}
  .analytics-filter input:focus,.analytics-filter select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);}
  .analytics-presets-wrap{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .analytics-presets-label{font-size:11.5px;color:var(--muted);font-weight:800;margin-left:2px;}
  .analytics-presets{display:flex;align-items:center;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--border);border-radius:14px;}
  .analytics-presets .btn{box-sizing:border-box;width:auto!important;min-width:88px;height:38px;padding:0 13px;white-space:nowrap;border-radius:10px!important;border:1px solid transparent;font-size:12.5px;font-weight:800;background:transparent;color:var(--muted);box-shadow:none;transition:background .12s,color .12s,border-color .12s,transform .12s;}
  .analytics-presets .btn:hover{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .analytics-presets .btn:active{transform:scale(.97);}
  :root[data-theme='dark'] .analytics-presets .btn.analytics-preset-active{background:var(--surface);color:var(--accent);border-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.22);}

  @media(max-width:900px){
    .analytics-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-grid-2{grid-template-columns:1fr;}
    .analytics-period-layout{align-items:stretch;flex-direction:column;gap:12px;}
    .analytics-date-fields{flex:1 1 auto;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-presets-wrap{width:100%;}
    .analytics-presets{width:100%;}
    .analytics-presets .btn{flex:1 1 0;min-width:0;}
  }
  @media(max-width:620px){
    .analytics-kpis{grid-template-columns:1fr 1fr;}
    .hbar-row{grid-template-columns:100px 1fr 68px;}
    .analytics-period-head{margin-bottom:12px;}
    .analytics-date-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
    .analytics-filter input{height:44px;padding:0 10px;}
    .analytics-presets{gap:4px;padding:3px;border-radius:12px;}
    .analytics-presets .btn{height:36px;padding:0 5px;font-size:12px;border-radius:9px!important;}
  }
  @media(max-width:420px){
    .analytics-date-fields{grid-template-columns:1fr;}
    .analytics-presets .btn{font-size:11.5px;}
  }
  .analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .analytics-kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .analytics-kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .analytics-kpi .k-value{font-size:24px;font-weight:800;margin-top:7px;}
  .analytics-sensitive{filter:blur(8px);user-select:none;cursor:pointer;}
  .analytics-sensitive-wrap{position:relative;min-height:31px;}
  .analytics-lock-btn{margin-top:7px;width:auto!important;height:34px;padding:0 11px!important;font-size:12px!important;}
  .analytics-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .analytics-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0;}
  .analytics-title{font-size:16px;font-weight:800;margin-bottom:4px;}
  .analytics-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .hbar-list{display:flex;flex-direction:column;gap:13px;}
  .hbar-row{display:grid;grid-template-columns:minmax(100px,1fr) 3fr 72px;gap:10px;align-items:center;}
  .hbar-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{height:18px;background:var(--bg);border-radius:100px;overflow:hidden;border:1px solid var(--border);}
  .hbar-fill{height:100%;border-radius:100px;background:var(--accent);min-width:3px;}
  .hbar-value{text-align:right;font-size:12.5px;font-weight:800;white-space:nowrap;}
  .analytics-table{width:100%;border-collapse:collapse;font-size:13px;}
  .analytics-table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:0 8px 9px;border-bottom:1px solid var(--border);}
  .analytics-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
  .analytics-table tr:last-child td{border-bottom:none;}
  /* ---- Cart panel ---- */
  .cart-panel{
    width:380px;max-width:100%;flex-shrink:0;min-width:0;background:var(--surface);border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .cart-head{padding:18px 20px 10px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;}
  .cart-head span{font-weight:600;font-size:13px;color:var(--muted);}
  .cart-items{flex:1;overflow-y:auto;padding:0 14px;}
  .cart-empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .cart-row{position:relative;padding:0;border-bottom:1px solid var(--border);touch-action:pan-y;background:var(--surface);overflow:hidden;}
  .cart-row-swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;background:linear-gradient(90deg,#E45858,#D62F3D);color:#fff;pointer-events:none;z-index:0;overflow:hidden;}
  .cart-swipe-delete-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:86px;height:100%;transform:scale(.78);opacity:.18;transition:transform .16s ease,opacity .16s ease;}
  .cart-swipe-delete-action svg{width:26px;height:26px;display:block;}
  .cart-swipe-delete-action span{font-size:11px;font-weight:800;line-height:1;}
  .cart-row-content{position:relative;z-index:1;padding:12px 6px;background:var(--surface);will-change:transform;transition:transform .28s cubic-bezier(.22,.8,.24,1);}
  .cart-row.swiping .cart-row-content{transition:none;}
  .cart-row.swipe-ready .cart-swipe-delete-action{transform:scale(1);opacity:1;}
  .cart-row.swipe-delete .cart-row-content{transform:translateX(-100%);transition:transform .22s cubic-bezier(.55,0,1,.45);}
  @media (hover:none) and (pointer:coarse){.cart-row-swipe-bg{display:flex;}}
  .cart-row-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .cart-row-name{font-weight:700;font-size:14px;line-height:1.3;}
  .cart-row-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .cart-row-remove{color:var(--muted);font-size:18px;padding:2px 4px;flex-shrink:0;}
  .cart-row-bottom{display:flex;justify-content:space-between;align-items:center;}
  .qty-stepper{display:flex;align-items:center;gap:3px;background:var(--bg);border-radius:100px;padding:2px;}
  .qty-stepper button{width:30px;height:30px;font-size:16px;font-weight:800;border-radius:100px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;line-height:1;}
  .qty-stepper button:focus{outline:none;box-shadow:none;}
  .qty-stepper button:active{background:var(--bg);border-color:var(--border);transform:scale(.94);}
  @media (hover:hover) and (pointer:fine){
    .qty-stepper button:hover{border-color:var(--accent);background:var(--bg);}
  }
  .qty-stepper .qty-minus{color:#B23A3A;}
  .qty-stepper .qty-plus{color:#2E7D32;}
  .qty-stepper span{min-width:28px;text-align:center;font-weight:800;font-size:14px;color:var(--text);user-select:none;}

function testLocalStorage(){
  try{
    const testKey = LS_PREFIX + '__test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);

  }catch(e){ return false; }
}

/* ============================= DERIVED HELPERS ============================= */
function getProduct(id){ return state.products.find(p=>p.id===id); }
// Expand a recipe into simple products; shared ingredients are summed across branches.
// Quantities stay in the existing stock units. No conversion or data migration here.
function productIngredients(p, qty=1, trail=new Set(), totals=new Map(), resolve=getProduct){
  if(!p) throw new Error('Товар или ингредиент не найден');
  qty=Number(qty);
  if(!Number.isFinite(qty) || qty<=0) throw new Error('Количество ингредиента должно быть больше нуля');
  if(trail.has(p.id)) throw new Error('Циклический состав: '+p.name);
  if(p.type==='simple'){
    const total=(totals.get(p.id)||0)+qty;
    if(!Number.isFinite(total)) throw new Error('Слишком большое количество: '+p.name);
    totals.set(p.id,total);
    return totals;
  }
  if(p.type!=='composite' || !Array.isArray(p.components) || !p.components.length){
    throw new Error('Проверьте состав товара: '+p.name);
  }
  trail.add(p.id);
  for(const c of p.components){
    if(!c) throw new Error('Некорректный ингредиент: '+p.name);
    productIngredients(resolve(c.productId),qty*Number(c.qty),trail,totals,resolve);
  }
  trail.delete(p.id);
  return totals;
}
function stockConsumptionFor(items){
  const totals=new Map();
  for(const item of items){
    productIngredients(getProduct(item.productId),item.qty,new Set(),totals);
    for(const m of (item.selectedModifiers||[])){
      const mp=getProduct(m.productId);
      if(!mp) throw new Error('Товар-модификатор не найден');
      productIngredients(mp,Number(item.qty||0)*Number(m.qty||0),new Set(),totals);
    }
  }
  return {version:1,items:[...totals].filter(([id])=>productTracksStock(getProduct(id))).map(([productId,qty])=>({productId,qty}))};
}
function checkedStockConsumption(items){
  const consumption=stockConsumptionFor(items);
  for(const item of consumption.items){
    const p=getProduct(item.productId);
    const stock=Number(p.stock)||0;
    const tolerance=Number.EPSILON*8*Math.max(Math.abs(stock),item.qty);
    if(!Number.isFinite(stock) || stock+tolerance<item.qty) throw new Error('Недостаточно остатка: '+p.name);
  }
  return consumption;
}
function canFulfillCart(items=state.cart){
  try{ checkedStockConsumption(items); return true; }
  catch(e){ flash(e.message); return false; }
}
function hasUnreturnedStockConsumption(productId){
  return state.orders.some(o=>!o.returnedAt && o.stockConsumption?.items?.some(i=>i.productId===productId));
}
function availableStock(p, resolve=getProduct){
  if(!p) return 0;
  if(p.type==='simple') return p.noStockTracking ? Infinity : (Number(p.stock)||0);
  try{
    const ingredients=productIngredients(p,1,new Set(),new Map(),resolve);
    let min=Infinity;
    for(const [id,qty] of ingredients){
      const ingredient=resolve(id);
      if(!productTracksStock(ingredient)) continue;
      const ratio=(Number(ingredient.stock)||0)/qty;
      if(!Number.isFinite(ratio)) return 0;
      const tolerance=Number.EPSILON*8*Math.max(1,Math.abs(ratio));
      min=Math.min(min,Math.max(0,Math.floor(ratio+tolerance)));
    }
    return min;
  }catch(e){ return 0; }
}
let compositeCostCache=new Map();
function clearCompositeCostCache(){compositeCostCache.clear();}
function compositeCost(p){
  if(!p) return 0;
  if(p.type==='simple') return p.cost || 0;
  if(compositeCostCache.has(p.id))return compositeCostCache.get(p.id);
  try{const value=[...productIngredients(p)].reduce((sum,[id,qty])=>sum+(Number(getProduct(id).cost)||0)*qty,0);compositeCostCache.set(p.id,value);return value;}
  catch(e){return 0;}
}
function compositeCostForQuantity(p,qty,unit){
  if(!p)return 0;
  if(p.type==='simple')return compositeCost(p)*componentBaseQty(p,qty,unit);
  return compositeCost(p)*componentBaseQty(p,qty,unit);
}

function roundStockQty(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return n;
  const rounded=Math.round((n+Number.EPSILON)*1000)/1000;
  return Object.is(rounded,-0)?0:rounded;
}

function shiftTotals(shiftId){
  const orders = shiftOrders(shiftId);
  const activeOrders = orders.filter(o=>!o.returnedAt);
  const cash = activeOrders.reduce((s,o)=>{
    if(Array.isArray(o.payments)) return s + o.payments.filter(p=>p.method==='cash').reduce((a,p)=>a+Number(p.amount||0),0);
    return s + (o.method==='cash'?Number(o.total||0):0);
  },0);
  const card = activeOrders.reduce((s,o)=>{
    if(Array.isArray(o.payments)) return s + o.payments.filter(p=>p.method==='card').reduce((a,p)=>a+Number(p.amount||0),0);
    return s + (o.method==='card'?Number(o.total||0):0);
  },0);
  const shift=state.shifts.find(s=>s.id===shiftId);
  const movements=Array.isArray(shift?.cashMovements)?shift.cashMovements:[];
  const deposits=movements.filter(m=>m.type==='deposit').reduce((s,m)=>s+Number(m.amount||0),0);
  const withdrawals=movements.filter(m=>m.type==='withdrawal').reduce((s,m)=>s+Number(m.amount||0),0);
  const refunds=orders.filter(o=>o.returnedAt).reduce((s,o)=>s+Number(o.returnAmount||o.total||0),0);
  return {cash, card, count: activeOrders.length, total: cash+card, deposits, withdrawals, refunds, netMovements: deposits-withdrawals, movements, orders, activeOrders};
}

function setAnalyticsPreset(days){

function analyticsPresetIsActive(days,from,to){

  return from===start && to===end;
}

function analyticsOrders(){
  const r=analyticsRange();

function analyticsData(){
  const orders=analyticsOrders().filter(o=>!o.returnedAt);
  const revenue=orders.reduce((s,o)=>s+Number(o.total||0),0);
  const cash=orders.reduce((s,o)=>{
    if(Array.isArray(o.payments)) return s+o.payments.filter(p=>p.method==='cash').reduce((a,p)=>a+Number(p.amount||0),0);
    return s+(o.method==='cash'?Number(o.total||0):0);
  },0);
  const card=orders.reduce((s,o)=>{
    if(Array.isArray(o.payments)) return s+o.payments.filter(p=>p.method==='card').reduce((a,p)=>a+Number(p.amount||0),0);
    return s+(o.method==='card'?Number(o.total||0):0);
  },0);
  let cost=0;
  const employeeMap={}, categoryMap={}, productMap={};
  for(const o of orders){
    const sh=state.shifts.find(s=>s.id===o.shiftId);
    const employee=sh?.employeeName||'Без сотрудника';
    employeeMap[employee]=(employeeMap[employee]||0)+Number(o.total||0);
    for(const i of (o.items||[])){
      const qty=Number(i.qty)||0, price=Number(i.price)||0;
      const line=price*qty;
      const itemCost=Number(i.cost)||0;
      cost += itemCost*qty;
      const p=getProduct(i.productId);
      const cat=p?.category||i.category||'Без категории';
      const name=i.name||i.productName||p?.name||'Товар';
      categoryMap[cat]=(categoryMap[cat]||0)+line;
      if(!productMap[name]) productMap[name]={revenue:0,qty:0};
      productMap[name].revenue+=line; productMap[name].qty+=qty;
    }
  }
  return {orders,revenue,cash,card,cost,profit:revenue-cost,avg:orders.length?revenue/orders.length:0,
    employees:Object.entries(employeeMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value),
    categories:Object.entries(categoryMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value),
    products:Object.entries(productMap).map(([name,v])=>({name,...v})).sort((a,b)=>b.revenue-a.revenue)};
}

}

function inventoryCostValue(){

    const stock=Math.max(0,Number(p.stock)||0);
    const cost=Math.max(0,Number(p.cost)||0);

function warehouseRange(from,to){
  const parse=value=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))throw new Error('Укажите даты периода');const [y,m,d]=value.split('-').map(Number),date=new Date(y,m-1,d);if(localDateString(date)!==value)throw new Error('Некорректная дата');return date;};
  const start=parse(from),last=parse(to);if(start>last)throw new Error('Начало периода позже окончания');
  if(last>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))throw new Error('Дата окончания не может быть в будущем');
  const end=new Date(last);end.setDate(end.getDate()+1);return {start:start.getTime(),end:end.getTime()};
}
function warehousePreset(preset){
  const to=new Date(),from=new Date(to);if(preset==='7')from.setDate(from.getDate()-6);else if(preset==='month')from.setDate(1);else if(preset==='quarter'){from.setMonth(Math.floor(from.getMonth()/3)*3,1);}
  window._warehouseFilters={from:localDateString(from),to:localDateString(to)};renderWarehousePage();
}
function warehouseReport(from,to,now=Date.now()){
  const range=warehouseRange(from,to),map=new Map(),documents=[],warnings={legacySales:0,legacyReturns:0,invalid:0,unknownCosts:0};
  function row(id,name,unit){
    if(!map.has(id)){
      const p=getProduct(id),simple=p?.type==='simple',cost=simple&&Number.isFinite(Number(p.cost))?Number(p.cost):null;
      map.set(id,{id,name:p?.name||name||('Удалённый товар · '+id),unit:simple?stockUnit(p):(unit||''),cost,current:simple&&!p.noStockTracking&&Number.isFinite(Number(p.stock))?Number(p.stock):null,minStock:simple?p.minStock:null,supplierNames:[],incoming:0,incomingValue:0,outgoing:0,returned:0,afterStart:0,afterEnd:0});
    }return map.get(id);
  }
  state.products.filter(p=>p.type==='simple').forEach(p=>row(p.id,p.name,stockUnit(p)));
  function event(id,name,unit,qty,time,kind,value=0){
    if(!id||!Number.isFinite(qty)||qty<0||!Number.isFinite(time)||time>now||!Number.isFinite(value)){warnings.invalid++;return;}
    const r=row(id,name,unit);let amount=qty;
    try{if(unit!==undefined&&unit!==r.unit)amount=convertProductQty(qty,unit,r.unit);}catch(e){warnings.invalid++;return;}
    const delta=kind==='outgoing'?-amount:amount;
    if(time>=range.start)r.afterStart+=delta;if(time>=range.end)r.afterEnd+=delta;
    if(time>=range.start&&time<range.end){r[kind]+=amount;if(kind==='incoming')r.incomingValue+=value;return r;}
  }
  for(const receipt of state.receivings){
    if(receipt.adminDeleted)continue;
    const time=Number(receipt.timestamp),items=Array.isArray(receipt.items)?receipt.items:[receipt];
    if(time>=range.start&&time<range.end&&time<=now)documents.push({id:receipt.id,supplier:receipt.supplierName||'Не указан',number:receipt.invoiceNumber||'—',date:receipt.invoiceDate||'—',received:fmtDate(time),timestamp:time,total:Number(receipt.totalCost??items.reduce((s,i)=>s+Number(i.totalCost??Number(i.qty)*Number(i.unitCost)),0)),shortage:!!receipt.shortage});
    for(const item of items){
      const received=event(item.productId,item.productName,item.stockUnit,Number(item.qty),time,'incoming',Number(item.totalCost??Number(item.qty)*Number(item.unitCost)));
      const supplier=receipt.supplierName||'Не указан';
      if(received&&Number(item.qty)>0&&!received.supplierNames.includes(supplier))received.supplierNames.push(supplier);
    }
  }
  let recordedSalesCost=0,missingSalesCosts=0;
  for(const order of state.orders){
    const saleTime=Number(order.timestamp),returnTime=Number(order.returnedAt||0),saleIn=saleTime>=range.start&&saleTime<range.end&&saleTime<=now;
    if(saleIn){for(const item of order.items||[]){if(item.cost==null||!Number.isFinite(Number(item.cost)))missingSalesCosts++;else recordedSalesCost+=Number(item.cost)*Number(item.qty||0);}}
    const snap=order.stockConsumption;
    if(!snap||snap.version!==1||!Array.isArray(snap.items)){
      if(saleTime>=range.start&&saleTime<=now)warnings.legacySales++;
      if(returnTime>=range.start&&returnTime<=now)warnings.legacyReturns++;
      continue;
    }
    if(snap.items.some(i=>!i||!i.productId||!Number.isFinite(Number(i.qty))||Number(i.qty)<0)||new Set(snap.items.map(i=>i.productId)).size!==snap.items.length){warnings.invalid++;continue;}
    for(const item of snap.items){
      event(item.productId,null,undefined,Number(item.qty),saleTime,'outgoing');
      if(returnTime)event(item.productId,null,undefined,Number(item.qty),returnTime,'returned');
    }
  }
  const rows=[...map.values()].map(r=>{
    const start=r.current===null?null:r.current-r.afterStart,end=r.current===null?null:r.current-r.afterEnd;
    if(r.cost===null&&(r.outgoing||r.returned))warnings.unknownCosts++;
    return {...r,start,end,outgoingValue:r.cost===null?null:r.outgoing*r.cost,returnedValue:r.cost===null?null:r.returned*r.cost,currentValue:r.current===null||r.cost===null?null:r.current*r.cost,endValue:end===null||r.cost===null?null:end*r.cost};
  }).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const suppliers=new Map();for(const doc of documents){const entry=suppliers.get(doc.supplier)||{name:doc.supplier,count:0,total:0,shortages:0};entry.count++;entry.total+=Number.isFinite(doc.total)?doc.total:0;if(doc.shortage)entry.shortages++;suppliers.set(doc.supplier,entry);}
  return {from,to,generatedAt:fmtDate(now),rows,documents:documents.sort((a,b)=>b.timestamp-a.timestamp),suppliers:[...suppliers.values()],warnings,recordedSalesCost,missingSalesCosts,
    incomingValue:rows.reduce((s,r)=>s+r.incomingValue,0),outgoingValue:rows.reduce((s,r)=>s+(r.outgoingValue||0),0),returnedValue:rows.reduce((s,r)=>s+(r.returnedValue||0),0),currentValue:rows.reduce((s,r)=>s+(r.currentValue||0),0),endValue:rows.reduce((s,r)=>s+(r.endValue||0),0),
    low:rows.filter(r=>r.current!==null&&r.minStock!=null&&r.current<=r.minStock).length,idle:rows.filter(r=>r.current>0&&r.outgoing===0).length};
}
function warehouseNumber(value){return value===null?'—':Number(value.toFixed(6)).toLocaleString('ru-RU',{maximumFractionDigits:6});}
function warehouseQuantityTotals(report,key){
  const sums=new Map();for(const r of report.rows){if(r[key]==null||!r[key])continue;const base=r.unit==='g'?'kg':r.unit==='ml'?'l':r.unit;const q=convertProductQty(r[key],r.unit,base);sums.set(base,(sums.get(base)||0)+q);}

function bookingDateTime(date,time){
  return `${date}T${time||'00:00'}:00`;
}
function bookingOverlap(startA,endA,startB,endB){
  return startA < endB && endA > startB;
}
function bookingWindow(dateOverride=null,timeOverride=null,durationOverride=null){
  const date=dateOverride || state.bookingDate || localDateString(new Date());
  const time=timeOverride || state.bookingTime || '19:00';
  const duration=Number(durationOverride || state.bookingDuration || 120);
  const start=new Date(bookingDateTime(date,time));
  const end=new Date(start.getTime() + duration*60000);
  return {date,time,duration,start,end};
}
function tableBookings(tableId, date){
  return state.bookings.filter(b=>b.tableId===tableId && b.date===date && b.status!=='cancelled')
    .sort((a,b)=>String(a.startAt).localeCompare(String(b.startAt)));
}
function tableBusyAt(tableId,start,end){
  return state.bookings.some(b=>b.tableId===tableId && b.status!=='cancelled' && bookingOverlap(start,end,new Date(b.startAt),new Date(b.endAt)));
}

function hallPointerStart(e,el){
  if(!state.hallEditMode) return;
  e.preventDefault(); e.stopPropagation(); const t=state.hallTables.find(x=>x.id===el.dataset.id); if(!t)return;
  const map=document.getElementById('bookingsMap'); if(!map)return;
  state._hallDrag={id:t.id,startX:e.clientX,startY:e.clientY,origX:t.x,origY:t.y,mapW:map.clientWidth,mapH:map.clientHeight,moved:false};
  el.setPointerCapture?.(e.pointerId);
}
function hallPointerMove(e,el){
  if(!state.hallEditMode) return;
  const d=state._hallDrag; if(!d)return; e.preventDefault(); e.stopPropagation();
  const dxPx=e.clientX-d.startX, dyPx=e.clientY-d.startY;
  if(Math.abs(dxPx)+Math.abs(dyPx)>5)d.moved=true;
  const t=state.hallTables.find(x=>x.id===d.id); if(!t)return;
  const dx=dxPx/d.mapW*100, dy=dyPx/d.mapH*100;
  t.x=Math.max(0,Math.min(94,d.origX+dx)); t.y=Math.max(0,Math.min(88,d.origY+dy));
  el.style.left=t.x+'%'; el.style.top=t.y+'%';
}
function hallPointerEnd(e){
  const d=state._hallDrag; if(!d)return;
  if(!state.hallEditMode){state._hallDrag=null;return;}
  const id=d.id;
  const moved=d.moved;
  state._hallDrag=null;
  if(moved){
    saveHall();
    state._hallSuppressClick=true;
    render();
    return;
  }
  state._hallSuppressClick=true;
  openHallTableEditModal(id);
}

let webAcceptBusy=false;
function webOrderCartItems(o){
  if(!Array.isArray(o.order_items)||!o.order_items.length)throw new Error('В заказе нет товаров');
  return o.order_items.map(i=>{
    // IDs are authoritative. Name fallback is only for legacy rows without an ID.
    const matches=i.external_product_id?[getProduct(i.external_product_id)].filter(Boolean):state.products.filter(p=>p.name===i.product_name);
    if(matches.length!==1)throw new Error('Товар не найден или неоднозначен: '+i.product_name);
    const p=matches[0],qty=Number(i.quantity),price=Number(i.price??p.price);
    if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)throw new Error('Некорректная позиция: '+p.name);
    return {productId:p.id,name:p.name,price,qty,comment:i.comment||''};
  });
}
async function recoverWebAcceptanceJournal(){
  const journal=await loadKey('webOrderAcceptances',{});
  const pending=Object.values(journal||{}).filter(x=>x?.stage==='prepared'&&state.parked.some(p=>p.webOrderId===x.parked?.webOrderId));
  if(!pending.length)return;
  pending.forEach(x=>{x.stage='local';});
  try{await window.PrilavokCore.Storage.set('webOrderAcceptances',journal);}
  catch(e){
    // Keep an unpublished intent recoverable; do not expose it twice after a restart.
    const ids=new Set(pending.map(x=>x.parked.webOrderId));
    state.parked=state.parked.filter(p=>!ids.has(p.webOrderId));markStorageBroken(e);
  }
}
async function acceptWebOrder(id){
  if(webAcceptBusy)return;
  const o=state.webEvents.find(x=>x.id===id);if(!o)return;
  webAcceptBusy=true;
  try{
    const n=networkConfigFromState();
    if(!n.backendUrl||!n.deviceKey)throw new Error('Проверьте сетевые настройки');
    let readError=false;
    const journal=await window.PrilavokCore.Storage.get('webOrderAcceptances',{},()=>{readError=true;});
    if(readError||!journal||typeof journal!=='object'||Array.isArray(journal))throw new Error('Не удалось прочитать журнал приёма');
    if(!journal[id]){
      const cartItems=webOrderCartItems(o);checkedStockConsumption(cartItems);
      const existing=state.parked.find(p=>p.webOrderId===id);
      const rawType=String(o.order_type||'').trim().toLocaleLowerCase('ru');
      const orderType=(rawType==='delivery'||rawType==='доставка')?'Доставка':((rawType==='pickup'||rawType==='самовывоз'||rawType==='с собой')?'С собой':(o.order_type||'На месте'));
      journal[id]={stage:existing?'local':'prepared',parked:existing||{id:uid(),items:cartItems,total:Number(o.total||0),subtotal:Number(o.total||0)-Number(o.delivery_fee||0),deliveryFee:Number(o.delivery_fee||0),orderLabel:'Веб '+(o.external_id||''),orderType,customer:{name:o.customer_name||'',phone:o.phone||'',address:o.address||''},comment:o.comment||'',source:'web',webOrderId:o.id,webOrderStatus:'accepted',createdAt:Date.now(),kitchenPrinted:true}};
      await window.PrilavokCore.Storage.set('webOrderAcceptances',journal);
    }
    const record=journal[id];
    if(record.stage==='prepared'){
      checkedStockConsumption(record.parked.items);
      const parked=state.parked.some(p=>p.webOrderId===id)?state.parked.slice():[...state.parked,record.parked];
      await window.PrilavokCore.Storage.set('parked',parked);
      record.stage='local';await window.PrilavokCore.Storage.set('webOrderAcceptances',journal);
      state.parked=parked;
    }
    if(record.stage!=='confirmed'){
      const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);
      try{
        const r=await fetch(n.backendUrl.replace(/\/+$/,'')+'/api/orders/'+encodeURIComponent(id)+'/accept',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},body:'{}',cache:'no-store',signal:controller.signal});
        const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||('HTTP '+r.status));
      }finally{clearTimeout(timeout);}
      record.stage='confirmed';await window.PrilavokCore.Storage.set('webOrderAcceptances',journal);
    }
    const events=state.webEvents.filter(x=>x.id!==id);
    await window.PrilavokCore.Storage.set('webEvents',events);state.webEvents=events;
    closeModal();render();flash('Заказ взят в работу и добавлен в Отложенные');
  }catch(e){render();flash('Не удалось подтвердить заказ: '+(e?.message||'Ошибка сети')+'. Если заказ уже в Отложенных, повторное нажатие не создаст копию.');}
  finally{webAcceptBusy=false;}
}

// Authorized exception: availability only, every ten minutes in a visible POS.
const AVAILABILITY_INTERVAL=10*60*1000;
let availabilityTimer=null,availabilityBusy=false,availabilityController=null,availabilityListening=false;
function buildAvailabilityItems(products){
  const byId=new Map(products.map(p=>[p.id,p]));
  return products.map(p=>{
    const qty=availableStock(p,id=>byId.get(id));
    return {externalId:String(p.id),quantity:qty===Infinity?null:(Number.isFinite(qty)?Math.max(0,qty):0)};
  }).sort((a,b)=>a.externalId.localeCompare(b.externalId));
}
async function publishAvailability(){
  if(availabilityBusy||document.hidden||window._availabilityAppActive===false||!state.loaded||storageBroken)return false;
  availabilityBusy=true;
  let timeout;
  try{
    let failed=false;const onError=()=>{failed=true;};const storage=window.PrilavokCore.Storage;
    // Derive from completed storage writes, never from an unsaved editor or state.
    const [products,network,previous]=await Promise.all([storage.get('products',null,onError),storage.get('network',null,onError),storage.get('webAvailabilityRevision',0,onError)]);
    if(failed||!Array.isArray(products)||!network?.backendUrl||!network.deviceKey)return false;
    if(!Number.isSafeInteger(previous)||previous<0)return false;
    const items=buildAvailabilityItems(products);
    const revision=Math.max(Date.now(),previous+1);
    if(!Number.isSafeInteger(revision))return false;
    await storage.set('webAvailabilityRevision',revision);
    if(document.hidden||window._availabilityAppActive===false)return false;
    availabilityController=new AbortController();timeout=setTimeout(()=>availabilityController?.abort(),30000);
    const r=await fetch(network.backendUrl.replace(/\/+$/,'')+'/api/availability/snapshot',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':network.deviceKey},body:JSON.stringify({version:1,revision,sampledAt:new Date().toISOString(),items}),cache:'no-store',signal:availabilityController.signal});
    return r.ok;
  }catch(e){return false;}
  finally{clearTimeout(timeout);availabilityController=null;availabilityBusy=false;}
}
function onAvailabilityAppState(active){
  window._availabilityAppActive=active;
  if(!active){clearTimeout(availabilityTimer);availabilityTimer=null;availabilityController?.abort();}
  else if(state.loaded)startAvailabilitySchedule();
}
function startAvailabilitySchedule(){
  clearTimeout(availabilityTimer);availabilityTimer=null;
  if(!availabilityListening){
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearTimeout(availabilityTimer);availabilityTimer=null;availabilityController?.abort();}
      else startAvailabilitySchedule();
    });availabilityListening=true;
  }
  if(document.hidden||window._availabilityAppActive===false)return;
  availabilityTimer=setTimeout(async()=>{await publishAvailability();startAvailabilitySchedule();},AVAILABILITY_INTERVAL);
}

function buildMenuSyncPayload(){

  (state.products||[]).forEach(p=>addCat(p.category||'Без категории'));
  const categories=categoryNames.map((name,index)=>({
    externalId:'category:'+name,
    name,
    color:(state.categoryColors||{})[name]||'',
    sortOrder:index,
    isActive:(state.categoryOnline||{})[name]!==false
  }));
  const products=(state.products||[]).map((p,index)=>({
    externalId:String(p.id),
    name:String(p.name||''),
    description:String(p.description||''),
    price:Number(p.price||0),
    category:String(p.category||'Без категории'),

function toggleTelegramToken(){
  const input=document.getElementById('telegram-token');
  const btn=event?.currentTarget;
  if(!input) return;
  const show=input.type==='password'; input.type=show?'text':'password'; if(btn) btn.textContent=show?'Скрыть':'Показать';
}
function saveTelegramSettings(){
  if(!currentShiftEmployeeIsAdmin()){ flash('Сетевые конфигурации доступны только администратору'); return; }
  state.telegram={
    enabled:!!document.getElementById('telegram-enabled')?.checked,
    botToken:(document.getElementById('telegram-token')?.value||'').trim(),
    chatId:(document.getElementById('telegram-chat-id')?.value||'').trim(),
    threadId:(document.getElementById('telegram-thread-id')?.value||'').trim(),
    notifyShiftOpened:!!document.getElementById('telegram-shift-opened')?.checked,
    notifyShiftClosed:!!document.getElementById('telegram-shift-closed')?.checked,
    notifyMonthlyWarehouse:!!document.getElementById('telegram-monthly-warehouse')?.checked,
    lastMonthlyWarehouseSent:state.telegram?.lastMonthlyWarehouseSent||''
  };
  saveKey('telegram',state.telegram); render(); flash('Настройки Telegram сохранены');
}
function telegramConfigFromState(){
  const t=state.telegram||{};
  return {enabled:!!t.enabled,botToken:String(t.botToken||''),chatId:String(t.chatId||''),threadId:String(t.threadId||''),notifyShiftOpened:t.notifyShiftOpened!==false,notifyShiftClosed:t.notifyShiftClosed!==false,notifyMonthlyWarehouse:t.notifyMonthlyWarehouse===true,lastMonthlyWarehouseSent:String(t.lastMonthlyWarehouseSent||'')};
}
function telegramNativeRequest(action, extra={}){
  const cfg=telegramConfigFromState();
  if(!cfg.enabled || !cfg.botToken || !cfg.chatId) return false;
  if(window.webkit?.messageHandlers?.telegram){
    window.webkit.messageHandlers.telegram.postMessage({...cfg,action,...extra});
    return true;
  }
  return false;
}
function testTelegramConnection(){
  if(!currentShiftEmployeeIsAdmin()){flash('Сетевые конфигурации доступны только администратору');return;}
  const token=(document.getElementById('telegram-token')?.value||'').trim();
  const chatId=(document.getElementById('telegram-chat-id')?.value||'').trim();
  const threadId=(document.getElementById('telegram-thread-id')?.value||'').trim();
  if(!token){flash('Введите токен бота');return;}
  if(!chatId){flash('Введите ID рабочей группы');return;}
  const status=document.getElementById('telegram-status'); if(status) status.textContent='Проверяем подключение…';
  if(window.webkit?.messageHandlers?.telegram){
    window.webkit.messageHandlers.telegram.postMessage({action:'test',botToken:token,chatId,threadId});
  } else {
    if(status) status.textContent='Проверка доступна в установленном приложении на iPad.';
  }
}
window.onTelegramResult=function(result){
  if(result?.ok){ flash(result.message||'Telegram подключён'); if(state.tab==='network'){ const el=document.getElementById('telegram-status'); if(el) el.textContent=result.message||'Telegram подключён.'; } }
  else { flash(result?.message||'Не удалось подключиться к Telegram'); const el=document.getElementById('telegram-status'); if(el) el.textContent=result?.message||'Не удалось подключиться к Telegram.'; }
};
function sendTelegramShiftOpened(shift){
  const t=telegramConfigFromState();
  if(!t.enabled || !t.notifyShiftOpened || !t.botToken || !t.chatId) return;
  const date=new Date(shift.openedAt||Date.now()).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const text=`🟢 <b>Смена открыта</b>\n👤 Сотрудник: ${escapeHtml(shift.employeeName||'Сотрудник')}\n🕐 Время: ${date}`;
  if(window.webkit?.messageHandlers?.telegram){
    window.webkit.messageHandlers.telegram.postMessage({...t,action:'send',text});
  }
}
function buildShiftReportPayload(shift){
  const orders=shiftOrders(shift.id).slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const t=shiftTotals(shift.id);
  const expected=(Number(shift.openingCash)||0)+t.cash+t.netMovements;
  const counted=Number(shift.countedCash)||0;
  return {
    id:shift.id, employeeName:shift.employeeName||'', employeePhone:shift.employeePhone||'',
    openedAt:shift.openedAt||0, closedAt:shift.closedAt||0,
    openingCash:Number(shift.openingCash)||0, countedCash:counted, expectedCash:expected, difference:counted-expected,
    cash:Number(t.cash)||0, card:Number(t.card)||0, total:Number(t.total)||0, count:Number(t.count)||0,
    deposits:Number(t.deposits)||0, withdrawals:Number(t.withdrawals)||0, netMovements:Number(t.netMovements)||0,
    currency:state.currency,
    establishmentName:state.company?.establishmentName || '',
    cashMovements:t.movements.map(m=>({type:m.type||'',subtype:m.subtype||'',amount:Number(m.amount)||0,timestamp:m.timestamp||0,note:m.note||''})),
    orders:orders.map(o=>({timestamp:o.timestamp||0,total:Number(o.total)||0,method:o.method||'',orderLabel:o.orderLabel||'',orderType:o.orderType||'',items:(o.items||[]).map(i=>({name:i.name||i.productName||'Товар',qty:Number(i.qty)||0,price:Number(i.price)||0}))}))
  };
}
function sendTelegramShiftClosed(shift){
  const t=telegramConfigFromState();
  if(!t.enabled || !t.notifyShiftClosed || !t.botToken || !t.chatId) return;
  if(window.webkit?.messageHandlers?.telegram){
    window.webkit.messageHandlers.telegram.postMessage({...t,action:'sendShiftCloseReport',report:buildShiftReportPayload(shift)});
  }
}

function previousCalendarMonthRange(now=new Date()){
  const firstCurrent=new Date(now.getFullYear(),now.getMonth(),1);
  const lastPrevious=new Date(firstCurrent); lastPrevious.setDate(0);
  const firstPrevious=new Date(lastPrevious.getFullYear(),lastPrevious.getMonth(),1);
  const key=firstPrevious.getFullYear()+'-'+String(firstPrevious.getMonth()+1).padStart(2,'0');
  return {key,from:localDateString(firstPrevious),to:localDateString(lastPrevious)};
}
function maybeSendMonthlyWarehouseReport(){
  const t=telegramConfigFromState();
  if(!t.enabled || !t.notifyMonthlyWarehouse || !t.botToken || !t.chatId) return;
  if(!currentShiftEmployeeIsAdmin()) return;
  if(!window.webkit?.messageHandlers?.telegram) return;
  try{
    const period=previousCalendarMonthRange();
    if(t.lastMonthlyWarehouseSent===period.key) return;
    const payload=warehouseExportPayload(warehouseReport(period.from,period.to));
    window.webkit.messageHandlers.telegram.postMessage({...t,action:'sendMonthlyWarehouseReport',periodKey:period.key,report:payload});
  }catch(e){ console.error('Не удалось подготовить ежемесячный складской отчёт:',e); }
}
window.onTelegramMonthlyWarehouseResult=function(result){
  if(result?.ok && result.periodKey){
    state.telegram.lastMonthlyWarehouseSent=String(result.periodKey);
    saveKey('telegram',state.telegram);
    flash(result.message||'Ежемесячный складской отчёт отправлен в Telegram');
  }else if(result?.message){
    flash(result.message);
  }
};

function saveDiscount(){
  const name=(document.getElementById('df-name')?.value||'').trim();
  const type=document.getElementById('df-type')?.value==='fixed'?'fixed':'percent';
  const value=parseFloat(document.getElementById('df-value')?.value);
  if(!name){flash('Введите название скидки');return;}

function productCategoryKey(p){ return (p.category||'').trim() || 'Без категории'; }

/* Local navigation folders: one level inside each product category, no inventory effects. */
function normalizePosNavigation(value){
  if(value?.version!==1||!Array.isArray(value.categories))return {version:1,categories:[]};
  const categories=[],seenCategories=new Set();
  for(const entry of value.categories){
    if(!entry||typeof entry.category!=='string'||!Array.isArray(entry.items)||seenCategories.has(entry.category))continue;
    seenCategories.add(entry.category);const ids=new Set(),items=[];
    for(const item of entry.items){
      if(!item||!['product','folder'].includes(item.type)||typeof item.id!=='string'||!item.id||ids.has(item.type+':'+item.id))continue;
      if(item.type==='folder'&&(typeof item.name!=='string'||!item.name.trim()))continue;
      ids.add(item.type+':'+item.id);items.push({type:item.type,id:item.id,...(item.type==='folder'?{name:item.name.trim().slice(0,80),parentId:''}:{parentId:typeof item.parentId==='string'?item.parentId:''})});
    }
    const folders=new Set(items.filter(i=>i.type==='folder').map(i=>i.id));for(const i of items)if(i.parentId&&!folders.has(i.parentId))i.parentId='';
    categories.push({category:entry.category,items});
  }
  return {version:1,categories};
}
function posCategoryItems(category,nav=state.posNavigation){
  const saved=normalizePosNavigation(nav).categories.find(e=>e.category===category)?.items||[];
  const products=state.products.filter(p=>productCategoryKey(p)===category).slice().sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  const ids=new Set(products.map(p=>p.id)),items=saved.filter(i=>i.type==='folder'||ids.has(i.id));
  const placed=new Set(items.filter(i=>i.type==='product').map(i=>i.id));
  return [...items,...products.filter(p=>!placed.has(p.id)).map(p=>({type:'product',id:p.id,parentId:''}))];
}
function posVisibleCategoryItems(category=state.posPath){
  return posCategoryItems(category).filter(i=>i.parentId===(window._posFolderModal?.id||state.posFolder||''));
}
async function updatePosNavigation(category,change){
  if(window._posNavigationBusy)return false;
  window._posNavigationBusy=true;
  try{
    const next=normalizePosNavigation(state.posNavigation),items=posCategoryItems(category,next);
    change(items);
    const entry=next.categories.find(e=>e.category===category);
    if(entry)entry.items=items;else next.categories.push({category,items});
    await window.PrilavokCore.Storage.set('posNavigation',next);
    const folderContext=window._posFolderModal;
    state.posNavigation=next;closeModal();render();
    if(folderContext&&posCategoryItems(folderContext.category).some(i=>i.type==='folder'&&i.id===folderContext.id)){window._posFolderModal=folderContext;renderPosFolderModal();}
    return true;
  }catch(e){flash('Не удалось сохранить раскладку: '+(e.message||'ошибка'));return false;}
  finally{window._posNavigationBusy=false;}
}
function openPosFolder(id){

function reorderPosCategoryTile(type,id,targetIndex){

    const [item]=visible.splice(from,1);visible.splice(Math.max(0,Math.min(visible.length,targetIndex)),0,item);
    let index=0;for(let i=0;i<items.length;i++)if(items[i].parentId===parent)items[i]=visible[index++];
  });

function ensureLayoutPositions(){
  let changed=false;
  if(state.layoutTiles.length>20){ state.layoutTiles=state.layoutTiles.slice(0,20); changed=true; }
  const cols = 5;
  const occupied=new Set();
  state.layoutTiles.forEach((t,i)=>{
    if(!t || typeof t!=='object') return;
    if(Number.isInteger(t.col) && Number.isInteger(t.row) && t.col>=0 && t.col<cols && t.row>=0){
      const key=t.col+':'+t.row;
      if(!occupied.has(key)){ occupied.add(key); return; }
    }
    let n=0;
    while(occupied.has((n%cols)+':'+Math.floor(n/cols))) n++;
    t.col=n%cols; t.row=Math.floor(n/cols); occupied.add(t.col+':'+t.row); changed=true;
  });
  if(changed) saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});
  return changed;
}
function tilePositionStyle(t){
  if(!Number.isInteger(t.col) || !Number.isInteger(t.row)) return '';
  return `grid-column:${t.col+1};grid-row:${t.row+1};`;
}

function handlePosGridClick(e){
  if(Date.now()<(window._posSuppressClickUntil||0))return;
  const tile=e.target.closest('.layout-tile');
  if(!tile) return;
  if(e.target.closest('.tile-remove')) return;
  const type=tile.dataset.tileType;
  const id=tile.dataset.id;
  if(state.editMode){if(state.posPath){if(type==='folder')openPosFolder(id);else if(type==='product')openPosTileMove(id);}return;}
  if(type==='folder'){openPosFolder(id);return;}
  // На главной рабочей зоне категория открывает вложенный экран,
  // товар сразу добавляется в текущий заказ.
  if(!state.posPath){
    if(type==='category') openPosCategory(id);
    else if(type==='product') addToCart(id);
    return;
  }
  // Внутри категории отображаются обычные товарные плитки.
  // Они должны добавляться в текущий заказ так же, как товары на главном экране.
  if(type==='product') addToCart(id);
}

let layoutDragState=null;
function setupLayoutGridDrag(grid=document.getElementById('sections-wrap')){
  if(!grid || !state.editMode) return;
  if(grid.dataset.dragReady==='1') return;
  grid.dataset.dragReady='1';
  grid.addEventListener('pointerdown',onLayoutPointerDown);
  grid.addEventListener('pointermove',onLayoutPointerMove);
  grid.addEventListener('pointerup',onLayoutPointerUp);
  grid.addEventListener('pointercancel',onLayoutPointerUp);
}
function gridMetrics(grid){
  const cs=getComputedStyle(grid), cols=cs.gridTemplateColumns.split(' ').length;
  const rect=grid.getBoundingClientRect();
  const gap=parseFloat(cs.columnGap)||0;
  const cellW=(rect.width-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)-gap*(cols-1))/cols;
  const rows=cs.gridTemplateRows.split(' ').filter(Boolean);
  const rowH=rows.length ? parseFloat(rows[0]) : 160;
  const rowGap=parseFloat(cs.rowGap)||12;
  return {cols,cellW,rowH,rowGap,padLeft:parseFloat(cs.paddingLeft)||0,padTop:parseFloat(cs.paddingTop)||0};
}
function pointerToCell(grid,x,y){
  const m=gridMetrics(grid), r=grid.getBoundingClientRect();
  const localX=x-r.left-m.padLeft+grid.scrollLeft;
  const localY=y-r.top-m.padTop+grid.scrollTop;
  return {col:Math.max(0,Math.min(m.cols-1,Math.floor(localX/(m.cellW+(parseFloat(getComputedStyle(grid).columnGap)||0))))),row:Math.max(0,Math.floor(localY/(m.rowH+m.rowGap)))};
}
function ensureGridCell(grid,col,row,exceptIndex){
  return !state.layoutTiles.some((t,i)=>i!==exceptIndex && t.col===col && t.row===row);
}
function nearestFreeCell(grid,col,row,exceptIndex){
  const m=gridMetrics(grid);
  for(let d=0;d<30;d++){
    for(let rr=Math.max(0,row-d);rr<=row+d;rr++) for(let cc=Math.max(0,col-d);cc<=Math.min(m.cols-1,col+d);cc++){
      if(Math.abs(cc-col)+Math.abs(rr-row)!==d) continue;
      if(ensureGridCell(grid,cc,rr,exceptIndex)) return {col:cc,row:rr};
    }
  }
  return {col:Math.min(m.cols-1,col),row:row+1};
}
function onLayoutPointerDown(e){
  if(!state.editMode) return;
  if(e.target.closest('button')) return;
  const tile=e.target.closest('.layout-tile');
  const grid=tile?.closest('.pos-folder-grid')||document.getElementById('sections-wrap');
  if(!tile || !grid) return;
  const index=Number(tile.dataset.index);
  const rect=tile.getBoundingClientRect();
  layoutDragState={category:state.posPath,folder:window._posFolderModal?.id||state.posFolder||'',tile,index,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,pointerId:e.pointerId,dragging:false,rect,grid};
  try{tile.setPointerCapture(e.pointerId);}catch(_){ }
}
function onLayoutPointerMove(e){
  const d=layoutDragState;
  if(!d || d.pointerId!==e.pointerId) return;
  d.lastX=e.clientX; d.lastY=e.clientY;
  const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
  if(!d.dragging && Math.hypot(dx,dy)<6) return;
  if(!d.dragging){
    d.dragging=true;
    d.tile.classList.add('drag-placeholder');
    const clone=d.tile.cloneNode(true);
    clone.classList.add('layout-drag-clone');
    clone.style.setProperty('--drag-w',d.rect.width+'px');
    clone.style.setProperty('--drag-h',d.rect.height+'px');
    clone.style.left=(e.clientX-d.rect.width/2)+'px'; clone.style.top=(e.clientY-d.rect.height/2)+'px';
    document.body.appendChild(clone); d.clone=clone;
  }
  e.preventDefault();
  if(d.clone){d.clone.style.left=(e.clientX-d.rect.width/2)+'px';d.clone.style.top=(e.clientY-d.rect.height/2)+'px';}
  const cell=pointerToCell(d.grid,e.clientX,e.clientY);
  d.target=cell;
  d.grid.querySelectorAll('.layout-cell-highlight').forEach(x=>x.remove());
  const m=gridMetrics(d.grid), gap=parseFloat(getComputedStyle(d.grid).columnGap)||0, rowGap=parseFloat(getComputedStyle(d.grid).rowGap)||0;
  const h=document.createElement('div'); h.className='layout-cell-highlight';
  h.style.left=(m.padLeft+cell.col*(m.cellW+gap))+'px'; h.style.top=(m.padTop+cell.row*(m.rowH+rowGap))+'px';
  h.style.width=m.cellW+'px'; h.style.height=m.rowH+'px'; d.grid.appendChild(h);
}
function onLayoutPointerUp(e){
  const d=layoutDragState;
  if(!d || d.pointerId!==e.pointerId) return;
  if(d.dragging){
    e.preventDefault();
    const target=d.target || pointerToCell(d.grid,e.clientX,e.clientY);
    window._posSuppressClickUntil=Date.now()+350;
    if(e.type!=='pointercancel'){
      if(d.category){
        if(state.posPath===d.category&&(window._posFolderModal?.id||state.posFolder||'')===d.folder)reorderPosCategoryTile(d.tile.dataset.tileType,d.tile.dataset.id,target.row*gridMetrics(d.grid).cols+target.col);
      }else{
        const cell=nearestFreeCell(d.grid,target.col,target.row,d.index),old=state.layoutTiles[d.index];
        if(old){old.col=cell.col;old.row=cell.row;}
        saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles});
      }
    }
    if(d.clone)d.clone.remove();
    d.grid.querySelectorAll('.layout-cell-highlight').forEach(x=>x.remove());
    render();
    setTimeout(setupLayoutGridDrag,50);
  }
  try{d.tile.releasePointerCapture(e.pointerId);}catch(_){ }
  layoutDragState=null;
}

function discountValue(item){
  if(!item || !item.discountId) return 0;
  const d=state.discounts.find(x=>x.id===item.discountId);
  if(!d) return 0;
  const base=item.price*item.qty;
  return d.type==='percent' ? base*Math.max(0,Math.min(100,Number(d.value)||0))/100 : Math.min(base,Math.max(0,Number(d.value)||0)*item.qty);
}
function itemTotal(item){ return Math.max(0,item.price*item.qty-discountValue(item)); }
function cartSubtotal(){ return state.cart.reduce((sum,i)=>sum+itemTotal(i),0); }

function addToCart(id){
  const p = getProduct(id);
  if(!p) return;
  const existing = state.cart.find(i=>i.productId===id);
  const proposed=state.cart.map(i=>({...i,qty:i.qty+(i.productId===id?1:0)}));
  if(!existing) proposed.push({productId:id,qty:1});
  if(!canFulfillCart(proposed)) return;
  if(existing){ existing.qty += 1; }
  else{ state.cart.push({productId:id, name:p.name, price:p.price, qty:1}); }
  saveCurrentOrderSession();
  render();
}
function changeQty(id, delta){
  const item = state.cart.find(i=>i.productId===id);
  if(!item) return;
  const newQty = item.qty + delta;
  if(newQty <= 0){ state.cart = state.cart.filter(i=>i.productId!==id); saveCurrentOrderSession(); render(); return; }
  if(!canFulfillCart(state.cart.map(i=>({...i,qty:i.productId===id?newQty:i.qty})))) return;
  item.qty = newQty;
  saveCurrentOrderSession();
  render();
}
let cartSwipeState = null;
function handleCartRowClick(e,id){
  if(e.target.closest('button,.qty-stepper')) return;
  if(cartSwipeState && cartSwipeState.suppressClick){
    e.preventDefault();
    cartSwipeState=null;
    return;
  }
  openCartItemModal(id);
}
function cartRowTouchStart(e,row){
  if(!e.touches || !e.touches[0]) return;
  const t=e.touches[0];
  cartSwipeState={row,startX:t.clientX,startY:t.clientY,currentX:t.clientX,dragging:false,suppressClick:false};
  row.classList.add('swiping');
}
function cartRowTouchMove(e,row){
  if(!cartSwipeState || cartSwipeState.row!==row || !e.touches || !e.touches[0]) return;
  const t=e.touches[0];
  const dx=t.clientX-cartSwipeState.startX;
  const dy=t.clientY-cartSwipeState.startY;
  cartSwipeState.currentX=t.clientX;
  if(!cartSwipeState.dragging){
    if(Math.abs(dy)>Math.abs(dx) || Math.abs(dx)<8) return;
    if(dx>=0) return;
    cartSwipeState.dragging=true;
  }
  if(cartSwipeState.dragging){
    e.preventDefault();
    const reveal=Math.max(-150,Math.min(0,dx));
    row.querySelector('.cart-row-content').style.transform=`translateX(${reveal}px)`;
    row.classList.toggle('swipe-ready', reveal <= -82);
  }
}
function cartRowTouchEnd(e,row){
  if(!cartSwipeState || cartSwipeState.row!==row) return;
  const dx=cartSwipeState.currentX-cartSwipeState.startX;
  const swiped=cartSwipeState.dragging && dx < -82;
  row.classList.remove('swiping');
  if(swiped){
    e.preventDefault();
    cartSwipeState.suppressClick=true;
    row.classList.add('swipe-delete');
    row.querySelector('.cart-row-content').style.transform='';
    const id=row.dataset.cartId;
    setTimeout(()=>removeFromCart(id),230);
    return;
  }
  row.classList.remove('swipe-ready');
  row.querySelector('.cart-row-content').style.transform='';
  cartSwipeState=null;
}
function cartRowTouchCancel(e,row){
  if(!cartSwipeState || cartSwipeState.row!==row) return;
  row.classList.remove('swiping','swipe-ready');
  row.querySelector('.cart-row-content').style.transform='';
  cartSwipeState=null;
}

function openSplitPayment(){

function buildSplitPayments(count,total){
  count=Math.max(2,Math.min(10,count));
  const cents=Math.round(total*100), base=Math.floor(cents/count), rem=cents-base*count;
  return Array.from({length:count},(_,i)=>({method:'cash',amount:(base+(i<rem?1:0))/100,paid:false,cashGiven:null,change:null}));
}
function splitPaidTotal(){

function splitUnpaidTotal(){

function distributeCentsEvenly(items,totalCents){
  if(!items.length)return;
  const base=Math.floor(totalCents/items.length), rem=totalCents-base*items.length;
  items.forEach((p,i)=>p.amount=(base+(i<rem?1:0))/100);
}
function normalizeSplitPayments(total){
  const ps=state._splitPayments||[];
  if(!ps.length)return;
  const paid=ps.filter(p=>p.paid), unpaid=ps.filter(p=>!p.paid);
  const paidCents=Math.round(paid.reduce((s,p)=>s+Number(p.amount||0),0)*100);
  const remainingCents=Math.max(0,Math.round(total*100)-paidCents);
  distributeCentsEvenly(unpaid,remainingCents);
  state._splitCount=ps.length;
}
function adjustSplitCount(delta){
  const total=cartTotal();
  let ps=Array.isArray(state._splitPayments)?state._splitPayments:buildSplitPayments(2,total);
  const next=Math.max(2,Math.min(10,ps.length+delta));
  if(next===ps.length){return;}
  const paid=ps.filter(p=>p.paid);
  const unpaid=ps.filter(p=>!p.paid);
  if(next<paid.length){
    flash('Нельзя уменьшить количество платежей: уже есть оплаченные части');
    return;
  }
  if(next>ps.length){
    const add=next-ps.length;
    for(let i=0;i<add;i++) unpaid.push({method:'cash',amount:0,paid:false,cashGiven:null,change:null});
  }else{
    const keepUnpaidCount=next-paid.length;
    while(unpaid.length>keepUnpaidCount) unpaid.pop();
  }
  const paidCents=Math.round(paid.reduce((s,p)=>s+Number(p.amount||0),0)*100);
  const remainingCents=Math.max(0,Math.round(total*100)-paidCents);
  distributeCentsEvenly(unpaid,remainingCents);
  state._splitPayments=[...paid,...unpaid];
  state._splitCount=next;
  renderSplitPayment();
}
function splitPaymentRemaining(){return Math.max(0,cartTotal()-splitPaidTotal());}
function parsePaymentNumber(value){
  const normalized=String(value ?? '').trim().replace(/\s/g,'').replace(',', '.');
  if(normalized==='' || normalized==='.' || normalized==='-') return null;
  if(!/^\d+(?:\.\d{0,2})?$/.test(normalized)) return null;
  const n=Number(normalized);
  return Number.isFinite(n) ? n : null;
}
function updateSplitAmountLive(index,value){
  const ps=state._splitPayments||[];
  const p=ps[index];
  if(!p||p.paid)return;

  // Do not write an empty/intermediate iPad input into state. While the
  // employee replaces the old value, the text field is allowed to be empty.
  const parsed=parsePaymentNumber(value);
  if(parsed===null)return;

  const totalCents=Math.max(0,Math.round(cartTotal()*100));
  const paidCents=ps.filter(x=>x.paid).reduce((sum,x)=>sum+Math.round(Number(x.amount||0)*100),0);
  const previousUnpaid=ps.filter((x,i)=>i<index&&!x.paid);
  const previousCents=previousUnpaid.reduce((sum,x)=>sum+Math.round(Number(x.amount||0)*100),0);
  const maxRequested=Math.max(0,totalCents-paidCents-previousCents);
  const requested=Math.min(Math.round(parsed*100),maxRequested);

  p.amount=requested/100;
  p.cashGiven=null;
  p.change=null;

  // Keep already entered/paid parts fixed. The edited payment becomes the
  // anchor and all later unpaid payments absorb the remaining amount.
  const following=ps.filter((x,i)=>i>index&&!x.paid);
  const remaining=Math.max(0,totalCents-paidCents-previousCents-requested);
  if(following.length){
    distributeCentsEvenly(following,remaining);
  }else{
    // Editing the last unpaid payment: keep earlier unpaid parts and make
    // the edited payment the exact remainder. If the requested amount was
    // below the possible remainder, redistribute the difference to the
    // other unpaid parts so the receipt total always stays exact.
    const others=ps.filter((x,i)=>i!==index&&!x.paid);
    const otherTarget=Math.max(0,totalCents-paidCents-requested);
    distributeCentsEvenly(others,otherTarget);
  }

  syncSplitPaymentUI();
}

function confirmPaymentScreen(method){
  if(!canFulfillCart()) return;
  const total=cartTotal();
  if(method==='cash'){
    const given=Math.round(paymentGivenValue()*100)/100;
    if(given+0.0001<total){flash('Недостаточно внесённой суммы');return;}
    const change=Math.round((given-total)*100)/100;
    finalizePayment([{method:'cash',amount:total,cashGiven:given,change:change,paid:true}]);
  }else{
    openCardPartConfirmation(total, ()=>finalizePayment([{method:'card',amount:total,cashGiven:null,change:null,paid:true}]));
  }
}
function finalizePayment(payments){
  const shift=currentShift(); if(!shift){flash('Смена не открыта');return;}
  const total=cartTotal();
  const clean=payments.map(p=>({method:p.method,amount:Math.round(Number(p.amount||0)*100)/100,cashGiven:p.cashGiven!=null?Number(p.cashGiven):null,change:p.change!=null?Number(p.change):null}));
  const paidTotal=Math.round(clean.reduce((s,p)=>s+p.amount,0)*100)/100;
  if(Math.abs(paidTotal-total)>0.001){flash('Сумма платежей не совпадает с суммой чека');return;}
  const cashAmount=clean.filter(p=>p.method==='cash').reduce((s,p)=>s+p.amount,0);
  const deliveryFee=state.orderType==='Доставка'?Number(state.deliveryFee||0):0;
  if(deliveryFee>0){const t=shiftTotals(shift.id);const available=Number(shift.openingCash||0)+Number(t.cash||0)+Number(t.netMovements||0)+cashAmount;if(deliveryFee>available+0.0001){flash('Недостаточно наличных в кассе для списания доставки');return;}}
  if(!state.cart.length){flash('Заказ пуст');return;}
  let stockConsumption;
  try{ stockConsumption=checkedStockConsumption(state.cart); }
  catch(e){ flash(e.message); return; }
  const method=clean.length===1?clean[0].method:'split';
  const receiptSequence=(state.orders.filter(o=>o.shiftId===shift.id).length+1);
  const shiftEmployee=state.employees.find(e=>e.id===shift.employeeId);
  const order={id:uid(),shiftId:shift.id,receiptNumber:receiptSequence,receiptDisplayNumber:`#${receiptSequence}`,employeeId:shift.employeeId||'',employeeName:shiftEmployee?.name||shiftEmployee?.fullName||'Сотрудник',registerName:'POS 1',method,total,payments:clean,cashGiven:method==='cash'?clean[0].cashGiven:null,change:method==='cash'?clean[0].change:null,orderLabel:state.orderLabel||'',orderType:state.orderType,deliveryFee:deliveryFee,customer:JSON.parse(JSON.stringify(state.customer)),items:state.cart.map(i=>{const d=state.discounts.find(x=>x.id===i.discountId),product=getProduct(i.productId);return {...i,category:product?.category||i.category||'',discountName:d?.name||'',discountType:d?.type||'',discountValue:Number(d?.value)||0,cost:product?(product.type==='simple'?product.cost:compositeCost(product)):0};}),timestamp:Date.now()};
  order.stockConsumption=stockConsumption;
  for(const item of stockConsumption.items){
    const p=getProduct(item.productId);
    p.stock=roundStockQty(Math.max(0,Number(p.stock)-item.qty));
  }
  state.orders.push(order);
  if(deliveryFee>0){if(!Array.isArray(shift.cashMovements))shift.cashMovements=[];shift.cashMovements.push({id:uid(),type:'withdrawal',subtype:'delivery',amount:deliveryFee,timestamp:Date.now(),note:'🚗 Доставка'});}
  saveKey('products',state.products);saveKey('orders',state.orders);saveKey('shifts',state.shifts);
  resetCurrentOrderState();state._splitPayments=[];state._splitCount=0;
  clearCurrentOrderSession();
  render();showReceipt(order);setTimeout(()=>{if(typeof window.printCompletedOrder==='function')window.printCompletedOrder(order);else if(state.printer?.autoPrint)sendOrderToPrint(order);window.__currentOrderKitchenPrinted=false},250);
}

function receiptItemDiscount(i){
  if(!i || !i.discountName) return 0;
  const base=Number(i.price||0)*Number(i.qty||0);
  return i.discountType==='percent' ? base*Math.max(0,Math.min(100,Number(i.discountValue)||0))/100 : Math.min(base,Math.max(0,Number(i.discountValue)||0)*Number(i.qty||0));
}
function receiptItemTotal(i){ return Math.max(0,Number(i.price||0)*Number(i.qty||0)-receiptItemDiscount(i)); }

    ${order.customer && (order.customer.name||order.customer.phone||order.customer.address) ? `<div class="receipt-customer">${escapeHtml(order.customer.name||'')} ${escapeHtml(order.customer.phone||'')} ${escapeHtml(order.customer.address||'')}</div>`:''}
    ${lines}
    ${Number(order.deliveryFee||0)>0 ? `<div class="receipt-line"><span>Доставка</span><span>${fullMoney(order.deliveryFee)}</span></div>` : ''}

      ${order.payments.filter(p=>p.method==='cash' && p.cashGiven!=null).map(p=>`<div class="receipt-line" style="font-size:12px;"><span>Наличные · внесено</span><span>${fullMoney(p.cashGiven)}</span></div><div class="receipt-line" style="font-size:12px;"><span>Сдача</span><span>${fullMoney(p.change||0)}</span></div>`).join('')}
    ` : order.method==='cash' ? `

function restoreOrderStock(order){
  if(Object.prototype.hasOwnProperty.call(order,'stockConsumption')){
    const saved=order.stockConsumption;
    if(!saved || saved.version!==1 || !Array.isArray(saved.items)) throw new Error('Некорректные данные списания чека');
    const seen=new Set();
    // Validate every target before changing any stock or return/cash state.
    const updates=saved.items.map(item=>{
      if(!item || seen.has(item.productId) || !Number.isFinite(item.qty) || item.qty<=0) throw new Error('Некорректные данные списания чека');
      seen.add(item.productId);
      const p=getProduct(item.productId);
      if(!p || p.type!=='simple') throw new Error('Не найден исходный складской товар для возврата');
      const stock=Number(p.stock);
      if(!Number.isFinite(stock) || !Number.isFinite(stock+item.qty)) throw new Error('Некорректный остаток для возврата');
      return {p,stock:stock+item.qty};
    });
    for(const update of updates) update.p.stock=roundStockQty(update.stock);
    return;
  }
  // Old receipts have no historical recipe. Preserve their legacy return path.

  for(const item of (order.items||[])){
    const p=getProduct(item.productId);
    if(!p) continue;
    if(p.type==='simple'){
      p.stock = roundStockQty(Number(p.stock||0) + Number(item.qty||0));
    }else{
      for(const c of (p.components||[])){
        const comp=getProduct(c.productId);
        if(productTracksStock(comp)) comp.stock = roundStockQty(Number(comp.stock||0) + Number(c.qty||0)*Number(item.qty||0));
      }
    }
  }
}

function processFullReturn(orderId){
  try{
    const order=state.orders.find(o=>String(o.id)===String(orderId));
    const shift=currentShift();
    if(!order){flash('Чек не найден');return;}
    if(order.returnedAt){flash('Этот чек уже возвращён');return;}
    if(!shift){flash('Для возврата откройте кассовую смену');return;}
    const total=Math.round(Number(order.total||0)*100)/100;
    if(!(total>=0)){flash('Некорректная сумма возврата');return;}
    const refundCash=Array.isArray(order.payments)?order.payments.filter(p=>p.method==='cash').reduce((s,p)=>s+Number(p.amount||0),0):(order.method==='cash'?total:0);
    if(refundCash>0){
      const t=shiftTotals(shift.id);
      const available=Number(shift.openingCash||0)+Number(t.cash||0)+Number(t.netMovements||0);
      if(refundCash>available+0.0001){flash('Недостаточно наличных в кассе для возврата');return;}
    }
    restoreOrderStock(order);
    const now=Date.now();
    order.returnedAt=now;
    order.returnedShiftId=shift.id;
    order.returnAmount=total;
    if(!Array.isArray(shift.cashMovements)) shift.cashMovements=[];
    if(refundCash>0){
      shift.cashMovements.push({id:uid(),type:'withdrawal',subtype:'refund',amount:refundCash,timestamp:now,note:'Возврат чека'});
    }
    saveKey('products',state.products);
    saveKey('orders',state.orders);
    saveKey('shifts',state.shifts);
    closeModal();
    render();
    setTimeout(()=>showModal(`
      <div class="modal-title">Возврат выполнен</div>
      <div class="settings-note">Товары возвращены на остатки. ${refundCash>0?'Наличная часть списана из текущей кассовой смены как «Возврат чека».':''}${(order.method==='card'||order.method==='split')?' Карточная часть возвращается через банковский терминал.':''}</div>
      <div class="field"><label>Сумма возврата</label><div style="font-size:26px;font-weight:800;">${fullMoney(total)}</div></div>
      <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="viewReceiptModal('${escapeAttr(order.id)}')">Открыть чек</button><button type="button" class="btn btn-primary" onclick="closeModal()">Готово</button></div>`),50);
  }catch(e){
    console.error('processFullReturn error',e);
    flash('Не удалось выполнить возврат: '+(e.message||'неизвестная ошибка'));
  }
}
