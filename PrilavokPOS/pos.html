/* Name/category-only CSV import. Additive, local, and explicitly confirmed. */
function cleanImportedProductName(value){
  return String(value||'').normalize('NFC').replace(/[\u200B-\u200D\uFEFF\uFE0F❄]/g,'').replace(/^[\s*#]+/,'').replace(/[\[\]]/g,' ').replace(/\bNo\s*(\d+)/g,'№ $1').replace(/\s+/g,' ').trim();
}
function importedProductPrice(value){
  const raw=String(value??'').trim();
  if(!raw||raw.toLocaleLowerCase('ru')==='изменяемая')return null;
  if(!/^\d+(?:[.,]\d{1,2})?$/.test(raw))throw new Error('Некорректная цена: '+raw);
  const price=Number(raw.replace(',','.'));
  if(!Number.isFinite(price)||price>Number.MAX_SAFE_INTEGER/100)throw new Error('Цена слишком велика');
  return price;
}
function parseProductCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0],delimiter=first.includes(';')&&!first.includes(',')?';':',';
  const rows=[];let row=[],cell='',quoted=false,closed=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else{quoted=false;closed=true;}}else cell+=c;continue;}
    if(c==='"'){if(cell||closed)throw new Error('Некорректные кавычки в CSV');quoted=true;continue;}
    if(c===delimiter){row.push(cell);cell='';closed=false;continue;}
    if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';closed=false;continue;}
    if(closed)throw new Error('Лишний текст после кавычек в CSV');cell+=c;
  }
  if(quoted)throw new Error('Незакрытые кавычки в CSV');
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
  if(rows.length<2)throw new Error('В файле нет товаров');
  const headers=rows.shift().map(v=>v.trim().normalize('NFC').toLowerCase());
  const nameIndex=headers.indexOf('название'),categoryIndex=headers.indexOf('категория'),priceIndex=headers.includes('цена')?headers.indexOf('цена'):headers.indexOf('цена [project]');
  if(nameIndex<0)throw new Error('Нужна колонка «Название»');
  if(new Set(headers).size!==headers.length)throw new Error('Повторяющиеся заголовки CSV');
  if(rows.length>5000)throw new Error('За один импорт можно добавить до 5000 товаров');
  return rows.map((r,i)=>{if(r.length!==headers.length)throw new Error('Неверное число колонок в строке '+(i+2));return {name:r[nameIndex],category:categoryIndex<0?'':r[categoryIndex],price:priceIndex<0?null:importedProductPrice(r[priceIndex])};});
}
function planProductImport(entries){
  const key=v=>String(v||'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru');
  const cats=new Map();for(const c of [...state.categoryOrder,...state.products.map(p=>p.category)])if(c&&c!=='Без категории')cats.set(key(c),c);
  const counts=new Map();for(const e of entries){const n=key(cleanImportedProductName(e.name));counts.set(n,(counts.get(n)||0)+1);}
  const known=new Set(state.products.map(p=>key(cleanImportedProductName(p.name)))),add=[],skipped=[];
  for(const entry of entries){
    let name=cleanImportedProductName(entry.name);
    if(counts.get(key(name))>1&&/^сырь[её]$/i.test(String(entry.category).normalize('NFC').trim()))name+=' (сырьё)';
    if(!name)throw new Error('Найден товар без названия');
    if(name.length>200)throw new Error('Название длиннее 200 символов: '+name.slice(0,40));
    if(known.has(key(name))){skipped.push(name);continue;}known.add(key(name));
    add.push({name,category:cats.get(key(entry.category))||'',price:importedProductPrice(entry.price)});
  }
  return {add,skipped};
}
function openProductImport(){
  showModal(`<h2>Импорт товаров</h2><p>Добавить товары, цены и совпадающие категории из CSV.</p><p class="pe-note">Остатки и состав заполните вручную. Пустые и изменяемые цены нужно назначить после импорта. Существующие товары сохранятся.</p><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="chooseProductCSV()">Выбрать CSV</button></div><button class="btn btn-outline" style="margin-top:16px;width:100%" onclick="closeModal();importBackup()">Восстановить резервную копию JSON</button>`);
}
function chooseProductCSV(){
  const input=document.createElement('input');input.type='file';input.accept='.csv,text/csv';
  input.onchange=()=>{const file=input.files?.[0];if(!file)return;if(file.size>5*1024*1024){flash('Файл больше 5 МБ');return;}
    const reader=new FileReader();reader.onerror=()=>flash('Не удалось прочитать файл');reader.onload=()=>{try{window._productImportEntries=parseProductCSV(reader.result);previewProductImport();}catch(e){flash(e.message);}};reader.readAsText(file,'UTF-8');};input.click();
}
function previewProductImport(){
  const plan=planProductImport(window._productImportEntries||[]);
  window._productImportPreview=JSON.stringify(plan.add);

}
async function confirmProductImport(){
  if(window._productImportBusy)return;
  const plan=planProductImport(window._productImportEntries||[]);
  if(JSON.stringify(plan.add)!==window._productImportPreview){previewProductImport();flash('Список обновился — проверьте импорт ещё раз');return;}
  if(!plan.add.length)return;
  window._productImportBusy=true;
  const app=document.getElementById('app'),wasInert=app.inert;app.inert=true;
  const button=document.getElementById('product-import-confirm');if(button)button.disabled=true;
  try{
    const start=Math.max(0,...state.products.map(p=>Number(p.sortOrder)||0));
    const added=plan.add.map((p,i)=>({id:uid(),name:p.name,category:p.category,type:'simple',price:p.price??0,cost:0,stock:0,noStockTracking:false,availableOnline:false,imageUrl:'',tileSymbol:'',sortOrder:start+i+1}));
    const next=[...state.products,...added];
    try{await window.PrilavokCore.Storage.set('products',next);}
    catch(e){markStorageBroken(e);flash('Импорт не сохранён: '+(e.message||'ошибка хранилища'));if(button)button.disabled=false;return;}
    state.products=next;window._productImportEntries=null;window._productImportPreview=null;
    closeModal();render();flash('Добавлено товаров: '+added.length);
  }finally{app.inert=wasInert;window._productImportBusy=false;}
}

function productSearchText(value){return String(value||'').normalize('NFC').toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ').trim();}
function productMatchesSearch(product,query){return !query||(productSearchText(product.name)+' '+productSearchText(productCategoryKey(product))).includes(query);}
function sortProductsBy(key){
  if(!['name','category','type','price','cost','web','stock'].includes(key))return;
  const previous=window._productsSort||{key:'name',direction:1};
  window._productsSort={key,direction:previous.key===key?-previous.direction:1};
  render();
}
function sortedProductRows(){
  const {key,direction}=window._productsSort||{key:'name',direction:1};
  const value=p=>{
    if(key==='category')return productCategoryKey(p);
    if(key==='type')return p.type==='composite'?'Составной':'Простой';
    if(key==='web')return p.availableOnline!==false?1:0;
    if(key==='stock'){const n=p.noStockTracking?Infinity:availableStock(p);return Number.isFinite(n)?n:null;}
    if(key==='price'||key==='cost'){const n=Number(key==='cost'?compositeCost(p):p.price);return Number.isFinite(n)?n:null;}
    return p.name;
  };
  return state.products.map(p=>({p,value:value(p)})).sort((a,b)=>{
    if(a.value===null&&b.value!==null)return 1;
    if(b.value===null&&a.value!==null)return -1;
    const order=a.value===null?0:typeof a.value==='number'?a.value-b.value:String(a.value).localeCompare(String(b.value),'ru',{sensitivity:'base',numeric:true});
    return order*direction||a.p.name.localeCompare(b.p.name,'ru',{sensitivity:'base',numeric:true});
  }).map(row=>row.p);
}
function productSortHeader(key,label){
  const sort=window._productsSort||{key:'name',direction:1},active=sort.key===key;
  return `<button type="button" class="products-sort-header ${active?'selected':''}" onclick="sortProductsBy('${key}')" aria-label="${label}: ${active?(sort.direction===1?'по возрастанию':'по убыванию'):'сортировать'}">${label}<span class="product-sort-mark ${active?(sort.direction===1?'asc':'desc'):''}" aria-hidden="true"></span></button>`;
}

function confirmDelete(type,id){
  if(!['product','category'].includes(type))return;
  const pass=document.getElementById('delete-password')?.value||'';
  if(!(type==='product'&&currentShiftEmployeeIsAdmin()) && pass!=='Rom23061998'){ flash('Неверный пароль'); return; }

    closeModal(); render(); flash('Товар удалён');
    if(window._pmEditingId===id && document.getElementById('pe-save'))finishProductEditor();
  }
}

// Persist quantities in the original stock unit; display conversions never rewrite history.
const PRODUCT_UNITS={piece:{label:'шт.',kind:'count',scale:1},kg:{label:'кг',kind:'mass',scale:1000},g:{label:'г',kind:'mass',scale:1},l:{label:'л',kind:'volume',scale:1000},ml:{label:'мл',kind:'volume',scale:1}};
function stockUnit(p){return p?.type==='simple'?(p.stockUnit||''):(p?.recipeUnit||'piece');}
function compositeRecipeYield(p){const value=Number(p?.recipeYield);return p?.type==='composite'&&Number.isFinite(value)&&value>0?value:1;}
function inferredCompositeYield(components=window._pmComponents||[]){
  if(!components.length)return null;
  const kinds=new Set();
  const rows=[];
  for(const c of components){
    const p=getProduct(c.productId);if(!p)return null;
    const unit=stockUnit(p),meta=PRODUCT_UNITS[unit];if(!meta)return null;
    kinds.add(meta.kind);rows.push({p,c,unit,meta});
  }
  if(kinds.size!==1)return null;
  const kind=[...kinds][0];if(kind==='count')return {qty:rows.reduce((sum,r)=>sum+(r.p.type==='composite'?Number(r.c.qty||0)*compositeRecipeYield(r.p):Number(r.c.qty||0)),0),unit:'piece'};
  const target=kind==='mass'?'g':'ml';
  let qty=0;
  for(const r of rows){
    const raw=r.p.type==='composite'?Number(r.c.qty||0)*compositeRecipeYield(r.p):Number(r.c.qty||0);
    qty+=convertProductQty(raw,r.p.type==='composite'?(r.p.recipeUnit||r.unit):r.unit,target);
  }
  return Number.isFinite(qty)&&qty>0?{qty:Number(qty.toPrecision(15)),unit:target}:null;
}
function syncInferredCompositeYield(){
  if(window._pmRecipeYieldManual)return;
  const inferred=inferredCompositeYield();
  if(inferred){window._pmRecipeYield=inferred.qty;window._pmRecipeUnit=inferred.unit;}
}
function componentBaseQty(product,qty,unit){
  qty=Number(qty);if(!Number.isFinite(qty)||qty<=0)throw new Error('Количество ингредиента должно быть больше нуля');
  const base=stockUnit(product);
  if(product?.type==='composite'){
    const recipeUnit=product.recipeUnit||'piece',yieldQty=compositeRecipeYield(product);
    const requested=convertProductQty(qty,unit||recipeUnit,recipeUnit);
    return requested/yieldQty;
  }
  return convertProductQty(qty,unit||base,base);
}
function unitLabel(unit){return PRODUCT_UNITS[unit]?.label||'ед. (не задана)';}
function convertProductQty(qty,from,to){
  if(from===to)return Number(qty);
  const a=PRODUCT_UNITS[from],b=PRODUCT_UNITS[to];
  if(!a||!b||a.kind!==b.kind)throw new Error('Несовместимые единицы измерения');
  const value=Number(qty)*a.scale/b.scale;
  if(!Number.isFinite(value))throw new Error('Некорректное количество');
  return Number(value.toPrecision(15));
}
function productUnitOptions(base,selected){
  const units=Object.keys(PRODUCT_UNITS).filter(u=>!base||PRODUCT_UNITS[u].kind===PRODUCT_UNITS[base]?.kind);
  return (!base?'<option value="">Не задана — прежний учёт</option>':'')+units.map(u=>`<option value="${u}" ${u===selected?'selected':''}>${unitLabel(u)}</option>`).join('');
}
function changeProductDisplayUnit(unit){
  const old=window._pmUnit||'',base=window._pmBaseUnit||'';
  try{
    if(base && !unit)throw new Error('Нельзя убрать назначенную единицу');
    if(old && unit){
      const stock=document.getElementById('pf-stock'),cost=document.getElementById('pf-cost'),minimum=document.getElementById('pf-min-stock');
      const factor=convertProductQty(1,old,unit);
      if(stock?.value!=='')stock.value=convertProductQty(stock.value,old,unit);
      if(cost?.value!=='')cost.value=Number((Number(cost.value)/factor).toPrecision(15));
      if(minimum?.value!=='')minimum.value=convertProductQty(minimum.value,old,unit);
    }
    window._pmUnit=unit;
    if(!window._pmBaseUnit && unit)window._pmBaseUnit=unit;
    captureSimpleProductDraft();renderTypeFields();
  }catch(e){document.getElementById('pf-unit').value=old;flash(e.message);}
}
function captureSimpleProductDraft(){
  window._pmSimpleDraft={purchaseUnit:document.getElementById('pf-purchase-unit')?.value,packSize:document.getElementById('pf-pack-size')?.value,contentUnit:document.getElementById('pf-purchase-content-unit')?.value,cost:document.getElementById('pf-cost')?.value??'',stock:document.getElementById('pf-stock')?.value??'',minimum:document.getElementById('pf-min-stock')?.value??'',noStock:!!document.getElementById('pf-no-stock')?.checked};
}
function componentDisplayUnit(c){const p=getProduct(c.productId),base=stockUnit(p);return c.displayUnit||base;}
function componentDisplayQty(c){const p=getProduct(c.productId),unit=componentDisplayUnit(c);if(p?.type==='composite')return convertProductQty(Number(c.qty||0)*compositeRecipeYield(p),p.recipeUnit||'piece',unit);return convertProductQty(c.qty,stockUnit(p),unit);}
function changeComponentDisplayUnit(idx,unit){
  const c=window._pmComponents[idx];if(!c)return;
  try{const p=getProduct(c.productId);convertProductQty(1,p?.type==='composite'?(p.recipeUnit||'piece'):stockUnit(p),unit);c.displayUnit=unit;renderTypeFields();}catch(e){flash(e.message);}
}
function saveProductConfiguration(p){
  for(const [id,key] of [['pf-sku','sku'],['pf-note','internalNote']]){
    const field=document.getElementById(id);if(!field)continue;
    const value=field.value.trim();if(value)p[key]=value;else delete p[key];
  }
  if(p.type!=='simple')return;
  const unit=window._pmUnit||'',base=window._pmBaseUnit||unit;
  if(base){
    if(p.stockUnit && p.stockUnit!==base)throw new Error('Базовая единица уже назначена');
    p.stock=convertProductQty(p.stock,unit,base);
    p.cost=Number(p.cost)/convertProductQty(1,unit,base);
    p.stockUnit=base;p.stockDisplayUnit=unit;
  }
  const field=document.getElementById('pf-min-stock');
  if(field){
    if(field.value==='')delete p.minStock;
    else{const value=Number(field.value);if(!Number.isFinite(value)||value<0)throw new Error('Минимальный остаток должен быть неотрицательным');p.minStock=convertProductQty(value,unit,base);}
  }
}

function openProductModal(id){
  const editing=id?getProduct(id):null;
  if(id && !editing){flash('Товар не найден');return;}
  window._pmReturnScroll=document.querySelector('.screen.active')?.scrollTop||0;
  window._pmReturnFocus=document.activeElement;
  window._pmComponents=JSON.parse(JSON.stringify(editing?.components||[]));
  window._pmModifierGroups=JSON.parse(JSON.stringify(editing?.modifierGroups||[]));
  window._pmComponentCategory='Все';window._pmSearch='';
  window._pmStockUnlocked=currentShiftEmployeeIsAdmin();
  window._pmNoStockUnlocked=window._pmStockUnlocked;
  window._pmBaseUnit=editing?.stockUnit||'';window._pmUnit=editing?.stockDisplayUnit||window._pmBaseUnit;
  const factor=convertProductQty(1,window._pmBaseUnit,window._pmUnit);
  window._pmSimpleDraft={purchaseUnit:editing?.purchaseUnit??window._pmBaseUnit,packSize:editing?.purchasePackSize??'',contentUnit:editing?.purchaseContentUnit??window._pmBaseUnit,cost:editing?.cost==null?'':editing.cost/factor,stock:editing?.stock==null?'':convertProductQty(editing.stock,window._pmBaseUnit,window._pmUnit),minimum:editing?.minStock==null?'':convertProductQty(editing.minStock,window._pmBaseUnit,window._pmUnit),noStock:!!editing?.noStockTracking};
  window._pmType=editing?.type||'simple';window._pmEditingId=editing?.id||null;window._pmRecipeYield=editing?.recipeYield??1;window._pmRecipeUnit=editing?.recipeUnit||'piece';window._pmRecipeYieldManual=editing?.recipeYieldManual===true;
  window._pmImageData=null;window._pmRemoveImage=false;window._pmOnline=editing?.availableOnline!==false;
  window._pmSaving=false;window._pmSession=(window._pmSession||0)+1;
  renderProductModal(editing,window._pmType,[],state.categoryOrder.slice());
  window._pmInitial=productEditorSnapshot();
  updateProductEditorSummary();
  document.getElementById('pe-back')?.focus();
}
function productEditorSnapshot(){
  const value=id=>document.getElementById(id)?.value??'';
  return JSON.stringify({purchaseUnit:value('pf-purchase-unit'),packSize:value('pf-pack-size'),purchaseContentUnit:value('pf-purchase-content-unit'),sku:value('pf-sku'),note:value('pf-note'),unit:window._pmUnit,minimum:value('pf-min-stock'),name:value('pf-name'),category:value('pf-category'),symbol:value('pf-symbol'),price:value('pf-price'),type:window._pmType,
    cost:window._pmType==='simple'?value('pf-cost'):null,stock:window._pmType==='simple'?value('pf-stock'):null,
    noStock:window._pmType==='simple'?!!document.getElementById('pf-no-stock')?.checked:false,
    components:window._pmType==='composite'?window._pmComponents:[],modifierGroups:window._pmModifierGroups||[],recipeYield:window._pmType==='composite'?Number(document.getElementById('pf-recipe-yield')?.value||window._pmRecipeYield||1):null,recipeUnit:window._pmType==='composite'?(document.getElementById('pf-recipe-unit')?.value||window._pmRecipeUnit||'piece'):null,online:window._pmOnline,image:window._pmImageData,removeImage:window._pmRemoveImage});
}
function productEditorDirty(){return productEditorSnapshot()!==window._pmInitial;}
function finishProductEditor(nextId=null){
  document.getElementById('product-editor-root').innerHTML='';
  document.getElementById('app').inert=false;
  const screen=document.querySelector('.screen.active');if(screen)screen.scrollTop=window._pmReturnScroll||0;
  window._pmComponents=[];window._pmModifierGroups=[];window._pmImageData=null;window._pmEditingId=null;window._pmExitAction=null;
  if(nextId){openProductModal(nextId);return;}
  if(window._pmReturnFocus?.isConnected)window._pmReturnFocus.focus();
  else document.getElementById('products-search')?.focus({preventScroll:true});
}
function requestCloseProductEditor(nextId=null){
  if(window._pmSaving)return;
  if(!productEditorDirty()){finishProductEditor(nextId);return;}
  window._pmExitAction=()=>finishProductEditor(nextId);
  showModal(`<div class="modal-title">Сохранить изменения?</div><div class="pe-note">В карточке есть несохранённые изменения.</div><div class="pe-exit-actions"><button class="btn btn-primary" onclick="saveProductEditor(true)">Сохранить и продолжить</button><button class="btn btn-secondary" onclick="const action=window._pmExitAction;closeModal();action&&action()">Не сохранять</button><button class="btn btn-outline" onclick="closeModal()">Остаться в карточке</button></div>`);
}
async function saveProductEditor(continueNavigation=false){
  if(window._pmSaving)return;
  window._pmSaving=true;
  const button=document.getElementById('pe-save');button.disabled=true;button.textContent='Сохранение…';
  document.getElementById('pe-back').disabled=true;
  const body=document.querySelector('.pe-layout');body.inert=true;
  closeModal();
  try{
    const saved=await saveProduct(window._pmEditingId||'');
    if(saved){
      const action=continueNavigation?window._pmExitAction:null;
      if(action)action();else finishProductEditor();
    }
  }catch(e){flash('Не удалось сохранить товар: '+(e.message||'ошибка'));}
  finally{
    window._pmSaving=false;
    if(button.isConnected){button.disabled=false;button.textContent='Сохранить';document.getElementById('pe-back').disabled=false;body.inert=false;}
  }
}
function selectProductEditorSection(section){
  document.querySelectorAll('[data-pe-panel]').forEach(el=>{el.hidden=el.dataset.pePanel!==section;});
  document.querySelectorAll('[data-pe-tab]').forEach(el=>{el.classList.toggle('selected',el.dataset.peTab===section);el.setAttribute('aria-pressed',String(el.dataset.peTab===section));});
  document.querySelector('.pe-content').scrollTop=0;
}
function renderProductUsage(id){
  if(!id)return '<div class="pe-empty">Связи появятся после сохранения товара.</div>';
  const parents=state.products.filter(p=>p.id!==id && productDependsOn(p.id,id));
  const receipts=state.orders.filter(o=>(o.items||[]).some(i=>i.productId===id)||o.stockConsumption?.items?.some(i=>i.productId===id)).length;
  const parked=state.parked.filter(o=>(o.items||[]).some(i=>i.productId===id)).length;
  return `<p class="pe-note">Связи сохранённого товара. Изменение ингредиента влияет на рецептуры, в которых он используется.</p>
    <div class="pe-section-heading"><h2>Входит в состав</h2><span class="pe-badge">${parents.length}</span></div>
    ${parents.length?parents.map(p=>`<button type="button" class="pe-usage-row" onclick="requestCloseProductEditor(${escapeAttr(JSON.stringify(p.id))})"><span><strong>${escapeHtml(p.name)}</strong><small>${(p.components||[]).some(c=>c.productId===id)?'Прямой состав':'Через другие составные товары'}</small></span><span aria-hidden="true">→</span></button>`).join(''):'<div class="pe-empty">Этот товар пока не входит в другие рецептуры.</div>'}

function updateProductEditorSummary(){

function switchProductType(t){
  const existing=getProduct(window._pmEditingId);
  if(existing && existing.type!==t && (existing.stockUnit || state.products.some(p=>p.id!==existing.id && productDependsOn(p.id,existing.id)))){flash('Тип товара с единицами или связями нельзя менять: создайте отдельный товар');return;}

  if(window._pmType==='simple')captureSimpleProductDraft();
  window._pmType = t;
  document.querySelectorAll('.product-type-switch').forEach(btn=>{
    btn.classList.toggle('selected', btn.dataset.type===t);
  });
  renderTypeFields();
}

function productDependsOn(productId, targetId, seen=new Set()){
  if(productId===targetId) return true;
  if(seen.has(productId)) return false;
  seen.add(productId);
  const p=getProduct(productId);
  if(!p || p.type!=='composite') return false;
  return (p.components||[]).some(c=>productDependsOn(c.productId,targetId,seen));
}

      const n=networkConfigFromState();
      if(!n.backendUrl || !n.deviceKey) throw new Error('Нет подключения к backend');
      const r=await fetch(n.backendUrl.replace(/\/+$/,'')+'/api/media/upload',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Key':n.deviceKey},body:JSON.stringify({productId:p.id,dataUrl:window._pmImageData}),cache:'no-store'});
      const d=await r.json().catch(()=>null);
      if(!r.ok) throw new Error(r.status===413?'Фото слишком большое для сервера. Выберите фото заново, чтобы уменьшить размер.':(d?.error||('HTTP '+r.status)));
      p.imageUrl=d.url||'';
    }
    if(editingId && JSON.stringify(getProduct(editingId))!==originalProduct)throw new Error('Товар изменился во время сохранения. Откройте карточку заново');
    if(editingId)state.products[state.products.findIndex(x=>x.id===editingId)]=p;
    else state.products.push(p);
    saveKey('products', state.products);
    syncCategoryOrder();
    closeModal(); render(); flash('Товар сохранён');
    return true;
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Сохранить'; }
    flash('Не удалось сохранить товар: '+(e?.message||'ошибка'));
  }
}

function handleProductImage(input){
  const file=input?.files?.[0]; if(!file) return;
  const session=window._pmSession;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      if(session!==window._pmSession || !document.getElementById('pe-save'))return;
      let dataUrl='';
      const c=document.createElement('canvas');
      const ctx=c.getContext('2d');
      if(!ctx){flash('Не удалось подготовить фото');return;}
      for(let attempt=0;attempt<8 && !dataUrl;attempt++){
        const scale=Math.min(1,(1200*Math.pow(.75,attempt))/Math.max(img.width,img.height));
        c.width=Math.max(1,Math.floor(img.width*scale));c.height=Math.max(1,Math.floor(img.height*scale));
        ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        for(const quality of [.82,.7,.55]){
          const candidate=c.toDataURL('image/jpeg',quality);
          if(candidate.startsWith('data:image/jpeg;base64,') && candidate.length<=800023){dataUrl=candidate;break;}
        }
      }
      if(!dataUrl){flash('Не удалось уменьшить фото. Выберите другое изображение.');return;}
      window._pmImageData=dataUrl;
      window._pmRemoveImage=false;
      const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML=`<img src="${window._pmImageData}" alt="">`;
      updateProductEditorSummary();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

  const el=document.getElementById('pf-image-preview'); if(el) el.innerHTML='<div class="product-image-empty">📷 Фото будет удалено после сохранения</div>';
}

/* Supplier requests and invoice quantities are deliberately separate. */
function purchaseUnitLabel(unit){return unit==='pack'?'упаковка':unit==='box'?'коробка':unit==='bottle'?'бутылка':unitLabel(unit);}
function requestedQuantityText(item){const unit=item.requestedUnit??item.stockUnit??stockUnit(getProduct(item.productId));const base=`${item.requestedQty??item.qty} ${purchaseUnitLabel(unit)}`;return ['bottle','pack','box'].includes(unit)&&item.packSize?`${base} × ${item.packSize} ${unitLabel(item.contentUnit||item.stockUnit||stockUnit(getProduct(item.productId)))}`:base;}
function purchaseUnitOptions(p,selected){
  const base=stockUnit(p),units=[...Object.keys(PRODUCT_UNITS).filter(u=>base && PRODUCT_UNITS[u].kind===PRODUCT_UNITS[base]?.kind),'bottle','pack','box'];
  if(!base)units.unshift('');
  return units.map(u=>`<option value="${u}" ${u===selected?'selected':''}>${purchaseUnitLabel(u)}</option>`).join('');
}
function makePurchaseLine(p,qty,unit,packSize,contentUnit){
  qty=Number(qty);if(!Number.isFinite(qty)||qty<=0)throw new Error('Количество заказа должно быть больше нуля');
  const base=stockUnit(p),pack=['bottle','pack','box'].includes(unit),inside=contentUnit||base;
  let expected=null;
  if(pack){
    if(packSize!=='' && packSize!=null){
      const size=Number(packSize);if(!Number.isFinite(size)||size<=0)throw new Error('Количество в единице закупки должно быть больше нуля');
      expected=convertProductQty(qty*size,inside,base);
    }
  } else expected=convertProductQty(qty,unit,base);
  if(expected!==null && (!Number.isFinite(expected)||expected<=0))throw new Error('Некорректное количество заказа');
  return {productId:p.id,productName:p.name,qty:expected??0,requestedQty:qty,requestedUnit:unit,stockUnit:base,contentUnit:inside,expectedQty:expected,packSize:pack&&packSize!==''&&packSize!=null?Number(packSize):null,timestamp:Date.now()};
}
function updatePurchaseRequest(productId){
  const row=[...document.querySelectorAll('[data-purchase-row]')].find(r=>r.dataset.purchaseRow===productId);if(!row)return;
  const qty=row.querySelector('[data-request-qty]').value,unit=row.querySelector('[data-request-unit]').value,size=row.querySelector('[data-request-size]').value,contentUnit=row.querySelector('[data-content-unit]')?.value||stockUnit(getProduct(productId));
  const idx=state.purchaseOrderCart.findIndex(x=>x.productId===productId);
  const draft={productId,requestedQty:qty,requestedUnit:unit,packSize:size,contentUnit};
  if(qty!==''){if(idx<0)state.purchaseOrderCart.push(draft);else state.purchaseOrderCart[idx]=draft;}else if(idx>=0)state.purchaseOrderCart.splice(idx,1);
  row.querySelectorAll('[data-pack-field]').forEach(el=>el.hidden=!['bottle','pack','box'].includes(unit));
  const note=row.querySelector('[data-request-note]');
  try{const line=makePurchaseLine(getProduct(productId),qty,unit,size,contentUnit);note.textContent=line.expectedQty===null?'Количество внутри уточняется при приёмке':`На склад поступит: ${line.expectedQty} ${unitLabel(line.stockUnit)}`;}catch(e){note.textContent=qty===''?'Укажите количество':e.message;}
  const button=document.getElementById('po-create');if(button)button.disabled=!state.purchaseOrderCart.length;
}
function finalizePurchaseOrder(){
  const supplier=getPurchaseOrderSupplier();if(!supplier){flash('Выберите поставщика');return;}
  try{
    const items=state.purchaseOrderCart.map(x=>{
      const p=getProduct(x.productId);if(!p||p.type!=='simple')throw new Error('Товар недоступен: '+(p?.name||x.productId));
      const supplierProductIds=(supplier.productIds||[]).map(String);if(supplierProductIds.length && !supplierProductIds.includes(String(p.id)))throw new Error('Товар «'+p.name+'» больше не привязан к выбранному поставщику');
      const line=makePurchaseLine(p,x.requestedQty??x.qty,x.requestedUnit??stockUnit(p),x.packSize??'',x.contentUnit??p.purchaseContentUnit??stockUnit(p)); p.purchaseUnit=line.requestedUnit; p.purchasePackSize=line.packSize??undefined; p.purchaseContentUnit=line.contentUnit; return line;
    });
    if(!items.length)throw new Error('Добавьте хотя бы один товар');
    const order={id:uid(),requestVersion:1,supplierId:supplier.id,supplierName:supplier.name,items,status:'pending',timestamp:Date.now()};
    state.purchaseOrders.push(order);saveKey('products',state.products);saveKey('purchaseOrders',state.purchaseOrders);state.purchaseOrderCart=[];render();viewPurchaseOrder(order.id);

}

function purchaseQuantityKey(key){

function invoiceReceivingItems(d){
  if(!d.lines.length)throw new Error('Добавьте товары');
  return d.lines.map(line=>{
    const p=getProduct(line.productId);if(!p||p.type!=='simple')throw new Error('Товар удалён или изменил тип');
    if(line.qtyInput===''||line.totalInput==='')throw new Error('Заполните количество и сумму каждой строки');
    const invoiceQty=Number(line.qtyInput),total=Number(line.totalInput);
    if(!Number.isFinite(invoiceQty)||invoiceQty<0||!Number.isFinite(total)||total<0||(invoiceQty===0&&total!==0))throw new Error('Проверьте количество и сумму: '+p.name);
    const isPack=['bottle','pack','box'].includes(line.unit);
    let qty;
    if(isPack){const size=Number(line.packSize);if(!Number.isFinite(size)||size<=0)throw new Error('Укажите количество внутри: '+p.name);qty=convertProductQty(invoiceQty*size,line.contentUnit||stockUnit(p),stockUnit(p));}
    else qty=convertProductQty(invoiceQty,line.unit,stockUnit(p));
    return {productId:p.id,productName:p.name,qty,unitCost:qty>0?total/qty:0,totalCost:total,stockUnit:stockUnit(p),invoiceQty,invoiceUnit:line.unit,packSize:isPack?Number(line.packSize):null,contentUnit:line.contentUnit||stockUnit(p),invoiceUnitPrice:invoiceQty>0?total/invoiceQty:0};
  });
}
function receivingStockUpdates(items){
  const updates=new Map();
  for(const item of items){
    const p=getProduct(item.productId);if(!p||p.type!=='simple')throw new Error('Товар приёмки недоступен');
    if(!Number.isFinite(item.qty)||item.qty<0||!Number.isFinite(item.totalCost)||item.totalCost<0)throw new Error('Некорректная строка приёмки');
    const old=updates.get(p.id)||{id:p.id,stock:Number(p.stock)||0,cost:Number(p.cost)||0};
    if(item.qty>0){
      const oldQty=Math.max(0,old.stock),newQty=oldQty+item.qty;
      const cost=p.noStockTracking?item.totalCost/item.qty:(oldQty*old.cost+item.totalCost)/newQty;
      if(!Number.isFinite(cost)||!Number.isFinite(old.stock+item.qty))throw new Error('Количество или стоимость слишком велики');
      updates.set(p.id,{id:p.id,stock:p.noStockTracking?old.stock:old.stock+item.qty,cost});
    }
  }
  return [...updates.values()];
}
function receivingDiscrepancy(order,items){
  if(!order)return false;
  return order.items.some(i=>{
    const expected=i.expectedQty===null?null:Number(i.expectedQty??i.qty),actual=items.filter(x=>x.productId===i.productId).reduce((s,x)=>s+x.qty,0);
    return expected===null?actual===0:Math.abs(actual-expected)>Number.EPSILON*16*Math.max(1,actual,expected);
  });
}

function applyReceivingDocument(){
  const pending=window._receivingPending;if(!pending||window._receivingSaving)return;

    const record={id:uid(),type:order?'purchaseOrder':'purchase',purchaseOrderId:order?.id||'',supplierId:order?.supplierId||supplier?.id||'',supplierName:order?.supplierName||supplier?.name||'',items,totalCost:Math.round(items.reduce((s,i)=>s+i.totalCost,0)*100)/100,shortage,invoiceNumber:pending.draft.invoiceNumber.trim(),invoiceDate:pending.draft.invoiceDate,timestamp:now};

    if(!order){state.receivingCart=[];saveKey('receivingDraft',null);}

  }catch(e){flash('Приёмка не выполнена: '+e.message);}

function getPurchaseOrderSupplier(){
  return state.suppliers.find(s=>s.id===state.purchaseOrderSupplierId) || null;
}
function productConsumptionSince(productId, supplierId){
  const supplierOrders = state.purchaseOrders
    .filter(o=>o.supplierId===supplierId)
    .flatMap(o=>Array.isArray(o.items)?o.items:[])
    .filter(i=>i.productId===productId)
    .sort((a,b)=>b.timestamp-a.timestamp);
  const lastOrderTs = supplierOrders.length ? supplierOrders[0].timestamp : 0;
  let qty = 0;
  for(const order of state.orders){
    if(Number(order.timestamp||0) <= lastOrderTs) continue;
    for(const item of (order.items||[])){
      qty += consumedSimpleProductQty(item.productId, Number(item.qty)||0, productId);
    }
  }
  return {qty, lastOrderTs};
}
function consumedSimpleProductQty(productId, soldQty, targetId, trail=new Set()){
  if(!soldQty || !productId) return 0;
  if(productId===targetId) return soldQty;
  if(trail.has(productId)) return 0;
  const p=getProduct(productId);
  if(!p || p.type!=='composite') return 0;
  const nextTrail=new Set(trail); nextTrail.add(productId);
  return (p.components||[]).reduce((sum,c)=>sum+consumedSimpleProductQty(c.productId, soldQty*(Number(c.qty)||0), targetId, nextTrail),0);
}
function purchaseOrderText(order){
  const lines=[];
  lines.push(`Заказ поставщику: ${order.supplierName}`);
  lines.push(`Дата: ${fmtDate(order.timestamp)}`);
  lines.push('');
  lines.push(...order.items.map((i,idx)=>`${idx+1}. ${i.productName} — ${requestedQuantityText(i)}`));
  lines.push('');
  lines.push('Просьба подтвердить наличие и сроки поставки.');
  return lines.join('\n');
}
function selectPurchaseOrderSupplier(id){
  if(state.purchaseOrderCart.length && id!==state.purchaseOrderSupplierId){
    flash('Сначала завершите текущий заказ');
    render(); return;
  }
  state.purchaseOrderSupplierId=id||'';
  state.purchaseOrderCart=[];
  render();
}
function updatePurchaseQty(productId,value){
  const qty=Math.max(0,parseFloat(value)||0);
  const idx=state.purchaseOrderCart.findIndex(x=>x.productId===productId);
  if(qty>0){
    if(idx>=0) state.purchaseOrderCart[idx].qty=qty;
    else state.purchaseOrderCart.push({productId,qty});
  } else if(idx>=0){ state.purchaseOrderCart.splice(idx,1); }
  const btn=document.querySelector('.content-screen.active .btn-primary');
  if(btn && btn.textContent.includes('Сформировать')) btn.disabled=!state.purchaseOrderCart.length;
}
function viewPurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const deletedLabel=order.status==='deleted' ? `<div class=\"badge deleted-admin\" style=\"display:inline-block;margin-bottom:12px;\">Удалено администратором</div>` : '';
  const text=purchaseOrderText(order);
  showModal(`
    <div class="modal-title">Заказ поставщику</div>${deletedLabel}
    <div style="font-size:14px;color:var(--muted);margin-bottom:14px;"><strong style="color:var(--text);">${escapeHtml(order.supplierName)}</strong><br>${fmtDate(order.timestamp)}</div>
    <pre id="purchase-order-text" style="white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0;">${escapeHtml(text)}</pre>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="copyPurchaseOrder('${order.id}')">Скопировать текст</button>
      <button class="btn btn-secondary" onclick="sharePurchaseOrder('${order.id}')">Поделиться</button>
      <button class="btn btn-primary" onclick="closeModal()">Готово</button>

async function copyPurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const text=purchaseOrderText(order);
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  flash('Текст заказа скопирован');
}
function sharePurchaseOrder(id){
  const order=state.purchaseOrders.find(o=>o.id===id); if(!order) return;
  const payload={
    id: order.id,
    supplierName: order.supplierName || 'Поставщик',
    timestamp: order.timestamp || Date.now(),
    items: (order.items||[]).map(i=>({productName:i.productName||'', qty:Number(i.requestedQty??i.qty)||0,quantityText:requestedQuantityText(i)})),
    company: {
      legalName: state.company?.legalName || '',
      address: state.company?.address || '',
      deliveryAddress: state.company?.deliveryAddress || ''
    }
  };
  if(window.webkit?.messageHandlers?.printer){
    window.webkit.messageHandlers.printer.postMessage({action:'sharePurchaseOrder',order:payload});
    return;
  }
  // Резервный вариант для запуска вне нативного приложения.
  const text=purchaseOrderText(order);
  if(navigator.share){
    navigator.share({title:`Заказ поставщику — ${order.supplierName}`,text}).catch(()=>{});
  }else{
    copyPurchaseOrder(id);
  }
}

  const orders=shiftOrders(shift.id).slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const t=shiftTotals(shift.id);
  const expected=(Number(shift.openingCash)||0)+t.cash+t.netMovements;
  const counted=Number(shift.countedCash)||0;
  const diff=counted-expected;
  const report=buildShiftReportPayload(shift);
  showModal(`
    <div class="modal-title">Отчёт по смене</div>
    <div class="list-row-sub" style="margin-bottom:14px;">${fmtDate(shift.openedAt)} — ${fmtDate(shift.closedAt)} · ${escapeHtml(shift.employeeName||'Сотрудник не указан')}</div>
    <div class="grid-3">
      <div class="stat-box"><div class="label">Заказов</div><div class="value">${t.count}</div></div>
      <div class="stat-box"><div class="label">Выручка</div><div class="value">${money(t.total)}</div></div>
      <div class="stat-box"><div class="label">Наличные</div><div class="value">${money(t.cash)}</div></div>
    </div>
    <div class="grid-2" style="margin-top:12px;">
      <div class="stat-box"><div class="label">Карта</div><div class="value">${money(t.card)}</div></div>
      <div class="stat-box"><div class="label">Расхождение</div><div class="value" style="color:${Math.abs(diff)<0.01?'var(--text)':'var(--danger)'};">${money(diff)}</div></div>
    </div>
    <div class="grid-2" style="margin-top:12px;">
      <div class="stat-box"><div class="label">Внесено наличных</div><div class="value">${money(t.deposits)}</div></div>
      <div class="stat-box"><div class="label">Изъято наличных</div><div class="value">${money(t.withdrawals)}</div></div>
    </div>
    <div style="margin-top:16px;font-weight:800;">Движение наличных</div>
    <div style="max-height:180px;overflow:auto;border-top:1px solid var(--border);margin-top:8px;">
      ${t.movements.length ? t.movements.slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).map(m=>`<div class="list-row"><div style="flex:1;"><div class="list-row-name">${m.type==='deposit'?'Внесение наличных':(m.subtype==='delivery'||m.note==='🚗 Доставка'?'🚗 Доставка':(m.subtype==='refund'||m.note==='↩️ Возврат чека'?'↩️ Возврат чека':'Изъятие наличных'))}</div><div class="list-row-sub">${fmtDate(m.timestamp)}${m.note?' · '+escapeHtml(m.note):''}</div></div><div class="badge">${m.type==='deposit'?'+':'−'}${money(m.amount)}</div></div>`).join('') : '<div class="center-note">Движения наличных не было</div>'}
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button><button class="btn btn-primary" onclick="printShiftReport('${escapeAttr(shift.id)}')">Распечатать отчёт</button></div>
  `, true);
}
function printShiftReport(shiftId){
  const shift=state.shifts.find(s=>s.id===shiftId); if(!shift) return;
  const payload=buildShiftReportPayload(shift);
  if(window.webkit?.messageHandlers?.printer){window.webkit.messageHandlers.printer.postMessage({action:'printShiftReport',report:payload});return;}
  window.print();
}

/* ============================= SUPPLIERS ============================= */
function openSupplierModal(id=''){
  const supplier = state.suppliers.find(s=>s.id===id);
  const editing = !!supplier;
  const selected = new Set(Array.isArray(supplier?.productIds) ? supplier.productIds : []);
  const products = state.products.filter(p=>p.type==='simple').slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  showModal(`
    <div class="modal-title">${editing?'Товары поставщика':'Новый поставщик'}</div>
    <div class="field">
      <label>Название поставщика</label>
      <input id="sf-name" type="text" value="${escapeAttr(supplier?.name||'')}" placeholder="Например, ООО Поставщик">
    </div>
    <div style="font-weight:800;margin:14px 0 8px;">Товары на поставщике</div>
    <div class="settings-note" style="margin-bottom:10px;">Выберите товары, которые обычно закупаются у этого поставщика. В приёмке они будут показываться первыми.</div>
    <div class="field" style="margin-bottom:10px;"><input id="supplier-product-search" type="search" placeholder="Поиск товара или категории" autocomplete="off" oninput="filterSupplierProducts(this.value)"></div>
    <div id="supplier-product-list" style="max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;">
      ${products.length ? products.map(p=>`<label class="supplier-product-option" data-search="${escapeAttr((p.name+' '+(p.category||'')).toLocaleLowerCase('ru'))}" style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;">
        <input class="supplier-product-check" type="checkbox" value="${escapeAttr(p.id)}" ${selected.has(p.id)?'checked':''} style="width:20px;height:20px;">
        <span style="flex:1;min-width:0;">${escapeHtml(p.name)}</span>
        <span class="list-row-sub">${escapeHtml(p.category||'Без категории')}</span>
      </label>`).join('') : `<div class="center-note">Сначала создайте простые товары.</div>`}
      <div id="supplier-product-search-empty" class="center-note" style="display:none;">Товары не найдены.</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveSupplier('${escapeAttr(id)}')">${editing?'Сохранить':'Создать'}</button>
    </div>`, true);
}

function filterSupplierProducts(value){
  const query=String(value||'').trim().toLocaleLowerCase('ru');
  const options=[...document.querySelectorAll('#supplier-product-list .supplier-product-option')];
  let visible=0;
  options.forEach(row=>{const show=!query||(row.dataset.search||'').includes(query);row.style.display=show?'flex':'none';if(show)visible++;});
  const empty=document.getElementById('supplier-product-search-empty');if(empty)empty.style.display=options.length&&!visible?'block':'none';
}

function deleteSupplier(id){
  if(!canEditCompanySettings()){
    flash('Удалять поставщиков может только администратор при открытой им смене');
    return;
  }
  const supplier=state.suppliers.find(s=>s.id===id);
  if(!supplier) return;
  showModal(`
    <div class="modal-title">Удаление поставщика</div>
    <div class="center-note" style="padding:8px 0 14px;">Удалить поставщика «${escapeHtml(supplier.name)}» из списка?</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDeleteSupplier('${escapeAttr(id)}')">Удалить</button>
    </div>`, true);
}
function confirmDeleteSupplier(id){
  if(!canEditCompanySettings()){ closeModal(); flash('Удалять поставщиков может только администратор при открытой им смене'); return; }
  state.suppliers=state.suppliers.filter(s=>s.id!==id);
  saveKey('suppliers',state.suppliers);
  closeModal();
  render();
  flash('Поставщик удалён');
}

function saveSupplier(id=''){
  const name=(document.getElementById('sf-name')?.value||'').trim();
  if(!name){ flash('Введите название поставщика'); return; }
  const productIds=[...document.querySelectorAll('.supplier-product-check:checked')].map(x=>x.value);
  if(id){
    const s=state.suppliers.find(x=>x.id===id);
    if(!s){ flash('Поставщик не найден'); return; }
    s.name=name;
    s.productIds=productIds;
  }else{
    state.suppliers.push({id:uid(),name,productIds});
  }
  saveKey('suppliers',state.suppliers);
  closeModal();
  render();
  flash(id?'Поставщик сохранён':'Поставщик создан');
}

/* ============================= MODAL HELPERS ============================= */
function showModal(html, wide){
  window._posFolderModal=null;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal ${wide?'wide':''}">${html}</div>
    </div>`;
}
function closeModal(){ window._posFolderModal=null;document.getElementById('modal-root').innerHTML = ''; }

/* ============================= BACKUP ============================= */
function exportBackup(){
  const data={version:10,posNavigation:state.posNavigation,exportedAt:Date.now(),company:state.company,deliveryRates:state.deliveryRates,products:state.products,employees:state.employees,shifts:state.shifts,orders:state.orders,parked:state.parked,receivings:state.receivings,suppliers:state.suppliers,purchaseOrders:state.purchaseOrders,discounts:state.discounts,layout:{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='prilavok-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  flash('Резервная копия сохранена');
}
function importBackup(){
  const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json';
  input.onchange=()=>{ const file=input.files?.[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.products)) throw new Error(); state.products=d.products; state.employees=Array.isArray(d.employees)?d.employees:[]; state.shifts=d.shifts||[]; state.orders=d.orders||[]; state.parked=d.parked||[]; state.receivings=d.receivings||[]; state.suppliers=d.suppliers||[]; state.purchaseOrders=Array.isArray(d.purchaseOrders)?d.purchaseOrders:[]; state.company=Object.assign({establishmentName:'',legalName:'',address:'',deliveryAddress:''},d.company||{}); state.deliveryRates=Array.isArray(d.deliveryRates)?d.deliveryRates:[]; saveKey('deliveryRates',state.deliveryRates); state.discounts=Array.isArray(d.discounts)?d.discounts:[]; state.posNavigation=normalizePosNavigation(d.posNavigation);state.posFolder='';state.posPath=null;saveKey('posNavigation',state.posNavigation);state.categoryOrder=d.layout?.categoryOrder||[]; state.categoryColors=d.layout?.categoryColors||{}; state.categorySymbols=d.layout?.categorySymbols||{}; state.categoryOnline=d.layout?.categoryOnline||{}; state.categoryOrder.forEach(c=>{if(typeof state.categoryOnline[c]!=='boolean')state.categoryOnline[c]=true;}); state.layoutTiles=Array.isArray(d.layout?.tiles)?d.layout.tiles:state.products.map(p=>({type:'product',id:p.id})); saveKey('products',state.products); saveKey('employees',state.employees); saveKey('shifts',state.shifts); saveKey('orders',state.orders); saveKey('parked',state.parked); saveKey('receivings',state.receivings); saveKey('suppliers',state.suppliers); saveKey('purchaseOrders',state.purchaseOrders); saveKey('company',state.company); saveKey('discounts',state.discounts); saveKey('layout',{categoryOrder:state.categoryOrder,categoryColors:state.categoryColors,categorySymbols:state.categorySymbols,categoryOnline:state.categoryOnline,tiles:state.layoutTiles}); render(); flash('Данные восстановлены'); }catch(e){ flash('Не удалось прочитать резервную копию'); } }; r.readAsText(file); }; input.click();
}

/* ============================= UTIL ============================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
